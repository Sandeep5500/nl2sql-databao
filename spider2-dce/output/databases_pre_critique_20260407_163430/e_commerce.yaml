      - name: leads_closed
        columns:
        - name: mql_id
          type: TEXT
          nullable: true
          description: Unique identifier for a marketing-qualified lead.
        - name: seller_id
          type: TEXT
          nullable: true
          description: Unique identifier for the seller associated with the lead.
        - name: sdr_id
          type: TEXT
          nullable: true
          description: sdr_id is a nullable TEXT column representing the identifier
            for the Sales Development Representative associated with the lead.
        - name: sr_id
          type: TEXT
          nullable: true
          description: sr_id is a nullable TEXT column representing the identifier
            for a sales representative associated with a closed lead.
        - name: won_date
          type: TEXT
          nullable: true
          description: The `won_date` column stores the date and time when a lead
            was won, in text format.
        - name: business_segment
          type: TEXT
          nullable: true
          description: A field indicating the business segment associated with the
            lead, such as "pet", "car_accessories", "home_appliances", or "food_drink".
        - name: lead_type
          type: TEXT
          nullable: true
          description: A field indicating the type or category of the lead, such as
            online_medium, industry, or online_small.
        - name: lead_behaviour_profile
          type: TEXT
          nullable: true
          description: A field indicating the behavioral profile of a lead, such as
            'cat', 'eagle', or 'wolf', used to categorize lead behavior patterns.
        - name: has_company
          type: INTEGER
          nullable: true
          description: A nullable integer column indicating whether a company is associated
            with the lead.
        - name: has_gtin
          type: INTEGER
          nullable: true
          description: A nullable integer column indicating whether a lead has a GTIN
            (Global Trade Item Number).
        - name: average_stock
          type: TEXT
          nullable: true
          description: The `average_stock` column represents the average stock level
            associated with a lead, stored as text and allowing null values.
        - name: business_type
          type: TEXT
          nullable: true
          description: The `business_type` column indicates the type of business associated
            with the lead, such as "reseller" or "manufacturer."
        - name: declared_product_catalog_size
          type: REAL
          nullable: true
          description: declared_product_catalog_size is a nullable real number representing
            the size of the product catalog declared by the lead.
        - name: declared_monthly_revenue
          type: REAL
          nullable: true
          description: declared_monthly_revenue is a nullable real number column representing
            the declared monthly revenue of a lead.
