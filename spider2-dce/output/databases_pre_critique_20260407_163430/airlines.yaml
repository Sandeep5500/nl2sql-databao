datasource_id: databases/airlines.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: aircrafts_data
        columns:
        - name: aircraft_code
          type: character(3)
          nullable: false
          description: Aircraft code, 3-character identifier, non-nullable.
        - name: model
          type: jsonb
          nullable: false
          description: The `model` column stores aircraft model names in JSONB format,
            containing both English and Russian translations.
        - name: range
          type: INTEGER
          nullable: false
          description: The `range` column stores the maximum flight range of aircraft
            in kilometers as an integer.
        samples:
        - aircraft_code: '773'
          model: '{"en": "Boeing 777-300", "ru": "Боинг 777-300"}'
          range: 11100
        - aircraft_code: '763'
          model: '{"en": "Boeing 767-300", "ru": "Боинг 767-300"}'
          range: 7900
        - aircraft_code: SU9
          model: '{"en": "Sukhoi Superjet-100", "ru": "Сухой Суперджет-100"}'
          range: 3000
        - aircraft_code: '320'
          model: '{"en": "Airbus A320-200", "ru": "Аэробус A320-200"}'
          range: 5700
        - aircraft_code: '321'
          model: '{"en": "Airbus A321-200", "ru": "Аэробус A321-200"}'
          range: 5600
        description: A table containing data about different aircraft models, including
          their aircraft code, model name in multiple languages, and range in kilometers.
        kind: table
      - name: airports_data
        columns:
        - name: airport_code
          type: character(3)
          nullable: false
          description: airport_code is a non-nullable column storing 3-character airport
            codes.
        - name: airport_name
          type: jsonb
          nullable: false
          description: The `airport_name` column stores the name of the airport in
            a JSONB format, containing translations in multiple languages.
        - name: city
          type: jsonb
          nullable: false
          description: The `city` column stores the name of the city in JSONB format,
            containing translations in multiple languages.
        - name: coordinates
          type: point
          nullable: false
          description: A non-nullable column storing geographic coordinates as a point
            data type.
        - name: timezone
          type: TEXT
          nullable: false
          description: The `timezone` column stores the timezone information for each
            airport as a non-nullable text value.
        samples:
        - airport_code: YKS
          airport_name: '{"en": "Yakutsk Airport", "ru": "Якутск"}'
          city: '{"en": "Yakutsk", "ru": "Якутск"}'
          coordinates: (129.77099609375,62.0932998657226562)
          timezone: Asia/Yakutsk
        - airport_code: MJZ
          airport_name: '{"en": "Mirny Airport", "ru": "Мирный"}'
          city: '{"en": "Mirnyj", "ru": "Мирный"}'
          coordinates: (114.03900146484375,62.534698486328125)
          timezone: Asia/Yakutsk
        - airport_code: KHV
          airport_name: '{"en": "Khabarovsk-Novy Airport", "ru": "Хабаровск-Новый"}'
          city: '{"en": "Khabarovsk", "ru": "Хабаровск"}'
          coordinates: (135.18800354004,48.5279998779300001)
          timezone: Asia/Vladivostok
        - airport_code: PKC
          airport_name: '{"en": "Yelizovo Airport", "ru": "Елизово"}'
          city: '{"en": "Petropavlovsk", "ru": "Петропавловск-Камчатский"}'
          coordinates: (158.453994750976562,53.1679000854492188)
          timezone: Asia/Kamchatka
        - airport_code: UUS
          airport_name: '{"en": "Yuzhno-Sakhalinsk Airport", "ru": "Хомутово"}'
          city: '{"en": "Yuzhno-Sakhalinsk", "ru": "Южно-Сахалинск"}'
          coordinates: (142.718002319335938,46.8886985778808594)
          timezone: Asia/Sakhalin
        description: A table containing airport information including airport code,
          name, city, coordinates, and timezone.
        kind: table
      - name: boarding_passes
        columns:
        - name: ticket_no
          type: character(13)
          nullable: false
          description: ticket_no is a 13-character non-nullable field representing
            the unique ticket number associated with each boarding pass.
        - name: flight_id
          type: INTEGER
          nullable: false
          description: flight_id is an integer column that uniquely identifies a flight,
            and is required (non-nullable).
        - name: boarding_no
          type: INTEGER
          nullable: false
          description: Boarding number assigned to a passenger, represented as an
            integer. This field is required and cannot be null.
        - name: seat_no
          type: character varying(4)
          nullable: false
          description: seat_no is a non-nullable column storing seat numbers as variable
            character strings up to 4 characters long, such as '2D' or '11A'.
        samples:
        - ticket_no: '0005435212351'
          flight_id: 30625
          boarding_no: 1
          seat_no: 2D
        - ticket_no: 0005435212386
          flight_id: 30625
          boarding_no: 2
          seat_no: 3G
        - ticket_no: 0005435212381
          flight_id: 30625
          boarding_no: 3
          seat_no: 4H
        - ticket_no: '0005432211370'
          flight_id: 30625
          boarding_no: 4
          seat_no: 5D
        - ticket_no: '0005435212357'
          flight_id: 30625
          boarding_no: 5
          seat_no: 11A
        description: Boarding passes table containing ticket numbers, flight IDs,
          boarding numbers, and seat assignments.
        kind: table
      - name: bookings
        columns:
        - name: book_ref
          type: character(6)
          nullable: false
          description: The `book_ref` column stores a 6-character booking reference,
            used to uniquely identify each booking.
        - name: book_date
          type: timestamp with time zone
          nullable: false
          description: book_date is a non-nullable timestamp with time zone column
            representing the date and time a booking was made.
        - name: total_amount
          type: numeric(10,2)
          nullable: false
          description: The `total_amount` column stores the numeric value of the booking
            amount with a precision of 10 digits and 2 decimal places. It does not
            allow null values.
        samples:
        - book_ref: 00000F
          book_date: '2017-07-05 03:12:00+03'
          total_amount: 265700
        - book_ref: '000012'
          book_date: '2017-07-14 09:02:00+03'
          total_amount: 37900
        - book_ref: 000068
          book_date: '2017-08-15 14:27:00+03'
          total_amount: 18100
        - book_ref: 000181
          book_date: '2017-08-10 13:28:00+03'
          total_amount: 131800
        - book_ref: 0002D8
          book_date: '2017-08-07 21:40:00+03'
          total_amount: 23600
        description: A table containing booking records with a reference ID, booking
          date and time (with time zone), and total amount. Each booking is uniquely
          identified by a 6-character book reference and includes a timestamp and
          monetary value.
        kind: table
      - name: flights
        columns:
        - name: flight_id
          type: INTEGER
          nullable: false
          description: flight_id is an integer column that uniquely identifies each
            flight in the flights table.
        - name: flight_no
          type: character(6)
          nullable: false
          description: Flight number, fixed-length character string of 6 characters,
            required field.
        - name: scheduled_departure
          type: timestamp with time zone
          nullable: false
          description: scheduled_departure is a non-nullable timestamp with time zone
            column representing the planned departure time of a flight.
        - name: scheduled_arrival
          type: timestamp with time zone
          nullable: false
          description: scheduled_arrival is a non-nullable timestamp with time zone
            column representing the planned arrival time of a flight.
        - name: departure_airport
          type: character(3)
          nullable: false
          description: departure_airport is a non-nullable column storing 3-character
            airport codes representing the origin of each flight.
        - name: arrival_airport
          type: character(3)
          nullable: false
          description: arrival_airport is a non-nullable column storing the 3-character
            IATA code of the destination airport for each flight.
        - name: status
          type: character varying(20)
          nullable: false
          description: The `status` column stores the current status of a flight as
            a non-nullable string with a maximum length of 20 characters.
        - name: aircraft_code
          type: character(3)
          nullable: false
          description: Aircraft code representing the type of aircraft used for the
            flight.
        - name: actual_departure
          type: timestamp with time zone
          nullable: true
          description: actual_departure is a nullable timestamp with time zone column
            representing the real departure time of a flight.
        - name: actual_arrival
          type: timestamp with time zone
          nullable: true
          description: actual_arrival is a nullable timestamp with time zone column
            representing the actual time the flight arrived at its destination.
        samples:
        - flight_id: 1185
          flight_no: PG0134
          scheduled_departure: '2017-09-10 09:50:00+03'
          scheduled_arrival: '2017-09-10 14:55:00+03'
          departure_airport: DME
          arrival_airport: BTK
          status: Scheduled
          aircraft_code: '319'
          actual_departure: \N
          actual_arrival: \N
        - flight_id: 3979
          flight_no: PG0052
          scheduled_departure: '2017-08-25 14:50:00+03'
          scheduled_arrival: '2017-08-25 17:35:00+03'
          departure_airport: VKO
          arrival_airport: HMA
          status: Scheduled
          aircraft_code: CR2
          actual_departure: \N
          actual_arrival: \N
        - flight_id: 4739
          flight_no: PG0561
          scheduled_departure: '2017-09-05 12:30:00+03'
          scheduled_arrival: '2017-09-05 14:15:00+03'
          departure_airport: VKO
          arrival_airport: AER
          status: Scheduled
          aircraft_code: '763'
          actual_departure: \N
          actual_arrival: \N
        - flight_id: 5502
          flight_no: PG0529
          scheduled_departure: '2017-09-12 09:50:00+03'
          scheduled_arrival: '2017-09-12 11:20:00+03'
          departure_airport: SVO
          arrival_airport: UFA
          status: Scheduled
          aircraft_code: '763'
          actual_departure: \N
          actual_arrival: \N
        - flight_id: 6938
          flight_no: PG0461
          scheduled_departure: '2017-09-04 12:25:00+03'
          scheduled_arrival: '2017-09-04 13:20:00+03'
          departure_airport: SVO
          arrival_airport: ULV
          status: Scheduled
          aircraft_code: SU9
          actual_departure: \N
          actual_arrival: \N
        description: A table containing flight information including scheduled and
          actual departure and arrival times, departure and arrival airports, aircraft
          code, and status.
        kind: table
      - name: seats
        columns:
        - name: aircraft_code
          type: character(3)
          nullable: false
          description: Aircraft code, fixed 3-character identifier, required field.
        - name: seat_no
          type: character varying(4)
          nullable: false
          description: Seat number, represented as a variable character string up
            to 4 characters, required field.
        - name: fare_conditions
          type: character varying(10)
          nullable: false
          description: A non-nullable column storing the fare conditions of a seat,
            such as 'Business'.
        samples:
        - aircraft_code: '319'
          seat_no: 2A
          fare_conditions: Business
        - aircraft_code: '319'
          seat_no: 2C
          fare_conditions: Business
        - aircraft_code: '319'
          seat_no: 2D
          fare_conditions: Business
        - aircraft_code: '319'
          seat_no: 2F
          fare_conditions: Business
        - aircraft_code: '319'
          seat_no: 3A
          fare_conditions: Business
        description: A table containing seat information for aircraft, including seat
          number, aircraft code, and fare conditions.
        kind: table
      - name: ticket_flights
        columns:
        - name: ticket_no
          type: character(13)
          nullable: false
          description: A 13-character fixed-length string representing a unique ticket
            number, which cannot be null.
        - name: flight_id
          type: INTEGER
          nullable: false
          description: flight_id is an integer column that uniquely identifies a flight,
            and is required (non-nullable).
        - name: fare_conditions
          type: character varying(10)
          nullable: false
          description: The `fare_conditions` column stores the class or type of fare
            for a ticket flight, such as "Business," and is required (non-nullable)
            with a maximum length of 10 characters.
        - name: amount
          type: numeric(10,2)
          nullable: false
          description: The `amount` column stores numeric values with a precision
            of 10 digits and 2 decimal places, representing ticket flight amounts.
            It does not allow null values.
        samples:
        - ticket_no: 0005432159776
          flight_id: 30625
          fare_conditions: Business
          amount: 42100
        - ticket_no: '0005435212351'
          flight_id: 30625
          fare_conditions: Business
          amount: 42100
        - ticket_no: 0005435212386
          flight_id: 30625
          fare_conditions: Business
          amount: 42100
        - ticket_no: 0005435212381
          flight_id: 30625
          fare_conditions: Business
          amount: 42100
        - ticket_no: '0005432211370'
          flight_id: 30625
          fare_conditions: Business
          amount: 42100
        description: A table containing ticket flight information, including ticket
          numbers, flight IDs, fare conditions, and amounts. Each entry represents
          a ticketed flight with business-class fare conditions and associated costs.
        kind: table
      - name: tickets
        columns:
        - name: ticket_no
          type: character(13)
          nullable: false
          description: A 13-character alphanumeric identifier for a ticket, which
            is required and cannot be null.
        - name: book_ref
          type: character(6)
          nullable: false
          description: A 6-character non-nullable field used to reference booking
            information associated with a ticket.
        - name: passenger_id
          type: character varying(20)
          nullable: false
          description: A unique identifier for a passenger, stored as a non-nullable
            variable character string up to 20 characters in length.
        samples:
        - ticket_no: 0005432000987
          book_ref: 06B046
          passenger_id: 8149 604011
        - ticket_no: 0005432000988
          book_ref: 06B046
          passenger_id: 8499 420203
        - ticket_no: 0005432000989
          book_ref: E170C3
          passenger_id: 1011 752484
        - ticket_no: 0005432000990
          book_ref: E170C3
          passenger_id: 4849 400049
        - ticket_no: 0005432000991
          book_ref: F313DD
          passenger_id: 6615 976589
        description: A table containing ticket information with fields for ticket
          number, booking reference, and passenger ID. Each ticket is associated with
          a specific booking and passenger.
        kind: table
      description: The main schema contains tables related to airline operations,
        including data on aircrafts, airports, flights, bookings, tickets, and boarding
        passes.
    description: The default catalog contains a schema named "main" with multiple
      tables related to aircraft data, airports, bookings, flights, and passenger
      information.
