datasource_id: databases/city_legislation.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: alien_data
        columns:
        - name: id
          type: INTEGER
          nullable: true
          description: The `id` column is an integer type field that uniquely identifies
            each record in the `alien_data` table.
        - name: first_name
          type: TEXT
          nullable: true
          description: A column containing the first names of individuals, with text
            data type and null values allowed.
        - name: last_name
          type: TEXT
          nullable: true
          description: A column containing the last names of individuals, with text
            values that can be null.
        - name: email
          type: TEXT
          nullable: true
          description: The email column contains text values representing email addresses,
            with null values allowed.
        - name: gender
          type: TEXT
          nullable: true
          description: 'gender column: A TEXT column that stores the gender information
            of the alien, such as male, female, or non-binary.'
        - name: type
          type: TEXT
          nullable: true
          description: The `type` column contains text values describing the classification
            or species of the alien, such as "reptile," "flatwoods," "nordic," or
            "green."
        - name: birth_year
          type: INTEGER
          nullable: true
          description: The `birth_year` column stores the year an alien was born,
            represented as an integer value.
        - name: age
          type: INTEGER
          nullable: true
          description: The `age` column stores the age of the alien as an integer,
            and it can contain null values.
        - name: favorite_food
          type: TEXT
          nullable: true
          description: The `favorite_food` column contains text values representing
            the preferred food of each alien, such as "white-faced tree rat" or "kangaroo,
            red."
        - name: feeding_frequency
          type: TEXT
          nullable: true
          description: A text field indicating how often an alien needs to be fed,
            such as "weekly," "seldom," "often," or "once."
        - name: aggressive
          type: INTEGER
          nullable: true
          description: The "aggressive" column is an integer field indicating whether
            an alien is aggressive, with 1 representing aggressive and 0 representing
            non-aggressive.
        - name: occupation
          type: TEXT
          nullable: true
          description: The "occupation" column contains text data representing the
            job or profession of the individuals in the alien_data table.
        - name: current_location
          type: TEXT
          nullable: true
          description: current_location is a nullable TEXT column representing the
            current city or place of residence for the alien.
        - name: state
          type: TEXT
          nullable: true
          description: The "state" column contains textual data representing the state
            where each alien is currently located. Values include examples like Ohio,
            Maryland, and California.
        - name: us_region
          type: TEXT
          nullable: true
          description: The `us_region` column contains textual data representing the
            U.S. region associated with each alien's location. It is nullable and
            includes values such as "great lakes," "mideast," "far west," and "southeast."
        - name: country
          type: TEXT
          nullable: true
          description: The "country" column contains textual data representing the
            country of each alien's current location, with entries primarily indicating
            "united states."
