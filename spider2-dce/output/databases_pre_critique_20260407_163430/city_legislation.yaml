          type: TEXT
          nullable: true
          description: The `term_type` column indicates the type of legislative term,
            such as "rep" for representative or "sen" for senator.
        - name: term_start
          type: TEXT
          nullable: true
          description: The `term_start` column stores the start date of a legislative
            term as text.
        - name: term_end
          type: TEXT
          nullable: true
          description: The `term_end` column stores the end date of a legislative
            term as text.
        - name: state
          type: TEXT
          nullable: true
          description: The "state" column contains the two-letter state abbreviation
            representing the state associated with a legislator's term.
        - name: district
          type: REAL
          nullable: true
          description: Represents the legislative district number associated with
            the term, stored as a real number.
        - name: class
          type: REAL
          nullable: true
          description: The "class" column represents the Senate class designation
            for a legislator's term, indicating the order in which the term begins,
            typically used for staggered Senate terms.
        - name: party
          type: TEXT
          nullable: true
          description: The `party` column indicates the political party affiliation
            of the legislator during their term.
        - name: how
          type: TEXT
          nullable: true
          description: The "how" column contains textual information describing the
            method or manner in which a legislator was elected or appointed to their
            term.
        - name: url
          type: TEXT
          nullable: true
          description: The `url` field contains the official website address of a
            legislator.
        - name: address
          type: TEXT
          nullable: true
          description: The `address` field contains the mailing or office address
            associated with a legislator's term.
        - name: phone
          type: TEXT
          nullable: true
          description: Stores the phone number associated with a legislator's office.
        - name: fax
          type: TEXT
          nullable: true
          description: Fax number for contacting the legislator's office.
        - name: contact_form
          type: TEXT
          nullable: true
          description: The `contact_form` field contains the URL to a legislator's
            contact form for constituent communication.
        - name: office
          type: TEXT
          nullable: true
          description: The "office" field contains the location or building where
            a legislator's office is situated, such as a room number or office address
            in the legislative body's premises.
        - name: state_rank
          type: TEXT
          nullable: true
          description: The `state_rank` column indicates the ranking or position of
            a legislator within their state, such as majority or minority leader.
        - name: rss_url
          type: TEXT
          nullable: true
          description: A field containing the URL for an RSS feed associated with
            a legislator's office or information.
        - name: caucus
          type: TEXT
          nullable: true
          description: The `caucus` column stores the political caucus affiliation
            of a legislator, such as a specific group or coalition they belong to
            within their party.
