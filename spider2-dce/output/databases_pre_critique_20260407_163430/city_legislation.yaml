      - name: job_postings_fact
        columns:
        - name: job_id
          type: INTEGER
          nullable: true
          description: Unique identifier for a job posting.
        - name: company_id
          type: INTEGER
          nullable: true
          description: The `company_id` column contains integer values representing
            the unique identifier for the company associated with each job posting.
        - name: job_title_short
          type: TEXT
          nullable: true
          description: job_title_short is a nullable TEXT column representing the
            abbreviated title of a job posting.
        - name: job_title
          type: TEXT
          nullable: true
          description: Job title description, such as "JUNIOR IT DATA ANALYST" or
            "Senior Data Engineer H/F."
        - name: job_location
          type: TEXT
          nullable: true
          description: job_location is a nullable TEXT column that stores the physical
            location of the job, typically including city and country.
        - name: job_via
          type: TEXT
          nullable: true
          description: The "job_via" column indicates the source or platform through
            which the job posting was published.
        - name: job_schedule_type
          type: TEXT
          nullable: true
          description: job_schedule_type is a nullable TEXT column indicating the
            type of work schedule for the job posting, such as Full-time.
        - name: job_work_from_home
          type: INTEGER
          nullable: true
          description: Indicates whether the job offers work-from-home options, with
            1 representing available and 0 representing not available.
        - name: search_location
          type: TEXT
          nullable: true
          description: The `search_location` column represents the geographic location
            or region where the job was searched or posted, such as "South Africa"
            or "Texas, United States."
        - name: job_posted_date
          type: TEXT
          nullable: true
          description: The `job_posted_date` column stores the date and time when
            a job posting was published, in text format.
        - name: job_no_degree_mention
          type: INTEGER
          nullable: true
          description: Indicates whether the job posting mentions no degree requirement.
            A value of 1 means no degree is mentioned, 0 means a degree is mentioned,
            and null means the information is not available.
        - name: job_health_insurance
          type: INTEGER
          nullable: true
          description: Indicates whether the job posting mentions health insurance,
            with 1 representing availability and 0 representing no mention.
        - name: job_country
          type: TEXT
          nullable: true
          description: The `job_country` column contains the country where the job
            is located, as text.
        - name: salary_rate
          type: TEXT
          nullable: true
          description: The `salary_rate` column describes the salary structure or
            pay rate for the job, such as annual or hourly, but does not contain numerical
            values.
        - name: salary_year_avg
          type: REAL
          nullable: true
          description: Average annual salary for job postings, represented as a real
            number.
        - name: salary_hour_avg
          type: REAL
          nullable: true
          description: Average hourly salary for job postings.
