        kind: table
        primary_key:
          name: pk_payments
          columns:
          - payment_id
          validated: true
      - name: stores
        columns:
        - name: store_id
          type: INTEGER
          nullable: false
          description: Unique identifier for each store, stored as an integer and
            required.
        - name: hub_id
          type: INTEGER
          nullable: true
          description: The `hub_id` column in the `stores` table is an optional integer
            field that associates a store with a hub.
        - name: store_name
          type: VARCHAR(50)
          nullable: true
          description: A column storing the name of the store, with a maximum length
            of 50 characters.
        - name: store_segment
          type: VARCHAR(50)
          nullable: true
          description: A column in the stores table that represents the category or
            type of the store, with a maximum length of 50 characters.
        - name: store_plan_price
          type: DECIMAL(10, 2)
          nullable: true
          description: store_plan_price is a decimal column with up to 10 digits and
            2 decimal places, allowing null values. It represents the planned price
