datasource_id: databases/delivery_center.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: channels
        columns:
        - name: channel_id
          type: INTEGER
          nullable: false
          description: channel_id is an integer column that uniquely identifies each
            channel and cannot be null.
        - name: channel_name
          type: VARCHAR(50)
          nullable: true
          description: A column storing the name of a channel, with a maximum length
            of 50 characters. It allows null values.
        - name: channel_type
          type: VARCHAR(50)
          nullable: true
          description: A column in the channels table that stores the type of channel
            as a variable character string with a maximum length of 50 characters.
            It allows null values.
        samples:
        - channel_id: 1
          channel_name: OTHER PLACE
          channel_type: OWN CHANNEL
        - channel_id: 2
          channel_name: PHONE PLACE
          channel_type: OWN CHANNEL
        - channel_id: 3
          channel_name: WHATS PLACE
          channel_type: OWN CHANNEL
        - channel_id: 4
          channel_name: FACE PLACE
          channel_type: OWN CHANNEL
        - channel_id: 5
          channel_name: FOOD PLACE
          channel_type: MARKETPLACE
        description: A table containing information about different channels, including
          their unique ID, name, and type. It is primarily keyed on channel_id.
        kind: table
        primary_key:
          name: pk_channels
          columns:
          - channel_id
          validated: true
      - name: deliveries
        columns:
        - name: delivery_id
          type: INTEGER
          nullable: false
          description: Unique identifier for each delivery.
        - name: delivery_order_id
          type: INTEGER
          nullable: true
          description: The `delivery_order_id` column stores the unique identifier
            of the order associated with a delivery, as an integer value. It is nullable,
            meaning some deliveries may not be linked to an order.
        - name: driver_id
          type: INTEGER
          nullable: true
          description: The `driver_id` column stores the unique identifier of the
            driver assigned to a delivery, with integer values that can be null.
        - name: delivery_distance_meters
          type: DECIMAL(10, 2)
          nullable: true
          description: Represents the distance of a delivery in meters, stored as
            a decimal with up to 10 digits and 2 decimal places. This field is optional
            and may be null.
        - name: delivery_status
          type: VARCHAR(50)
          nullable: true
          description: A column storing the status of a delivery, such as "DELIVERED,"
            with a maximum length of 50 characters.
        samples:
        - delivery_id: 2174658
          delivery_order_id: 68413340
          driver_id: 8378
          delivery_distance_meters: 5199
          delivery_status: DELIVERED
        - delivery_id: 2174660
          delivery_order_id: 68414309
          driver_id: 2473
          delivery_distance_meters: 410
          delivery_status: DELIVERED
        - delivery_id: 2174661
          delivery_order_id: 68416230
          driver_id: 7615
          delivery_distance_meters: 3784
          delivery_status: DELIVERED
        - delivery_id: 2174663
          delivery_order_id: 68412721
          driver_id: 8378
          delivery_distance_meters: 5714
          delivery_status: DELIVERED
        - delivery_id: 2174675
          delivery_order_id: 68414018
          driver_id: 10463
          delivery_distance_meters: 3746
          delivery_status: DELIVERED
        description: A table tracking delivery information, including delivery ID,
          order ID, driver ID, distance in meters, and delivery status. Each delivery
          is uniquely identified by a primary key, `delivery_id`.
        kind: table
        primary_key:
          name: pk_deliveries
          columns:
          - delivery_id
          validated: true
      - name: drivers
        columns:
        - name: driver_id
          type: INTEGER
          nullable: false
          description: driver_id is an integer column that uniquely identifies each
            driver and cannot be null.
        - name: driver_modal
          type: VARCHAR(50)
          nullable: true
          description: A column storing the transportation mode of the driver, such
            as "MOTOBOY" or "BIKER," with a maximum length of 50 characters.
        - name: driver_type
          type: VARCHAR(50)
          nullable: true
          description: A column in the drivers table that stores the type of driver,
            such as 'LOGISTIC OPERATOR' or 'FREELANCE', with a maximum length of 50
            characters.
        samples:
        - driver_id: 133
          driver_modal: MOTOBOY
          driver_type: LOGISTIC OPERATOR
        - driver_id: 138
          driver_modal: MOTOBOY
          driver_type: FREELANCE
        - driver_id: 140
          driver_modal: MOTOBOY
          driver_type: FREELANCE
        - driver_id: 143
          driver_modal: BIKER
          driver_type: FREELANCE
        - driver_id: 148
          driver_modal: MOTOBOY
          driver_type: FREELANCE
        description: A table containing driver information with unique identifiers,
          modal types, and driver types.
        kind: table
        primary_key:
          name: pk_drivers
          columns:
          - driver_id
          validated: true
      - name: hubs
        columns:
        - name: hub_id
          type: INTEGER
          nullable: false
          description: Unique identifier for each hub, stored as an integer and required
            for every record.
        - name: hub_name
          type: VARCHAR(50)
          nullable: true
          description: A column storing the name of the hub, with a maximum length
            of 50 characters.
        - name: hub_city
          type: VARCHAR(50)
          nullable: true
          description: A column storing the city name where the hub is located, with
            a maximum length of 50 characters.
        - name: hub_state
          type: CHAR(2)
          nullable: true
          description: The `hub_state` column stores the two-character state abbreviation
            for the hub's location.
        - name: hub_latitude
          type: DECIMAL(9, 6)
          nullable: true
          description: hub_latitude is a decimal column with precision 9 and scale
            6, representing the latitude of a hub location.
        - name: hub_longitude
          type: DECIMAL(9, 6)
          nullable: true
          description: hub_longitude is a decimal column with precision 9 and scale
            6, representing the geographic longitude of a hub location.
        samples:
        - hub_id: 2
          hub_name: BLUE SHOPPING
          hub_city: PORTO ALEGRE
          hub_state: RS
          hub_latitude: -30.0474148
          hub_longitude: -51.21351
        - hub_id: 3
          hub_name: GREEN SHOPPING
          hub_city: PORTO ALEGRE
          hub_state: RS
          hub_latitude: -30.0374149
          hub_longitude: -51.20352
        - hub_id: 4
          hub_name: RED SHOPPING
          hub_city: PORTO ALEGRE
          hub_state: RS
          hub_latitude: -30.0219481
          hub_longitude: -51.2083816
        - hub_id: 5
          hub_name: FUNK SHOPPING
          hub_city: RIO DE JANEIRO
          hub_state: RJ
          hub_latitude: -23.0007498
          hub_longitude: -43.318282
        - hub_id: 8
          hub_name: GOLDEN SHOPPING
          hub_city: RIO DE JANEIRO
          hub_state: RJ
          hub_latitude: -22.921475
          hub_longitude: -43.234774
        description: A table containing information about hubs, including their ID,
          name, city, state, and geographic coordinates. Each hub is uniquely identified
          by a hub_id.
        kind: table
        primary_key:
          name: pk_hubs
          columns:
          - hub_id
          validated: true
      - name: orders
        columns:
        - name: order_id
          type: INTEGER
          nullable: false
          description: Unique identifier for an order.
        - name: store_id
          type: INTEGER
          nullable: true
          description: The `store_id` column represents the identifier for the store
            associated with the order, and it can contain integer values or be null.
        - name: channel_id
          type: INTEGER
          nullable: true
          description: channel_id is an integer column representing the channel through
            which the order was placed. It allows null values.
        - name: payment_order_id
          type: INTEGER
          nullable: true
          description: The `payment_order_id` column stores an integer value representing
            the identifier for the payment associated with an order. It can contain
            null values.
        - name: delivery_order_id
          type: INTEGER
          nullable: true
          description: The `delivery_order_id` is an integer column that uniquely
            identifies a delivery order, and may contain null values.
        - name: order_status
          type: VARCHAR(50)
          nullable: true
          description: The `order_status` column stores the current status of an order
            as a variable-length string, with a maximum length of 50 characters. It
            is nullable, meaning an order may not have a status assigned.
        - name: order_amount
          type: DECIMAL(10, 2)
          nullable: true
          description: Represents the total monetary value of an order, stored as
            a decimal with up to 10 digits and 2 decimal places. This field is nullable.
        - name: order_delivery_fee
          type: DECIMAL(10, 2)
          nullable: true
          description: The `order_delivery_fee` column stores the delivery fee associated
            with an order as a decimal value with up to 10 digits and 2 decimal places.
            It allows null values.
        - name: order_delivery_cost
          type: DECIMAL(10, 2)
          nullable: true
          description: The order_delivery_cost column stores the cost of delivering
            an order as a decimal value with up to 10 digits and 2 decimal places.
            It allows null values.
        - name: order_created_hour
          type: INTEGER
          nullable: true
          description: The `order_created_hour` column stores the hour portion of
            the time when an order was created, as an integer value.
        - name: order_created_minute
          type: INTEGER
          nullable: true
          description: The `order_created_minute` column stores the minute portion
            of the time when an order was created, as an integer.
        - name: order_created_day
          type: INTEGER
          nullable: true
          description: The `order_created_day` column stores the day part of the date
            when an order was created, as an integer.
        - name: order_created_month
          type: INTEGER
          nullable: true
          description: The `order_created_month` column stores the month portion of
            the order creation date as an integer, indicating when the order was created
            in the year.
        - name: order_created_year
          type: INTEGER
          nullable: true
          description: The "order_created_year" column stores the year when an order
            was created, as an integer value.
        - name: order_moment_created
          type: DATETIME
          nullable: true
          description: The `order_moment_created` column stores the exact date and
            time when an order was created, with a DATETIME data type. It is nullable,
            meaning the creation time may not always be recorded.
        - name: order_moment_accepted
          type: DATETIME
          nullable: true
          description: The `order_moment_accepted` column stores the datetime when
            an order was accepted, with a nullable DATETIME type.
        - name: order_moment_ready
          type: DATETIME
          nullable: true
          description: The `order_moment_ready` column stores the datetime when an
            order is marked as ready for pickup or delivery. It is a nullable DATETIME
            field.
        - name: order_moment_collected
          type: DATETIME
          nullable: true
          description: The `order_moment_collected` column stores the date and time
            when an order was collected, if available.
        - name: order_moment_in_expedition
          type: DATETIME
          nullable: true
          description: The `order_moment_in_expedition` column stores the datetime
            when an order enters the expedition phase, indicating the start of the
            delivery process.
        - name: order_moment_delivering
          type: DATETIME
          nullable: true
          description: The `order_moment_delivering` column stores the datetime when
            an order starts the delivery process. It is nullable and allows for optional
            tracking of this event.
        - name: order_moment_delivered
          type: DATETIME
          nullable: true
          description: The `order_moment_delivered` column stores the datetime when
            an order was delivered, if available.
        - name: order_moment_finished
          type: DATETIME
          nullable: true
          description: The `order_moment_finished` column stores the datetime when
            an order was marked as finished. It is a nullable DATETIME field.
        - name: order_metric_collected_time
          type: DECIMAL(10, 2)
          nullable: true
          description: Represents the time in decimal format related to the collection
            process of an order, measured in a unit not specified (likely minutes
            or seconds).
        - name: order_metric_paused_time
          type: DECIMAL(10, 2)
          nullable: true
          description: The `order_metric_paused_time` column stores the duration,
            in decimal format, representing the time an order was paused during its
            processing lifecycle.
        - name: order_metric_production_time
          type: DECIMAL(10, 2)
          nullable: true
          description: order_metric_production_time is a decimal field representing
            the time taken for order production, measured in a unit not specified,
            and can be null.
        - name: order_metric_walking_time
          type: DECIMAL(10, 2)
          nullable: true
          description: order_metric_walking_time is a decimal field representing the
            time spent walking related to an order, measured in a unit not specified,
            and is optionally nullable.
        - name: order_metric_expediton_speed_time
          type: DECIMAL(10, 2)
          nullable: true
          description: Represents the speed time metric for the expedition phase of
            an order, measured in decimal format with two decimal places.
        - name: order_metric_transit_time
          type: DECIMAL(10, 2)
          nullable: true
          description: order_metric_transit_time is a decimal column representing
            the time taken for an order to transit, with up to 10 digits and 2 decimal
            places. It can contain null values.
        - name: order_metric_cycle_time
          type: DECIMAL(10, 2)
          nullable: true
          description: order_metric_cycle_time is a decimal column representing the
            total time in decimal format for the order's cycle, and it can contain
            null values.
        samples:
