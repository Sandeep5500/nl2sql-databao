        description: The "orders" table contains order details including status, timestamps,
          amounts, and associated metrics, with a primary key on "order_id".
        kind: table
        primary_key:
          name: pk_orders
          columns:
          - order_id
          validated: true
      - name: payments
        columns:
        - name: payment_id
          type: INTEGER
          nullable: false
          description: Unique identifier for each payment.
        - name: payment_order_id
          type: INTEGER
          nullable: true
          description: The `payment_order_id` column stores an integer value representing
            the associated order for a payment. It is nullable, meaning a payment
            may not always be linked to an order.
        - name: payment_amount
          type: DECIMAL(10, 2)
          nullable: true
          description: The `payment_amount` column stores the amount of each payment
            as a decimal number with up to 10 digits, 2 of which are after the decimal
            point. It allows null values.
        - name: payment_fee
          type: DECIMAL(10, 2)
          nullable: true
          description: The `payment_fee` column stores the fee associated with a payment
            as a decimal number with up to 10 digits and 2 decimal places. It can
            contain null values.
        - name: payment_method
          type: VARCHAR(50)
          nullable: true
          description: The `payment_method` column stores the method used for a payment,
            such as "VOUCHER" or "ONLINE", with a maximum length of 50 characters.
        - name: payment_status
          type: VARCHAR(50)
          nullable: true
          description: The `payment_status` column stores the current status of a
            payment as a variable-length string, with values such as "PAID". It allows
            null values.
