      - name: Country
        columns:
        - name: id
          type: INTEGER
          nullable: false
          description: The `id` column is an integer type, not nullable, and serves
            as the primary key for the Country table.
        - name: name
          type: TEXT
          nullable: true
          description: The `name` column stores country names as text and allows null
            values.
        samples:
        - id: 1
          name: Belgium
        - id: 1729
          name: England
        - id: 4769
          name: France
        - id: 7809
          name: Germany
        - id: 10257
          name: Italy
        description: A table containing country information with unique identifiers
          and names. Each country is uniquely identified by an integer ID, and country
          names are also unique.
        kind: table
        primary_key:
          name: pk_Country
          columns:
          - id
          validated: true
        unique_constraints:
        - name: sqlite_autoindex_Country_1
          columns:
          - name
          validated: true
      - name: League
        columns:
        - name: id
          type: INTEGER
          nullable: false
          description: The `id` column is an integer that uniquely identifies each
            league and cannot be null.
        - name: country_id
          type: INTEGER
          nullable: true
          description: A nullable integer column representing the foreign key reference
            to the country associated with the league.
        - name: name
          type: TEXT
          nullable: true
          description: The `name` column stores the name of the league as text and
            can contain null values.
        samples:
        - id: 1
          country_id: 1
          name: Belgium Jupiler League
        - id: 1729
          country_id: 1729
          name: England Premier League
        - id: 4769
          country_id: 4769
          name: France Ligue 1
        - id: 7809
          country_id: 7809
          name: Germany 1. Bundesliga
        - id: 10257
          country_id: 10257
          name: Italy Serie A
        description: A table containing information about sports leagues, including
          their unique identifier, associated country ID, and league name. Each league
          name must be unique, and the country_id references the country table.
        kind: table
        primary_key:
          name: pk_League
          columns:
          - id
          validated: true
        unique_constraints:
        - name: sqlite_autoindex_League_1
          columns:
          - name
          validated: true
        foreign_keys:
        - name: fk_League_0
          mapping:
          - from_column: country_id
            to_column: id
          referenced_table: main.country
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
      - name: Match
        columns:
        - name: id
          type: INTEGER
          nullable: false
          description: Unique identifier for each match record.
        - name: country_id
          type: INTEGER
          nullable: true
          description: Represents the identifier for the country associated with the
            match, allowing null values.
        - name: league_id
          type: INTEGER
          nullable: true
          description: The `league_id` column stores an integer identifier for the
            league in which the match was played. It is a nullable field, allowing
            for missing or undefined league information.
        - name: season
          type: TEXT
          nullable: true
          description: The `season` column stores the season during which the match
            took place, represented as text (e.g., "2008/2009"). It is optional and
            may contain null values.
        - name: stage
          type: INTEGER
          nullable: true
          description: Represents the stage or round of the match within a season.
        - name: date
          type: TEXT
          nullable: true
          description: The `date` column stores the date and time of a match as text,
            with values formatted like 'YYYY-MM-DD HH:MM:SS'. It is nullable, meaning
            matches may not always have a recorded date.
        - name: match_api_id
          type: INTEGER
          nullable: true
          description: Unique identifier for the match from an external API.
        - name: home_team_api_id
          type: INTEGER
          nullable: true
          description: home_team_api_id is an integer column representing the API
            identifier for the home team in a match.
        - name: away_team_api_id
          type: INTEGER
          nullable: true
          description: The `away_team_api_id` column stores the integer identifier
            of the away team in a match, referencing the `team_api_id` in the `Team`
            table. It is nullable, allowing matches without an assigned away team.
        - name: home_team_goal
