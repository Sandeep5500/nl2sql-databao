datasource_id: databases/california_traffic_collision.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: case_ids
        columns:
        - name: case_id
          type: REAL
          nullable: true
          description: case_id is a nullable REAL column representing case identifiers,
            often as decimal or floating-point numbers.
        - name: db_year
          type: INTEGER
          nullable: true
          description: A nullable integer column representing the year associated
            with a case.
        samples:
        - case_id: 3736596.0
          db_year: 2020
        - case_id: 2711941.0
          db_year: 2018
        - case_id: 7146408.0
          db_year: 2021
        - case_id: 3.708010920144001e+18
          db_year: 2018
        - case_id: 3260643.0
          db_year: 2018
        description: A table containing case identifiers and corresponding years,
          with case IDs stored as real numbers and years as integers.
        kind: table
      - name: collisions
        columns:
        - name: case_id
          type: REAL
          nullable: true
          description: case_id is a nullable REAL column representing the unique identifier
            for a collision case.
        - name: jurisdiction
          type: REAL
          nullable: true
          description: The "jurisdiction" column represents a numeric identifier for
            the jurisdiction where the collision occurred.
        - name: officer_id
          type: TEXT
          nullable: true
          description: The officer ID associated with the collision report.
        - name: reporting_district
          type: TEXT
          nullable: true
          description: The "reporting_district" field contains textual data representing
            the district where a collision was reported, and it can contain null values.
        - name: chp_shift
          type: TEXT
          nullable: true
          description: The `chp_shift` field indicates the time period during which
            the collision was reported, typically represented as a shift range (e.g.,
            "0600 thru 1359").
        - name: population
          type: TEXT
          nullable: true
          description: The "population" column contains textual descriptions of population
            sizes or statuses, such as "unincorporated" or ">250000", and is used
            to indicate the population context of the collision location.
        - name: county_city_location
          type: INTEGER
          nullable: true
          description: Represents the county or city location associated with the
            collision incident, stored as an integer identifier.
        - name: county_location
          type: TEXT
          nullable: true
          description: The `county_location` column contains the name of the county
            where each collision occurred.
        - name: special_condition
          type: REAL
          nullable: true
          description: The `special_condition` column is a nullable real number field
            that indicates whether a special condition was present at the time of
            the collision.
        - name: beat_type
          type: TEXT
          nullable: true
          description: The `beat_type` field describes the type of patrol or jurisdictional
            beat associated with the collision, such as "chp state highway" or "not
            chp."
        - name: chp_beat_type
          type: TEXT
          nullable: true
          description: The `chp_beat_type` field describes the type of beat associated
            with the California Highway Patrol (CHP), such as "interstate" or "state
            route."
        - name: city_division_lapd
          type: TEXT
          nullable: true
          description: City division within LAPD jurisdiction.
        - name: chp_beat_class
          type: TEXT
          nullable: true
          description: The `chp_beat_class` field describes the classification of
            the California Highway Patrol (CHP) beat associated with a collision,
            such as "chp primary" or "chp other."
        - name: beat_number
          type: TEXT
          nullable: true
          description: The beat_number represents a textual identifier for a specific
            police or highway patrol beat area where the collision occurred.
        - name: primary_road
          type: TEXT
          nullable: true
          description: Primary road where the collision occurred.
        - name: secondary_road
          type: TEXT
          nullable: true
          description: The `secondary_road` field contains the name of the secondary
            road involved in the collision, if applicable. It is stored as text and
            may be null.
        - name: distance
          type: REAL
          nullable: true
          description: Distance in real number format, representing a measurable span
            related to collision locations.
        - name: direction
          type: TEXT
          nullable: true
          description: The "direction" column indicates the direction of travel on
            the road where the collision occurred, such as "south" or "east."
        - name: intersection
          type: REAL
          nullable: true
          description: The "intersection" column indicates whether the collision occurred
            at an intersection, represented as a real number.
        - name: weather_1
          type: TEXT
          nullable: true
          description: The `weather_1` field describes the primary weather condition
            at the time of the collision, such as "clear" or "rain."
        - name: weather_2
          type: TEXT
          nullable: true
          description: The `weather_2` column contains textual descriptions of secondary
            weather conditions at the time of collisions, and it allows null values.
        - name: state_highway_indicator
          type: REAL
          nullable: true
          description: The `state_highway_indicator` column indicates whether the
            collision occurred on a state highway, with values typically representing
            a binary indicator (e.g., 1.0 for on a state highway, 0.0 otherwise).
        - name: caltrans_county
          type: TEXT
          nullable: true
          description: The `caltrans_county` field represents the county name associated
            with a collision location according to Caltrans records. It is typically
            used to identify the geographic region for highway-related data.
        - name: caltrans_district
          type: REAL
          nullable: true
          description: The `caltrans_district` column represents the Caltrans district
            associated with a collision, indicating the regional division responsible
            for highway maintenance and operations. The data is stored as a real number
            and may contain null values.
        - name: state_route
          type: REAL
          nullable: true
          description: The `state_route` column represents the state highway route
            number associated with the collision, typically as a numeric value.
        - name: route_suffix
          type: TEXT
          nullable: true
          description: route_suffix is a text field that indicates a suffix associated
            with a state route, providing additional information about the route's
            designation.
        - name: postmile_prefix
          type: TEXT
          nullable: true
          description: The `postmile_prefix` field contains textual prefixes associated
            with postmile measurements on state routes, often indicating specific
            segments or directions.
        - name: postmile
          type: REAL
          nullable: true
          description: The postmile column represents a real number indicating the
            mile marker location along a highway or route where the collision occurred.
        - name: location_type
          type: TEXT
          nullable: true
          description: The `location_type` field indicates the general type of location
            where the collision occurred, such as "highway" or "intersection."
        - name: ramp_intersection
          type: TEXT
          nullable: true
          description: The `ramp_intersection` field indicates whether the collision
            occurred at a ramp intersection, with values describing the type of intersection
            involved.
        - name: side_of_highway
          type: TEXT
          nullable: true
          description: The `side_of_highway` field indicates the direction of travel
            on the highway where the collision occurred, such as "northbound" or "southbound."
        - name: tow_away
          type: REAL
          nullable: true
          description: Indicates whether a tow truck was used after the collision.
        - name: collision_severity
          type: TEXT
          nullable: true
          description: collision_severity is a text field indicating the severity
            of the collision, such as "property damage only" or other classifications.
        - name: killed_victims
          type: REAL
          nullable: true
          description: The `killed_victims` column stores the number of people killed
            in a collision as a real number, with null values allowed.
        - name: injured_victims
          type: REAL
          nullable: true
          description: The `injured_victims` column stores the number of people injured
            in a collision as a real number, with null values allowed.
        - name: party_count
          type: REAL
          nullable: true
          description: The `party_count` column represents the number of parties involved
            in a collision, stored as a real number and allowing null values.
        - name: primary_collision_factor
          type: TEXT
          nullable: true
          description: The primary factor contributing to the collision, often indicating
            a violation or cause such as speeding or wrong-way driving.
        - name: pcf_violation_code
          type: TEXT
          nullable: true
          description: The `pcf_violation_code` field contains text values representing
            specific violation codes related to the primary collision factor in traffic
            collision records.
        - name: pcf_violation_category
          type: TEXT
          nullable: true
          description: The `pcf_violation_category` column contains text values that
            categorize the primary collision factor violation, such as "speeding"
            or "wrong side of road."
        - name: pcf_violation
          type: REAL
          nullable: true
          description: The `pcf_violation` column represents a numeric code indicating
            the specific vehicle code violation associated with the collision, if
            available.
        - name: pcf_violation_subsection
          type: TEXT
          nullable: true
          description: The `pcf_violation_subsection` field contains textual information
            describing the specific subsection of a violation code related to the
            primary collision factor.
        - name: hit_and_run
          type: TEXT
          nullable: true
          description: A field indicating whether the collision involved a hit-and-run
            incident, with possible values such as "not hit and run" or "misdemeanor."
        - name: type_of_collision
          type: TEXT
          nullable: true
          description: The `type_of_collision` field describes the nature of the collision,
            such as "rear end," "hit object," or "sideswipe."
        - name: motor_vehicle_involved_with
          type: TEXT
          nullable: true
          description: The "motor_vehicle_involved_with" field indicates the type
            of motor vehicle or object the vehicle was involved with during the collision.
        - name: pedestrian_action
          type: TEXT
          nullable: true
          description: The `pedestrian_action` column indicates whether a pedestrian
            was involved in the collision and describes their action, if applicable.
        - name: road_surface
          type: TEXT
          nullable: true
          description: The "road_surface" field describes the surface condition of
            the road where the collision occurred, such as dry or wet.
        - name: road_condition_1
          type: TEXT
          nullable: true
          description: road_condition_1 is a text field indicating the primary road
            condition at the time of the collision, such as construction or normal.
        - name: road_condition_2
          type: TEXT
          nullable: true
          description: The `road_condition_2` field describes a secondary road condition
            at the time of the collision, such as additional surface or environmental
            factors, and is stored as text.
        - name: lighting
          type: TEXT
          nullable: true
          description: The "lighting" column describes the lighting conditions at
            the time of the collision, such as daylight or nighttime.
        - name: control_device
          type: TEXT
          nullable: true
          description: The `control_device` field indicates the type of traffic control
            device present at the time of the collision, such as traffic signals or
            signs. It is stored as text and may be null.
        - name: chp_road_type
          type: TEXT
          nullable: true
          description: The `chp_road_type` field describes the type of road where
            a collision occurred, as classified by the California Highway Patrol.
            It is stored as text and may contain codes or descriptors indicating the
            road category.
        - name: pedestrian_collision
          type: INTEGER
          nullable: true
          description: The `pedestrian_collision` column indicates whether a collision
            involved a pedestrian, with a value of 0 meaning no pedestrian was involved.
        - name: bicycle_collision
          type: INTEGER
          nullable: true
          description: The `bicycle_collision` column indicates whether a collision
            involved a bicycle, with integer values representing the presence or absence
            of such incidents.
        - name: motorcycle_collision
          type: INTEGER
          nullable: true
          description: The `motorcycle_collision` column indicates whether a motorcycle
            was involved in the collision, with integer values representing the presence
            or absence of such involvement.
        - name: truck_collision
          type: INTEGER
          nullable: true
          description: The `truck_collision` column indicates whether a collision
            involved a truck, with a value of 1 representing involvement and 0 indicating
            no involvement.
        - name: not_private_property
          type: REAL
          nullable: true
          description: A real-valued field indicating whether the collision occurred
            on non-private property, where 1.0 typically represents "not private property."
        - name: alcohol_involved
          type: REAL
          nullable: true
          description: A nullable real number indicating whether alcohol was involved
            in the collision.
        - name: statewide_vehicle_type_at_fault
          type: TEXT
          nullable: true
          description: The "statewide_vehicle_type_at_fault" column identifies the
            type of vehicle at fault in the collision, as classified by state standards.
            It is a text field that can contain null values.
        - name: chp_vehicle_type_at_fault
          type: TEXT
          nullable: true
          description: The `chp_vehicle_type_at_fault` field describes the type of
            vehicle at fault in a collision, as classified by the California Highway
            Patrol (CHP). It typically includes details such as "passenger car, station"
            or similar vehicle classifications.
        - name: severe_injury_count
          type: INTEGER
          nullable: true
          description: The `severe_injury_count` column contains the number of severe
            injuries resulting from each collision, recorded as an integer value.
        - name: other_visible_injury_count
          type: INTEGER
          nullable: true
          description: The number of victims with other visible injuries in a collision.
        - name: complaint_of_pain_injury_count
          type: INTEGER
          nullable: true
          description: The `complaint_of_pain_injury_count` column represents the
            number of victims who reported pain but no visible injuries in a collision.
        - name: pedestrian_killed_count
          type: INTEGER
          nullable: true
          description: The `pedestrian_killed_count` column represents the number
            of pedestrians killed in a collision, recorded as an integer value.
        - name: pedestrian_injured_count
          type: INTEGER
          nullable: true
          description: The number of pedestrians injured in the collision.
        - name: bicyclist_killed_count
          type: INTEGER
          nullable: true
          description: The number of bicyclists killed in a collision.
        - name: bicyclist_injured_count
          type: INTEGER
          nullable: true
          description: The number of injured bicyclists involved in a collision.
        - name: motorcyclist_killed_count
          type: INTEGER
          nullable: true
          description: The `motorcyclist_killed_count` column represents the number
            of motorcyclists killed in each collision incident.
        - name: motorcyclist_injured_count
          type: REAL
          nullable: true
          description: The number of injured motorcyclists in a collision, represented
            as a real number.
        - name: primary_ramp
          type: TEXT
          nullable: true
          description: The `primary_ramp` column contains textual information describing
            the primary ramp associated with a collision location, if applicable.
        - name: secondary_ramp
          type: TEXT
          nullable: true
          description: The `secondary_ramp` column contains textual information describing
            the secondary ramp associated with a collision location, if applicable.
        - name: latitude
          type: REAL
          nullable: true
          description: The `latitude` column stores the geographic latitude of the
            collision location as a real number.
        - name: longitude
          type: REAL
          nullable: true
          description: The longitude of the collision location, represented as a real
            number.
        - name: collision_date
          type: TEXT
          nullable: true
          description: collision_date is a text field that records the date of the
            collision, typically in the format 'YYYY-MM-DD'.
        - name: collision_time
          type: TEXT
          nullable: true
          description: collision_time is a text field that records the time when a
            collision occurred.
        - name: process_date
          type: TEXT
          nullable: true
          description: The `process_date` field indicates the date when the collision
            record was processed, typically in the format 'YYYY-MM-DD'.
