datasource_id: databases/music.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: Album
        columns:
        - name: AlbumId
          type: INTEGER
          nullable: false
          description: AlbumId is an integer column that uniquely identifies each
            album and cannot be null.
        - name: Title
          type: NVARCHAR(160)
          nullable: false
          description: The Title column stores the name of the album as a non-nullable
            string with a maximum length of 160 characters.
        - name: ArtistId
          type: INTEGER
          nullable: false
          description: ArtistId is an integer column that uniquely identifies the
            artist associated with the album. It cannot be null and references the
            Artist table.
        samples:
        - albumid: 1
          title: For Those About To Rock We Salute You
          artistid: 1
        - albumid: 2
          title: Balls to the Wall
          artistid: 2
        - albumid: 3
          title: Restless and Wild
          artistid: 2
        - albumid: 4
          title: Let There Be Rock
          artistid: 1
        - albumid: 5
          title: Big Ones
          artistid: 3
        description: The Album table stores information about music albums, including
          a unique album ID, title, and the associated artist ID. It is linked to
          the Artist table through the ArtistId column.
        kind: table
        primary_key:
          name: pk_Album
          columns:
          - AlbumId
          validated: true
        indexes:
        - name: IFK_AlbumArtistId
          columns:
          - ArtistId
          unique: false
        - name: IPK_Album
          columns:
          - AlbumId
          unique: true
        foreign_keys:
        - name: fk_Album_0
          mapping:
          - from_column: ArtistId
            to_column: ArtistId
          referenced_table: main.Artist
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
      - name: Artist
        columns:
        - name: ArtistId
          type: INTEGER
          nullable: false
          description: ArtistId is an integer column that uniquely identifies each
            artist and cannot be null.
        - name: Name
          type: NVARCHAR(120)
          nullable: true
          description: The Name column stores the name of an artist as a variable-length
            Unicode string, up to 120 characters, and allows null values.
        samples:
        - artistid: 1
          name: AC/DC
        - artistid: 2
          name: Accept
        - artistid: 3
          name: Aerosmith
        - artistid: 4
          name: Alanis Morissette
        - artistid: 5
          name: Alice In Chains
        description: A table containing information about artists, with a primary
          key on the ArtistId column and artist names stored as variable-length text.
        kind: table
        primary_key:
          name: pk_Artist
          columns:
          - ArtistId
          validated: true
        indexes:
        - name: IPK_Artist
          columns:
          - ArtistId
          unique: true
