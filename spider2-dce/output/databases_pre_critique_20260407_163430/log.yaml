datasource_id: databases/log.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: access_log
        columns:
        - name: session
          type: varchar(255)
          nullable: true
          description: The session column stores session identifiers as variable-length
            strings, up to 255 characters, and allows null values.
        - name: user_id
          type: varchar(255)
          nullable: true
          description: The `user_id` column stores user identifiers as variable-length
            strings, up to 255 characters, and allows null values.
        - name: action
          type: varchar(255)
          nullable: true
          description: The `action` column stores the type of action performed, such
            as "view," and allows null values.
        - name: stamp
          type: varchar(255)
          nullable: true
          description: The `stamp` column stores timestamp data as variable-length
            strings, with entries formatted as date and time values (e.g., '2016-01-01
            18:00:00').
        samples:
        - session: 98900e
          user_id: U001
          action: view
          stamp: '2016-01-01 18:00:00'
        - session: 98900e
          user_id: U001
          action: view
          stamp: '2016-01-02 20:00:00'
        - session: 98900e
          user_id: U001
          action: view
          stamp: '2016-01-03 22:00:00'
        - session: 1cf768
          user_id: U002
          action: view
          stamp: '2016-01-04 23:00:00'
        - session: 1cf768
          user_id: U002
          action: view
          stamp: '2016-01-05 00:30:00'
        description: The access_log table records user activity with session identifiers,
          user IDs, actions performed, and timestamps.
        kind: table
      - name: action_log
        columns:
        - name: session
          type: varchar(255)
          nullable: true
          description: session is a nullable varchar(255) column representing a session
            identifier in the action_log table.
        - name: user_id
          type: varchar(255)
          nullable: true
          description: A column storing user identifiers as variable-length strings,
            allowing null values.
        - name: action
          type: varchar(255)
          nullable: true
          description: The "action" column stores the type of user interaction, such
            as "purchase," "view," "favorite," "review," or "add_cart."
        - name: category
          type: varchar(255)
          nullable: true
          description: The `category` column stores the category associated with an
            action, such as "drama," and is used to classify the type of product or
            content involved.
        - name: products
          type: varchar(255)
          nullable: true
          description: A field storing product identifiers, typically as a comma-separated
            list, associated with actions taken by users.
        - name: amount
          type: INTEGER
          nullable: true
          description: The amount column stores integer values representing quantities
            or numerical data related to actions, such as purchase amounts.
        - name: stamp
          type: varchar(255)
          nullable: true
          description: A varchar(255) column representing a timestamp associated with
            each action, typically in the format 'YYYY-MM-DD HH:MM:SS'.
        samples:
        - session: 989004ea
          user_id: U001
          action: purchase
          category: drama
          products: D001,D002
          amount: 2000
          stamp: '2016-11-03 18:10:00'
        - session: 989004ea
          user_id: U001
          action: view
          stamp: '2016-11-03 18:00:00'
        - session: 989004ea
          user_id: U001
          action: favorite
          category: drama
          products: D001
          stamp: '2016-11-03 18:00:00'
        - session: 989004ea
          user_id: U001
          action: review
          category: drama
          products: D001
          stamp: '2016-11-03 18:00:00'
        - session: 989004ea
          user_id: U001
          action: add_cart
          category: drama
          products: D001
          stamp: '2016-11-03 18:00:00'
        description: A table that records user actions such as views, purchases, favorites,
          reviews, and cart additions, including details like session, user ID, category,
          products, and timestamps.
        kind: table
      - name: action_log_with_ip
        columns:
        - name: session
          type: varchar(255)
          nullable: true
          description: 'session: A string identifier for a user session, up to 255
            characters, which may be null.'
        - name: user_id
          type: varchar(255)
          nullable: true
          description: A column storing user identifiers as variable-length strings,
            allowing null values.
        - name: action
          type: varchar(255)
          nullable: true
          description: A column storing the type of action performed, such as 'view',
            associated with user sessions and IP addresses.
        - name: ip
          type: varchar(255)
          nullable: true
          description: The `ip` column stores the IP address associated with each
            action, with a maximum length of 255 characters and the ability to store
            null values.
        - name: stamp
          type: varchar(255)
          nullable: true
          description: The `stamp` column stores timestamp data as variable-length
            strings, with a maximum length of 255 characters. It is nullable and typically
            contains date and time information in a text format, such as `'2016-11-03
            18:00:00'`.
        samples:
        - session: 0CVKaz
          user_id: U001
          action: view
          ip: 216.58.220.238
          stamp: '2016-11-03 18:00:00'
        - session: 1QceiB
          user_id: U002
          action: view
          ip: 98.139.183.24
          stamp: '2016-11-03 19:00:00'
        - session: 1hI43A
          user_id: U003
          action: view
          ip: 210.154.149.63
          stamp: '2016-11-03 20:00:00'
        - session: 989004ea
          user_id: U001
          action: view
          ip: 216.58.220.238
          stamp: '2016-11-03 18:00:00'
        - session: 47db0370
          user_id: U002
          action: view
          ip: 98.139.183.24
          stamp: '2016-11-03 19:00:00'
        description: A table logging user actions with session, user ID, action type,
          IP address, and timestamp information.
        kind: table
      - name: action_log_with_noise
        columns:
        - name: stamp
          type: varchar(255)
          nullable: true
          description: A column named 'stamp' of type varchar(255) that can store
            nullable values.
        - name: session
          type: varchar(255)
          nullable: true
          description: A column named "session" with a data type of varchar(255) that
            can store null values.
        - name: action
          type: varchar(255)
          nullable: true
          description: A column named "action" with a maximum length of 255 characters,
            allowing null values.
        - name: products
          type: varchar(255)
          nullable: true
          description: The "products" column stores variable-length text data, up
            to 255 characters, and allows null values.
        - name: url
          type: TEXT
          nullable: true
          description: The `url` column stores text data representing URLs, with the
            ability to contain null values.
        - name: ip
          type: varchar(255)
          nullable: true
          description: The `ip` column stores IP addresses as variable-length strings
            with a maximum length of 255 characters and allows null values.
        - name: user_agent
          type: TEXT
          nullable: true
          description: The `user_agent` column stores text data representing the browser
            or client used, and can contain `NULL` values.
        samples: []
        description: A table containing logs of actions with associated details such
          as timestamps, sessions, actions performed, products, URLs, IP addresses,
          and user agents, including nullable fields.
        kind: table
      - name: activity_log
        columns:
        - name: stamp
          type: varchar(255)
          nullable: true
          description: A column storing timestamp information as variable-length text,
            allowing null values.
        - name: session
          type: varchar(255)
          nullable: true
          description: A field storing session identifiers, used to track user sessions,
            with variable-length string values up to 255 characters.
        - name: action
          type: varchar(255)
          nullable: true
          description: A column storing the type of user action, such as 'view', associated
            with a session in the activity log.
        - name: option
          type: varchar(255)
          nullable: true
          description: The "option" column stores text values indicating the type
            of action taken, such as "search" or "page" or "detail".
        - name: path
          type: varchar(255)
          nullable: true
          description: A field storing the URL path associated with each activity,
            such as '/search_list/' or '/detail/'.
        - name: search_type
          type: varchar(255)
          nullable: true
          description: A field storing the type of search associated with an activity,
            such as "Area-L-with-Job" or "Pref". It is nullable and can contain variable-length
            text up to 255 characters.
        samples:
        - stamp: '2017-01-09 12:18:43'
          session: 989004ea
          action: view
          option: search
          path: /search_list/
          search_type: Area-L-with-Job
        - stamp: '2017-01-09 12:19:27'
          session: 989004ea
          action: view
          option: page
          path: /search_input/
          search_type: ''
        - stamp: '2017-01-09 12:20:03'
          session: 989004ea
          action: view
          option: search
          path: /search_list/
          search_type: Pref
        - stamp: '2017-01-09 12:18:43'
          session: 47db0370
          action: view
          option: search
          path: /search_list/
          search_type: Area-S
        - stamp: '2017-01-09 12:18:43'
          session: 1cf7678e
          action: view
          option: detail
          path: /detail/
          search_type: ''
        description: A table that records user activity with fields such as timestamp,
          session ID, action type, option, path, and search type, capturing interactions
          like views and searches.
        kind: table
      - name: app1_mst_users
