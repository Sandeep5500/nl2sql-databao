datasource_id: databases/education_business.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: SalaryDataset
        columns:
        - name: index
          type: INTEGER
          nullable: true
          description: The index column contains integer values and can include null
            entries.
        - name: CompanyName
          type: TEXT
          nullable: true
          description: A column containing the name of the company where the job is
            posted.
        - name: JobTitle
          type: TEXT
          nullable: true
          description: JobTitle is a nullable TEXT column representing the title of
            the job position.
        - name: SalariesReported
          type: REAL
          nullable: true
          description: The "SalariesReported" column contains real number values indicating
            the count of salaries reported, with decimal precision and nullable entries.
        - name: Location
          type: TEXT
          nullable: true
          description: Location is a nullable text field representing the place associated
            with the salary data.
        - name: Salary
          type: TEXT
          nullable: true
          description: Salary is a nullable TEXT column that stores salary information,
            typically in a formatted string such as '₹X,XX,XXX/yr'.
        samples:
        - index: 0
          companyname: Mu Sigma
          jobtitle: Data Scientist
          salariesreported: 105.0
          location: Bangalore
          salary: ₹6,48,573/yr
        - index: 1
          companyname: IBM
          jobtitle: Data Scientist
          salariesreported: 95.0
          location: Bangalore
          salary: ₹11,91,950/yr
        - index: 2
          companyname: Tata Consultancy Services
          jobtitle: Data Scientist
          salariesreported: 66.0
          location: Bangalore
          salary: ₹8,36,874/yr
        - index: 3
          companyname: Impact Analytics
          jobtitle: Data Scientist
          salariesreported: 40.0
          location: Bangalore
          salary: ₹6,69,578/yr
        - index: 4
          companyname: Accenture
          jobtitle: Data Scientist
          salariesreported: 32.0
          location: Bangalore
          salary: ₹9,44,110/yr
        description: A dataset containing reported salaries for Data Scientist roles
          at various companies in Bangalore, including the number of salaries reported
          and the corresponding company, job title, location, and salary amount.
        kind: table
      - name: StaffHours
        columns:
        - name: StaffMember
          type: TEXT
          nullable: true
          description: StaffMember is a nullable text field representing the identifier
            of a staff member.
        - name: EventDate
          type: TEXT
          nullable: true
          description: EventDate represents the date of an event related to staff
            hours, stored as text and allowing null values.
        - name: EventTime
          type: TEXT
          nullable: true
          description: EventTime represents the time of day for an event, recorded
            as text and allowing null values.
        - name: EventType
          type: TEXT
          nullable: true
          description: Records the type of event, such as "Enter" or "Exit," associated
            with staff member activity.
        samples:
        - staffmember: B
          eventdate: '2013-02-01'
          eventtime: 09:00
          eventtype: Enter
        - staffmember: A
          eventdate: '2013-01-15'
          eventtime: 08:00
          eventtype: Exit
        - staffmember: C
          eventdate: '2013-03-01'
          eventtime: 07:45
          eventtype: Enter
        - staffmember: A
          eventdate: '2013-01-08'
          eventtime: '11:00'
          eventtype: Enter
        - staffmember: E
          eventdate: '2013-03-01'
          eventtime: '17:00'
          eventtype: Exit
        description: StaffHours is a table that records staff member activity with
          details including the staff member's name, event date, event time, and event
          type (e.g., Enter or Exit).
        kind: table
      - name: hardware_dim_customer
        columns:
        - name: customer_code
          type: INTEGER
          nullable: true
          description: Customer code as an integer, which can be null.
        - name: customer
          type: TEXT
          nullable: true
          description: Customer name associated with the customer code, representing
            the business or entity.
        - name: platform
          type: TEXT
          nullable: true
          description: platform is a nullable TEXT column representing the sales platform
            associated with the customer, such as "Brick & Mortar" or "E-Commerce".
        - name: channel
          type: TEXT
          nullable: true
          description: The `channel` column represents the sales or distribution channel
            associated with the customer, such as "Direct." It is a nullable text
            field.
        - name: market
          type: TEXT
          nullable: true
          description: A text field representing the market associated with a customer,
            such as "India" or "Indonesia."
        - name: sub_zone
          type: TEXT
          nullable: true
          description: sub_zone is a nullable text field representing a geographic
            sub-zone associated with the customer.
        - name: region
          type: TEXT
          nullable: true
          description: The `region` column contains textual values representing the
            geographic region associated with a customer, such as "APAC". The column
            allows null values.
        samples:
        - customer_code: 70002017
          customer: Atliq Exclusive
          platform: Brick & Mortar
          channel: Direct
          market: India
          sub_zone: India
          region: APAC
        - customer_code: 70002018
          customer: Atliq e Store
          platform: E-Commerce
          channel: Direct
          market: India
          sub_zone: India
          region: APAC
        - customer_code: 70003181
          customer: Atliq Exclusive
          platform: Brick & Mortar
          channel: Direct
          market: Indonesia
          sub_zone: ROA
          region: APAC
        - customer_code: 70003182
          customer: Atliq e Store
          platform: E-Commerce
          channel: Direct
          market: Indonesia
          sub_zone: ROA
          region: APAC
        - customer_code: 70004069
          customer: Atliq Exclusive
          platform: Brick & Mortar
          channel: Direct
          market: Japan
          sub_zone: ROA
          region: APAC
        description: A table containing customer information for hardware, including
          customer codes, names, platforms, channels, and geographic details.
        kind: table
      - name: hardware_dim_product
        columns:
        - name: product_code
          type: TEXT
          nullable: true
          description: Product code identifier for hardware items, used to uniquely
            specify product variants.
        - name: division
          type: TEXT
          nullable: true
          description: Division classification for the product, such as "P & A," indicating
            the business division responsible for the item.
        - name: segment
          type: TEXT
          nullable: true
          description: A text field representing the product segment, such as "Peripherals,"
            used for categorizing hardware products at a higher level.
        - name: category
          type: TEXT
          nullable: true
          description: The `category` column stores the product category, such as
            "Internal HDD," and is used to classify products under broader types.
        - name: product
          type: TEXT
          nullable: true
          description: Product name describing the hardware, such as "AQ Dracula HDD
            – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache".
        - name: variant
          type: TEXT
          nullable: true
          description: The `variant` column contains textual descriptions of product
            variations, such as "Standard," "Plus," "Premium," and "Premium Plus."
        samples:
        - product_code: A0118150101
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ Dracula HDD – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache
          variant: Standard
        - product_code: A0118150102
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ Dracula HDD – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache
          variant: Plus
        - product_code: A0118150103
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ Dracula HDD – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache
          variant: Premium
        - product_code: A0118150104
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ Dracula HDD – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache
          variant: Premium Plus
        - product_code: A0219150201
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ WereWolf NAS Internal Hard Drive HDD – 8.89 cm
          variant: Standard
        description: A table containing product details for hardware items, including
          product code, division, segment, category, product name, and variant.
        kind: table
      - name: hardware_fact_gross_price
