        description: A table containing customer demographic information, including
          customer type identifiers and optional descriptions.
        kind: table
      - name: customergroupthreshold
        columns:
        - name: groupname
          type: TEXT
          nullable: false
          description: A non-nullable text column representing the name of the customer
            group.
        - name: rangebottom
          type: DECIMAL
          nullable: false
          description: The `rangebottom` column defines the lower bound of a numeric
            range for customer groups, with values stored as non-nullable decimal
            numbers.
        - name: rangetop
          type: DECIMAL
          nullable: false
          description: The `rangetop` column defines the upper bound of a customer
            group's spending range, stored as a non-nullable decimal value.
        samples:
        - groupname: Low
          rangebottom: 0
          rangetop: 999.9999
        - groupname: Medium
          rangebottom: 1000
          rangetop: 4999.9999
        - groupname: High
          rangebottom: 5000
          rangetop: 9999.9999
        - groupname: Very High
          rangebottom: 10000
          rangetop: 922337203685477.6
        description: A table that defines customer group thresholds based on numeric
          ranges, used to categorize customers into groups such as Low, Medium, High,
          and Very High.
        kind: table
      - name: customers
