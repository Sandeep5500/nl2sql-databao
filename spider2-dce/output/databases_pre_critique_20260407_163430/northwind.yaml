datasource_id: databases/northwind.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: categories
        columns:
        - name: categoryid
          type: INTEGER
          nullable: false
          description: A non-nullable integer column representing the unique identifier
            for each category.
        - name: categoryname
          type: TEXT
          nullable: false
          description: A non-nullable text column representing the name of the category.
        - name: description
          type: TEXT
          nullable: true
          description: A text field containing a brief description of the category,
            which can be left empty.
        - name: picture
          type: BLOB
          nullable: true
          description: The `picture` column stores binary data (BLOB) representing
            images for categories, and can contain null values.
        samples:
        - categoryid: 1
          categoryname: Beverages
          description: Soft drinks, coffees, teas, beers, and ales
          picture: \x
        - categoryid: 2
          categoryname: Condiments
          description: Sweet and savory sauces, relishes, spreads, and seasonings
          picture: \x
        - categoryid: 3
          categoryname: Confections
          description: Desserts, candies, and sweet breads
          picture: \x
        - categoryid: 4
          categoryname: Dairy Products
          description: Cheeses
          picture: \x
        - categoryid: 5
          categoryname: Grains/Cereals
          description: Breads, crackers, pasta, and cereal
          picture: \x
        description: A table containing category information with fields for category
          ID, name, description, and picture.
        kind: table
      - name: customercustomerdemo
