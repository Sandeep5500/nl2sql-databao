      - name: appearances
        columns:
        - name: year
          type: INTEGER
          nullable: true
          description: Year of the player's appearance, stored as an integer value.
        - name: team_id
          type: TEXT
          nullable: true
          description: team_id is a nullable text field representing the identifier
