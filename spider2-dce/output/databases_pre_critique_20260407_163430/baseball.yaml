  - name: default
    schemas:
    - name: main
      tables:
      - name: all_star
        columns:
        - name: player_id
          type: TEXT
          nullable: true
          description: Player identifier as text.
        - name: year
          type: INTEGER
          nullable: true
          description: The "year" column represents the year of the All-Star game
            appearance, stored as an integer and allowing null values.
        - name: game_num
          type: INTEGER
          nullable: true
          description: game_num is an integer column representing the game number,
            indicating the specific game within a season.
        - name: game_id
          type: TEXT
          nullable: true
          description: game_id is a text field representing the unique identifier
            for a game, with values like "ALS193307060".
        - name: team_id
          type: TEXT
          nullable: true
          description: team_id is a nullable TEXT column representing the team identifier
            associated with a player in the all_star table.
        - name: league_id
          type: TEXT
          nullable: true
          description: league_id is a nullable TEXT column representing the league
            identifier associated with a player's All-Star game appearance.
        - name: gp
          type: NUMERIC
          nullable: true
          description: gp is a numeric column representing the number of games played,
            with possible null values.
        - name: starting_pos
          type: NUMERIC
          nullable: true
          description: The `starting_pos` column represents the starting position
            of a player in the All-Star game, stored as a numeric value.
