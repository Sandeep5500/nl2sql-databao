        - order_id: 1
          customer_id: 101
          pizza_id: 1
          order_time: '2021-01-01 18:05:02'
        - order_id: 2
          customer_id: 101
          pizza_id: 1
          order_time: '2021-01-01 19:00:52'
        - order_id: 3
          customer_id: 102
          pizza_id: 1
          order_time: '2021-01-02 23:51:23'
        - order_id: 3
          customer_id: 102
          pizza_id: 2
          order_time: '2021-01-02 23:51:23'
        - order_id: 4
