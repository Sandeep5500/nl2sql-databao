datasource_id: databases/modern_data.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: companies_dates
        columns:
        - name: company_id
          type: INTEGER
          nullable: true
          description: company_id is an integer column that uniquely identifies a
            company, with null values allowed.
        - name: date_joined
          type: TEXT
          nullable: true
          description: The `date_joined` column stores the date and time a company
            joined, in text format.
        - name: year_founded
          type: INTEGER
          nullable: true
          description: Stores the year a company was founded, as an integer value.
        samples:
        - company_id: 109
          date_joined: '2020-09-08T00:00:00.000'
          year_founded: 2004
        - company_id: 821
          date_joined: '2019-05-16T00:00:00.000'
          year_founded: 2009
        - company_id: 153
          date_joined: '2019-07-11T00:00:00.000'
          year_founded: 2016
        - company_id: 972
          date_joined: '2018-10-17T00:00:00.000'
          year_founded: 2016
        - company_id: 1022
          date_joined: '2021-06-02T00:00:00.000'
          year_founded: 2013
        description: A table containing company information including company ID,
          date joined, and year founded.
        kind: table
      - name: companies_funding
        columns:
        - name: company_id
          type: INTEGER
          nullable: true
          description: Unique identifier for a company, represented as an integer.
        - name: valuation
          type: INTEGER
          nullable: true
          description: The "valuation" column represents the estimated value of a
            company in integer format, and it can contain null values.
        - name: funding
          type: INTEGER
          nullable: true
          description: The "funding" column represents the amount of funding a company
            has received, measured in dollars, and is stored as an integer value.
        - name: select_investors
          type: TEXT
          nullable: true
          description: A text field containing a list of select investors associated
            with a company, typically formatted as a quoted string of comma-separated
            names.
        samples:
        - company_id: 548
          valuation: 2000000000
          funding: 449000000
          select_investors: '"Accel Partners, Index Ventures, Insight Venture Partners"'
        - company_id: 645
          valuation: 1000000000
          funding: 188000000
          select_investors: '"Sequoia Capital China, China Life Investment Holding
            Company, Qiming Venture Partners"'
        - company_id: 615
          valuation: 1000000000
          funding: 2000000000
          select_investors: '"CreditEase Fintech Investment Fund, BMW i Ventures,
            SoftBank Group"'
        - company_id: 51
          valuation: 10000000000
          funding: 564000000
          select_investors: '"DFJ Growth Fund, Coatue Management, Addition"'
        - company_id: 680
          valuation: 1000000000
          funding: 362000000
          select_investors: '"China Grand Prosperity Investment, CSC Group"'
        description: A table containing funding details for companies, including company
          ID, valuation, funding amount, and a list of select investors.
        kind: table
      - name: companies_industries
        columns:
        - name: company_id
          type: INTEGER
          nullable: true
          description: A nullable integer column representing company identifiers.
        - name: industry
          type: TEXT
          nullable: true
          description: The `industry` column contains textual data representing the
            industry classification of companies, such as "Fintech" or "Internet software
            & services." The values are nullable.
        samples:
        - company_id: 316
          industry: Fintech
        - company_id: 162
          industry: Fintech
        - company_id: 803
          industry: Fintech
        - company_id: 278
          industry: Internet software & services
        - company_id: 983
          industry: Fintech
        description: A table that maps company IDs to their respective industries,
          such as "Fintech" or "Internet software & services."
        kind: table
      - name: income_trees
        columns:
        - name: zipcode
          type: INTEGER
          nullable: true
          description: Zip code associated with income data, stored as an integer.
        - name: Estimate_Total
          type: INTEGER
          nullable: true
          description: Estimate of the total number of income-earning units, represented
            as an integer value.
        - name: Margin_of_Error_Total
          type: INTEGER
          nullable: true
          description: Margin_of_Error_Total is an integer column representing the
            margin of error for the total income estimate in the income_trees table.
        - name: Estimate_Median_income
          type: INTEGER
          nullable: true
          description: Estimate of median income for the population, represented as
            an integer value.
        - name: Margin_of_Error_Median_income
          type: INTEGER
          nullable: true
          description: Margin_of_Error_Median_income is an integer column that represents
