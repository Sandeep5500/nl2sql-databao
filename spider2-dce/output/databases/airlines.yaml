          actual_arrival: \N
        description: Each row records a specific flight instance (a scheduled flight
          on a given date) with its planned and actual times, route, status, and assigned
          aircraft. one row per (flight_id) — a specific flight instance  [no declared
          key; proposed by an LLM and verified unique in the data]
        kind: table
      - name: seats
        columns:
        - name: aircraft_code
          type: character(3)
          nullable: false
          description: 'Values: text; values: 773 (402), 763 (222), 321 (170), 320
            (140), 733 (130), 319 (116), SU9 (97), CR2 (50), CN1 (12); 1180 values
            are numbers.'
        - name: seat_no
          type: character varying(4)
          nullable: false
          description: 'Values: text; formats (9 = digit, A = letters): 99A 76% e.g.
            ''10A'', 9A 24% e.g. ''1A''.'
        - name: fare_conditions
          type: character varying(10)
          nullable: false
          description: 'Values: text; values: Economy (1139), Business (152), Comfort
