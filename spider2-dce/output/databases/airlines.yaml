datasource_id: databases/airlines.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: aircrafts_data
        columns:
        - name: aircraft_code
          type: character(3)
          nullable: false
          description: 'Values: text; values: 319 (1), 320 (1), 321 (1), 733 (1),
            763 (1), 773 (1), CN1 (1), CR2 (1), SU9 (1); 6 values are numbers.'
        - name: model
          type: jsonb
          nullable: false
          description: 'Values: text; values: {"en": "Airbus A319-100", "ru": "Аэробу…
            (1), {"en": "Airbus A320-200", "ru": "Аэробу… (1), {"en": "Airbus A321-200",
            "ru": "Аэробу… (1), {"en": "Boeing 737-300", "ru": "Боинг 7… (1), {"en":
            "Boeing 767-300", "ru": "Боинг 7… (1), {"en": "Boeing 777-300", "ru":
            "Боинг 7… (1), {"en": "Bombardier CRJ-200", "ru": "Бом… (1), {"en": "Cessna
            208 Caravan", "ru": "Сес… (1), {"en": "Sukhoi Superjet-100", "ru": "Су…
            (1). The model column for aircraft_code ''320'' contains the string ''{"en":
            "Airbus A320-200", "ru": "Аэробус A320-200"}''.'
        - name: range
          type: INTEGER
          nullable: false
          description: 'Values: integer 1200 .. 11100; values: 11100 (1), 1200 (1),
            2700 (1), 3000 (1), 4200 (1), 5600 (1), 5700 (1), 6700 (1), 7900 (1).'
        samples:
        - aircraft_code: '773'
          model: '{"en": "Boeing 777-300", "ru": "Боинг 777-300"}'
          range: 11100
        - aircraft_code: '763'
          model: '{"en": "Boeing 767-300", "ru": "Боинг 767-300"}'
          range: 7900
        - aircraft_code: SU9
          model: '{"en": "Sukhoi Superjet-100", "ru": "Сухой Суперджет-100"}'
          range: 3000
        - aircraft_code: '320'
          model: '{"en": "Airbus A320-200", "ru": "Аэробус A320-200"}'
          range: 5700
        - aircraft_code: '321'
          model: '{"en": "Airbus A321-200", "ru": "Аэробус A321-200"}'
          range: 5600
        description: 'The table aircrafts_data records aircraft types (models) with
          their maximum range in kilometers. Each row represents a unique aircraft
          model code used across the airline fleet. one row per (aircraft_code) —
          an aircraft type  [no declared key; proposed by an LLM and verified unique
          in the data] The model column contains a JSON string, as shown by the value
          "{\"en\": \"Airbus A320-200\", \"ru\": \"Аэробус A320-200\"}" for aircraft_code
          ''320''.'
        kind: table
      - name: airports_data
        columns:
        - name: airport_code
          type: character(3)
          nullable: false
          description: 'Values: text. The airports_data table contains airport_code
            values SVO, VKO, and DME, each associated with an airport_name and city
            stored as JSON objects containing English and Russian keys.'
        - name: airport_name
          type: jsonb
          nullable: false
          description: 'Values: text.'
        - name: city
          type: jsonb
          nullable: false
          description: 'Values: text. The city column contains JSON-like strings with
            ''en'' and ''ru'' keys.'
        - name: coordinates
          type: point
          nullable: false
          description: 'Values: text. The coordinates column in the airports_data
            table stores values as text strings in the format ''(longitude,latitude)''
            containing decimal numbers.'
        - name: timezone
          type: TEXT
          nullable: false
          description: 'Values: text; formats (9 = digit, A = letters): A/A 100% e.g.
            ''Asia/Anadyr''. The airports_data table contains 17 distinct values in
            the timezone column.'
        samples:
        - airport_code: YKS
          airport_name: '{"en": "Yakutsk Airport", "ru": "Якутск"}'
          city: '{"en": "Yakutsk", "ru": "Якутск"}'
          coordinates: (129.77099609375,62.0932998657226562)
          timezone: Asia/Yakutsk
        - airport_code: MJZ
          airport_name: '{"en": "Mirny Airport", "ru": "Мирный"}'
          city: '{"en": "Mirnyj", "ru": "Мирный"}'
          coordinates: (114.03900146484375,62.534698486328125)
          timezone: Asia/Yakutsk
        - airport_code: KHV
          airport_name: '{"en": "Khabarovsk-Novy Airport", "ru": "Хабаровск-Новый"}'
          city: '{"en": "Khabarovsk", "ru": "Хабаровск"}'
          coordinates: (135.18800354004,48.5279998779300001)
          timezone: Asia/Vladivostok
        - airport_code: PKC
          airport_name: '{"en": "Yelizovo Airport", "ru": "Елизово"}'
          city: '{"en": "Petropavlovsk", "ru": "Петропавловск-Камчатский"}'
          coordinates: (158.453994750976562,53.1679000854492188)
          timezone: Asia/Kamchatka
        - airport_code: UUS
          airport_name: '{"en": "Yuzhno-Sakhalinsk Airport", "ru": "Хомутово"}'
          city: '{"en": "Yuzhno-Sakhalinsk", "ru": "Южно-Сахалинск"}'
          coordinates: (142.718002319335938,46.8886985778808594)
          timezone: Asia/Sakhalin
        description: The table airports_data records one row per airport, identified
          by airport_code. The airport_name and city columns store JSON-like strings
          with both English ('en') and Russian ('ru') labels. one row per (airport_code)
          — an airport  [no declared key; proposed by an LLM and verified unique in
          the data] The airport_name and city columns contain JSON-like strings. The
          coordinates column contains text strings in '(longitude,latitude)' format.
        kind: table
      - name: boarding_passes
        columns:
        - name: ticket_no
          type: character(13)
          nullable: false
          description: 'Values: integer 5432000987 .. 5435999484.'
        - name: flight_id
          type: INTEGER
          nullable: false
          description: 'Values: integer 1 .. 33120.'
        - name: boarding_no
          type: INTEGER
          nullable: false
          description: 'Values: integer 1 .. 374. The boarding_no column in the boarding_passes
            table contains values ranging from 1 to 374, with an average of 54.9715294142001.'
        - name: seat_no
          type: character varying(4)
          nullable: false
          description: 'Values: text; formats (9 = digit, A = letters): 99A 65% e.g.
            ''10A'', 9A 35% e.g. ''1A''. The boarding_passes table contains seat_no
            values such as ''2D'', ''3G'', ''4H'', ''5D'', ''11A'', ''11E'', ''11H'',
            ''12E'', ''13D'', and ''14H''.'
        samples:
        - ticket_no: '0005435212351'
          flight_id: 30625
          boarding_no: 1
          seat_no: 2D
        - ticket_no: 0005435212386
          flight_id: 30625
          boarding_no: 2
          seat_no: 3G
        - ticket_no: 0005435212381
          flight_id: 30625
          boarding_no: 3
          seat_no: 4H
        - ticket_no: '0005432211370'
          flight_id: 30625
          boarding_no: 4
          seat_no: 5D
        - ticket_no: '0005435212357'
          flight_id: 30625
          boarding_no: 5
          seat_no: 11A
        description: The boarding_passes table records one row per ticket on a specific
          flight, representing a boarding pass assignment. Each ticket can have multiple
          boarding passes if the passenger took multiple flights or had multiple seats
          on the same flight. one row per (ticket_no, flight_id) — A boarding pass
          for a specific ticket on a specific flight  [no declared key; proposed by
          an LLM and verified unique in the data]
        kind: table
      - name: bookings
        columns:
        - name: book_ref
          type: character(6)
          nullable: false
          description: 'Values: text; 22163 values are numbers.'
        - name: book_date
          type: timestamp with time zone
          nullable: false
          description: 'Values: datetime 2017-06-21 14:05:00 .. 2017-08-15 18:00:00;
            stored as text like ''2017-06-21 14:05:00+03''. The book_date column contains
            values in the format ''YYYY-MM-DD HH:MM:SS'' without timezone offsets.'
        - name: total_amount
          type: numeric(10,2)
          nullable: false
          description: 'Values: integer 3400 .. 1204500.'
        samples:
        - book_ref: 00000F
          book_date: '2017-07-05 03:12:00+03'
          total_amount: 265700
        - book_ref: '000012'
          book_date: '2017-07-14 09:02:00+03'
          total_amount: 37900
        - book_ref: 000068
          book_date: '2017-08-15 14:27:00+03'
          total_amount: 18100
        - book_ref: 000181
          book_date: '2017-08-10 13:28:00+03'
          total_amount: 131800
        - book_ref: 0002D8
          book_date: '2017-08-07 21:40:00+03'
          total_amount: 23600
        description: One row per booking reference, representing a single customer
          booking that may contain one or more tickets. The total_amount is the sum
          of all ticket flight amounts for that booking. one row per (book_ref) —
          a single booking  [no declared key; proposed by an LLM and verified unique
          in the data] The bookings table contains book_ref, book_date, and total_amount
          columns, where book_date values are formatted as 'YYYY-MM-DD HH:MM:SS' and
          total_amount values are numeric with decimal places.
        kind: table
      - name: flights
        columns:
        - name: flight_id
          type: INTEGER
          nullable: false
          description: 'Values: integer 1 .. 33121.'
        - name: flight_no
          type: character(6)
          nullable: false
          description: 'Values: text; formats (9 = digit, A = letters): A9999 100%
            e.g. ''PG0001''.'
        - name: scheduled_departure
          type: timestamp with time zone
          nullable: false
          description: 'Values: datetime 2017-07-16 01:50:00 .. 2017-09-14 20:55:00;
            stored as text like ''2017-07-16 01:50:00+03''.'
        - name: scheduled_arrival
          type: timestamp with time zone
          nullable: false
          description: 'Values: datetime 2017-07-16 03:35:00 .. 2017-09-15 04:55:00;
            stored as text like ''2017-07-16 03:35:00+03''.'
        - name: departure_airport
          type: character(3)
          nullable: false
          description: 'Values: text.'
        - name: arrival_airport
          type: character(3)
          nullable: false
          description: 'Values: text.'
        - name: status
          type: character varying(20)
          nullable: false
          description: 'Values: text; values: Arrived (16707), Scheduled (15383),
            On Time (518), Cancelled (414), Departed (58), Delayed (41).'
        - name: aircraft_code
          type: character(3)
          nullable: false
          description: 'Values: text; values: CN1 (9273), CR2 (9048), SU9 (8504),
            321 (1952), 733 (1274), 319 (1239), 763 (1221), 773 (610); 6296 values
            are numbers.'
        - name: actual_departure
          type: timestamp with time zone
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): 9999-99-99
            99:99:99+99 51% e.g. ''2017-07-16 01:54:00+03'', \A 49% e.g. ''\N''.'
        - name: actual_arrival
          type: timestamp with time zone
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): 9999-99-99
            99:99:99+99 50% e.g. ''2017-07-16 05:48:00+03'', \A 50% e.g. ''\N''.'
        samples:
        - flight_id: 1185
          flight_no: PG0134
          scheduled_departure: '2017-09-10 09:50:00+03'
          scheduled_arrival: '2017-09-10 14:55:00+03'
          departure_airport: DME
          arrival_airport: BTK
          status: Scheduled
          aircraft_code: '319'
          actual_departure: \N
          actual_arrival: \N
        - flight_id: 3979
