          scheduled_departure: '2017-08-25 14:50:00+03'
          scheduled_arrival: '2017-08-25 17:35:00+03'
          departure_airport: VKO
          arrival_airport: HMA
          status: Scheduled
          aircraft_code: CR2
          actual_departure: \N
          actual_arrival: \N
        - flight_id: 4739
          flight_no: PG0561
          scheduled_departure: '2017-09-05 12:30:00+03'
          scheduled_arrival: '2017-09-05 14:15:00+03'
          departure_airport: VKO
          arrival_airport: AER
          status: Scheduled
          aircraft_code: '763'
          actual_departure: \N
          actual_arrival: \N
        - flight_id: 5502
