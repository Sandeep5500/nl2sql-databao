        - aircraft_code: '319'
          seat_no: 2A
          fare_conditions: Business
        - aircraft_code: '319'
          seat_no: 2C
          fare_conditions: Business
        - aircraft_code: '319'
          seat_no: 2D
          fare_conditions: Business
        - aircraft_code: '319'
