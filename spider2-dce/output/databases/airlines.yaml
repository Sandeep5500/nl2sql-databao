          for an aircraft type  [no declared key; proposed by an LLM and verified
          unique in the data]
        kind: table
      - name: ticket_flights
        columns:
        - name: ticket_no
          type: character(13)
          nullable: false
          description: 'Values: integer 5432000987 .. 5435999873.'
        - name: flight_id
          type: INTEGER
          nullable: false
          description: 'Values: integer 1 .. 33121.'
        - name: fare_conditions
          type: character varying(10)
          nullable: false
          description: 'Values: text; values: Economy (920793), Business (107642),
            Comfort (17291).'
        - name: amount
