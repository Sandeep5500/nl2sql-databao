          type: NUMERIC
          nullable: true
          description: batting average against (opponent)
        - name: era
          type: NUMERIC
          nullable: true
          description: ERA (Earned Run Average) represents the average number of earned
            runs a pitcher allows per nine innings, calculated from the "er" column.
            It differs from the "r" column, which includes all runs. For example,
            a pitcher with 23 earned runs ("er") and 42 total runs ("r") would have
            an ERA based on the 23 earned runs.
        - name: ibb
          type: NUMERIC
          nullable: true
          description: Intentional bases on balls (IBB) allowed by the pitcher.
        - name: wp
          type: NUMERIC
          nullable: true
          description: The column "wp" represents a numeric value indicating the number
            of wild pitches by a player in a given season, and it can contain null
            values.
        - name: hbp
          type: NUMERIC
          nullable: true
          description: hbp is a numeric column representing the number of batters
            hit by pitches, allowing null values.
        - name: bk
          type: INTEGER
          nullable: true
          description: The column "bk" represents the number of balks committed by
            a pitcher in a season.
        - name: bfp
          type: NUMERIC
          nullable: true
          description: bfp is a numeric column representing the number of batters
            faced by a pitcher, with null values allowed.
        - name: gf
          type: NUMERIC
          nullable: true
          description: gf represents the number of games finished by a pitcher.
        - name: r
          type: INTEGER
          nullable: true
          description: The column "r" represents the total number of runs (both earned
            and unearned) allowed by the pitcher in the game, recorded as an integer
            value. It differs from the "er" column, which only counts earned runs.
            For example, "r" might include 42 runs, while "er" might include 23 earned
            runs for the same player in a season.
        - name: sh
          type: NUMERIC
          nullable: true
          description: The column "sh" represents the number of sacrifice hits allowed
            by the pitcher, and it is a nullable numeric field.
        - name: sf
          type: NUMERIC
          nullable: true
          description: sf is a numeric column representing sacrifice flies in a baseball
            pitching record.
        - name: g_idp
          type: NUMERIC
          nullable: true
          description: Games in which the pitcher recorded at least one putout via
            a groundout with a runner on third base.
