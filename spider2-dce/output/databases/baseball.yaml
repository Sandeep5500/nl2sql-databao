      - name: batting
        columns:
        - name: player_id
          type: TEXT
          nullable: true
          description: player_id is a nullable text column representing the unique
            identifier for a player.
        - name: year
          type: INTEGER
          nullable: true
          description: The `year` column represents the year of the player's batting
            performance and is stored as an integer, allowing null values.
        - name: stint
          type: INTEGER
          nullable: true
          description: The `stint` column represents the number of times a player
            has played for a team in a given year, stored as an integer value.
        - name: team_id
          type: TEXT
          nullable: true
          description: team_id is a nullable text column representing the team identifier
            for a player's batting record.
        - name: league_id
          type: TEXT
          nullable: true
          description: The `league_id` column represents the identifier for the league
            in which the player's team participated during the season. It is a nullable
            text field.
        - name: g
          type: INTEGER
          nullable: true
          description: The `g` column represents the number of games played, with
            integer values and nullable entries.
        - name: ab
          type: NUMERIC
          nullable: true
          description: At-bats, representing the number of times a batter has taken
            their turn to hit, recorded as a numeric value.
        - name: r
          type: NUMERIC
          nullable: true
          description: The column "r" represents the number of runs scored by a player
            in a given season, with numeric values and nullable entries.
        - name: h
          type: NUMERIC
          nullable: true
          description: The "h" column represents the number of hits a player achieved
            in a given season, with numeric values that can be null.
        - name: double
          type: NUMERIC
          nullable: true
          description: The "double" column represents the number of double-base hits
            achieved by a player in a given season, stored as a numeric value and
            allowing null entries. This is distinct from "triple" (number of triple-base
            hits) and "hr" (number of home runs). For example, a player might have
            6 doubles but 0 triples or home runs in a season.
        - name: triple
          type: NUMERIC
          nullable: true
          description: The `triple` column represents the number of triple-base hits
            achieved by a player in a given season, stored as a numeric value and
            allowing null entries. This is distinct from "double" (number of double-base
            hits) and "hr" (number of home runs). For example, a player might have
            5 triples but 0 doubles or home runs in a season.
        - name: hr
          type: NUMERIC
          nullable: true
          description: The `hr` column represents the number of home runs hit by a
            player in a given season. This is distinct from "double" (number of double-base
            hits) and "triple" (number of triple-base hits). For example, a player
            might have 2 home runs but 0 doubles or triples in a season.
        - name: rbi
          type: NUMERIC
          nullable: true
          description: The `rbi` column represents the number of runs batted in by
            a player in a given season.
        - name: sb
          type: NUMERIC
          nullable: true
          description: The `sb` column represents the number of stolen bases achieved
            by a player in a given season. It is a numeric field and can contain null
            values.
        - name: cs
          type: NUMERIC
          nullable: true
          description: Number of times the player was caught stealing.
        - name: bb
          type: NUMERIC
          nullable: true
          description: The `bb` column represents the number of bases on balls (walks)
            a player received, stored as a numeric value and allowing null entries.
        - name: so
          type: NUMERIC
          nullable: true
          description: The `so` column represents the number of strikeouts recorded
            by a player in a given season.
        - name: ibb
          type: NUMERIC
          nullable: true
          description: The `ibb` column represents the number of intentional bases
            on balls for a player in a given season, with null values allowed.
        - name: hbp
          type: NUMERIC
          nullable: true
          description: The `hbp` column represents the number of times a player was
            hit by pitches in a given season. It is stored as a numeric value and
            can contain null entries.
        - name: sh
          type: NUMERIC
          nullable: true
          description: The column "sh" represents a numeric value indicating the number
            of sacrifice hits, and it allows null values.
        - name: sf
          type: NUMERIC
          nullable: true
          description: The `sf` column represents the number of sacrifice flies recorded
            by a player in a given season. It is stored as a numeric value and can
            contain null entries.
        - name: g_idp
          type: NUMERIC
          nullable: true
          description: g_idp is a numeric column that represents the number of games
            in which the player was the designated hitter. It can contain null values.
