        - name: rbi
          type: INTEGER
          nullable: true
          description: Represents the number of runs batted in by a player during
            postseason games.
        - name: sb
          type: INTEGER
          nullable: true
          description: Postseason batting statistics for stolen bases.
        - name: cs
          type: NUMERIC
          nullable: true
          description: Postseason batting statistic representing caught stealing (CS)
            attempts, stored as a numeric value.
        - name: bb
          type: INTEGER
          nullable: true
          description: Number of walks (base on balls) recorded by the player in postseason
            games.
        - name: so
          type: INTEGER
          nullable: true
          description: Postseason batting statistics for strikeouts by player.
        - name: ibb
          type: NUMERIC
          nullable: true
          description: Postseason batting data for intentional bases on balls (IBB),
            represented as a numeric value.
        - name: hbp
          type: NUMERIC
          nullable: true
          description: Postseason batting statistics for hit by pitch (HBP), represented
            as a numeric value.
        - name: sh
          type: NUMERIC
          nullable: true
          description: Sacrifice hits by the player in postseason games, represented
            as a numeric value. This column differs from `sf` (sacrifice flies) in
            that it specifically counts hits where the batter sacrifices their at-bat
            to advance a runner. A query would use this column to analyze a player's
            defensive contributions via sacrifice hits rather than their batting outcomes.
        - name: sf
          type: NUMERIC
          nullable: true
          description: Sacrifice flies by the player in postseason games, represented
            as a numeric value. This column differs from `sh` (sacrifice hits) in
            that it specifically counts fly balls where the batter is out, but a fielder
            drops the ball, allowing a runner to tag up and advance. A query would
            use this column to analyze a player's defensive contributions via sacrifice
            flies rather than their batting outcomes.
        - name: g_idp
          type: NUMERIC
          nullable: true
          description: Postseason games in which the player played and had at least
            one putout at first base.
