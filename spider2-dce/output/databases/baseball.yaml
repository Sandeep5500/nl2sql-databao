        description: A table containing information about All-Star game appearances,
          including player identifiers, game details, team and league affiliations,
          and game statistics.
        kind: table
      - name: appearances
        columns:
        - name: year
          type: INTEGER
          nullable: true
          description: Year of the player's appearance, stored as an integer value.
        - name: team_id
          type: TEXT
          nullable: true
          description: team_id is a nullable text field representing the identifier
            for the team a player appeared for in a given year.
        - name: league_id
          type: TEXT
          nullable: true
          description: League identifier for the team, often left blank or unspecified.
        - name: player_id
          type: TEXT
          nullable: true
          description: Player identifier.
        - name: g_all
          type: NUMERIC
          nullable: true
          description: Total games played in all positions by the player in a given
            year. This includes all games in batting, defense, and positional roles.
            Unlike `g_batting` and `g_defense`, which track subsets of games, `g_all`
            represents the full count of games played. For example, a player might
            have 31 games in total (`g_all`), with 31 games in batting (`g_batting`)
            and 31 in defense (`g_defense`).
        - name: gs
          type: NUMERIC
          nullable: true
          description: Games started by the player, represented as a numeric value.
        - name: g_batting
          type: INTEGER
          nullable: true
          description: Number of games the player batted for the team in a given year.
            This column is distinct from `g_defense`, which counts games played in
            a defensive role, and from `g_all`, which includes both batting and defensive
            games. For example, a player might have 31 games in batting (`g_batting`)
            and 31 in defense (`g_defense`), totaling 31 games in `g_all`.
        - name: g_defense
          type: NUMERIC
          nullable: true
          description: Number of games played in a defensive position by the player
            in a given year. This column is distinct from `g_batting`, which counts
            games
        - name: g_p
          type: INTEGER
          nullable: true
          description: Number of games pitched by the player in a season.
        - name: g_c
          type: INTEGER
          nullable: true
          description: Number of games played as catcher (g_c) by the player, represented
            as an integer.
        - name: g_1b
          type: INTEGER
          nullable: true
          description: Number of games played at first base by a player in a given
            year.
        - name: g_2b
          type: INTEGER
          nullable: true
          description: Number of games played at second base by the player.
        - name: g_3b
          type: INTEGER
          nullable: true
          description: Number of games played at third base by a player in a given
            year.
        - name: g_ss
          type: INTEGER
          nullable: true
          description: Number of games played as shortstop by the player.
        - name: g_lf
          type: INTEGER
          nullable: true
          description: Number of games played in left field by the player.
        - name: g_cf
          type: INTEGER
          nullable: true
          description: Number of games played in center field (CF) by the player,
            recorded as an integer.
        - name: g_rf
          type: INTEGER
          nullable: true
          description: Number of games played as right fielder by the player.
        - name: g_of
          type: INTEGER
          nullable: true
          description: Total number of games played in the outfield positions (g_lf,
            g_cf, g_rf combined).
        - name: g_dh
          type: NUMERIC
          nullable: true
          description: Number of games played as a designated hitter, represented
            as a numeric value.
        - name: g_ph
          type: NUMERIC
          nullable: true
          description: Number of games played as a pinch hitter by the player.
        - name: g_pr
          type: NUMERIC
          nullable: true
          description: Number of games played as a pinch runner.
