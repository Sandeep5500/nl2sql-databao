          franchise ID, name, active status, and association.
        kind: table
      - name: team_half
        columns:
        - name: year
          type: INTEGER
          nullable: true
          description: The "year" column represents the year associated with the team's
            performance data, stored as an integer and allowing null values.
        - name: league_id
          type: TEXT
          nullable: true
          description: League identifier, indicating the league (e.g., NL for National
            League, AL for American League).
        - name: team_id
          type: TEXT
          nullable: true
          description: Team identifier representing the specific team in the dataset.
        - name: half
          type: INTEGER
          nullable: true
          description: Represents the half of the season (e.g., 1 for first half,
            2 for second half).
        - name: div_id
          type: TEXT
          nullable: true
          description: div_id is a nullable TEXT column representing the division
            identifier in the team_half table.
        - name: div_win
          type: TEXT
          nullable: true
          description: The `div_win` column indicates whether a team won its division,
            with values typically being 'Y' for yes or 'N' for no.
        - name: rank
          type: INTEGER
          nullable: true
          description: The `rank` column represents the team's ranking within its
            division for a given season half, with lower values indicating better
            performance.
        - name: g
          type: INTEGER
          nullable: true
          description: The column "g" represents the number of games played by a team
            in a given season half.
        - name: w
          type: INTEGER
          nullable: true
          description: The column "w" represents the number of wins by the team in
            a given season half, with integer values and nullable entries. It is paired
            with the "l" column, which tracks the number of losses. For example, a
            team might have 25 wins ("w") and 29 losses ("l") in a given half.
        - name: l
          type: INTEGER
          nullable: true
          description: The column "l" represents the number of losses by the team
            in a given season half, with integer values and nullable entries. It is
            paired with the "w" column, which tracks the number of wins. For example,
            a team might have 25 wins ("w") and 29 losses ("l") in a given half.
