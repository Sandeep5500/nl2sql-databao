        - name: er
          type: INTEGER
          nullable: true
          description: The "er" column represents the number of earned runs allowed
            by the pitcher in the game, distinguishing it from the "r" column, which
            includes both earned and unearned runs. For example, a player might allow
            42 total runs ("r") but only 23 of those might be earned ("er").
        - name: hr
          type: INTEGER
          nullable: true
