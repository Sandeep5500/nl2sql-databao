      - name: team_franchise
        columns:
        - name: franchise_id
          type: TEXT
          nullable: true
          description: Franchise ID, a unique text identifier for a franchise, often
            used as a foreign key in related tables. It differs from `franchise_name`
            in that it provides a short, consistent code (e.g., "ALT") rather than
            the full official title (e.g., "Atlanta Braves").
        - name: franchise_name
          type: TEXT
          nullable: true
          description: Franchise name, representing the official title of a sports
            team or organization. It differs from `franchise_id` in that it provides
            the full name (e.g., "Atlanta Braves") rather than a short code (e.g.,
            "ALT").
        - name: active
          type: TEXT
          nullable: true
          description: Indicates whether the franchise is currently active, with 'Y'
            for active and 'N' for inactive.
        - name: na_assoc
          type: TEXT
          nullable: true
          description: The `na_assoc` column indicates the National Association (NA)
            association status of the franchise, with values such as 'BNA' (e.g.,
            for "BNA") or 'PNA' (e.g., for "PNA"). It is distinct from the `active`
            column, which indicates whether the franchise is currently active with
            'Y' or 'N'.
        samples:
        - franchise_id: ALT
          franchise_name: Altoona Mountain City
          active: N
          na_assoc: ''
        - franchise_id: ANA
          franchise_name: Los Angeles Angels of Anaheim
          active: Y
          na_assoc: ''
        - franchise_id: ARI
          franchise_name: Arizona Diamondbacks
          active: Y
          na_assoc: ''
        - franchise_id: ATH
          franchise_name: Philadelphia Athletics
          active: N
          na_assoc: PNA
        - franchise_id: ATL
          franchise_name: Atlanta Braves
          active: Y
          na_assoc: BNA
