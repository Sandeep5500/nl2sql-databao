      - name: cal_month_sales_mv
        columns:
        - name: calendar_month_desc
          type: TEXT
          nullable: true
          description: 'Calendar month description, stored as text and allowing null values. This column represents the year
            and month in the format "YYYY-MM" and is used to identify the time period for sales data. For example, "2019-01"
            represents January 2019, and it is used in queries to filter or group data by calendar month. It does not store
            day-level detail and differs from other potential date columns that might include specific dates or ranges. Known
            sample values: ''2019-01'', ''2019-02'', ''2019-03'', ''2019-04'', ''2019-05''.'
        - name: dollars
          type: ''
          nullable: true
          description: Represents a monetary value associated with calendar months, stored as a nullable field with unspecified
            data type. This column holds the total sales amount for each calendar month, such as 2277420.49 for January 2019.
            It is used in queries to analyze or aggregate sales revenue over time and differs from other potential numeric
            columns that might represent quantities or other metrics.
        samples:
        - calendar_month_desc: 2019-01
          dollars: 2277420.49
        - calendar_month_desc: 2019-02
          dollars: 2372690.87
        - calendar_month_desc: 2019-03
          dollars: 1830572.6400000001
        - calendar_month_desc: 2019-04
          dollars: 1975978.3
        - calendar_month_desc: 2019-05
          dollars: 1748287.23
        description: Calendar month sales data viewed by month and total sales in dollars.
        kind: view
