          type: INTEGER
          nullable: false
          description: The `country_subregion_id` column is a non-nullable integer representing the unique identifier for
            the country's subregion, corresponding to the textual label in the `country_subregion` column. For instance, the
            ID 52793 corresponds to "Asia" in `country_subregion`, while 52799 corresponds to "Western Europe."
        - name: country_region
          type: TEXT
          nullable: false
          description: 'The `country_region` column stores the broader geographic region of a country as text, such as "Asia"
            or "Europe." This column provides a textual label for the region, which corresponds to the numeric identifier
