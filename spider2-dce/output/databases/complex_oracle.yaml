            "Indirect", or "Others". This column provides a human-readable label for the channel''s category, in contrast
            to `channel_class_id`, which provides a numeric identifier for the same classification. Known sample values: ''Others'',
            ''Direct'', ''Indirect''.'
        - name: channel_class_id
          type: INTEGER
          nullable: false
          description: An integer identifier for the channel class, used to categorize different types of sales channels.
            This column provides a numeric key for the channel classification, in contrast to `channel_class`, which provides
