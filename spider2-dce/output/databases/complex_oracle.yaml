            which represents the exchange rate value to the US dollar. Known sample values: ''Singapore''.'
        - name: year
          type: INTEGER
          nullable: true
          description: The year column stores integer values representing years, with the possibility of null entries.
        - name: month
          type: INTEGER
          nullable: true
          description: The `month` column represents the month of the year as an integer, indicating the specific month for
            each currency exchange rate record.
        - name: to_us
          type: REAL
          nullable: true
          description: The to_us column stores the exchange rate value to the US dollar, such as 1.0, and is used to represent
            the conversion rate from the local currency to USD. This differs from the `country` column, which identifies the
            origin country of the currency, such as "Singapore".
        samples:
        - country: Singapore
          year: 2019
          month: 5
          to_us: 1.0
        - country: Singapore
          year: 2019
          month: 6
          to_us: 1.0
        - country: Singapore
          year: 2019
          month: 7
          to_us: 1.0
        - country: Singapore
          year: 2019
          month: 1
          to_us: 1.0
        - country: Singapore
          year: 2019
          month: 2
          to_us: 1.0
        description: The currency table contains historical exchange rate data between countries and the US, with fields for
          country, year, month, and exchange rate (to_us). Sample data shows consistent exchange rates for Singapore in 2019.
        kind: table
