            numeric identifiers, and from `channel_desc`, which contains channel-specific descriptions like "Internet" or
            "Catalog". Known sample values: ''Channel total''.'
        - name: channel_total_id
          type: INTEGER
          nullable: false
          description: A non-nullable integer column representing the identifier for the channel total. This column is distinct
            from `channel_id`, which uniquely
