          description: 'channel_id is an integer column that uniquely identifies each
            channel entry and serves as the primary key for the channels table. [Profile]
            never null; 5 distinct (unique per row); all values: 2 (1), 3 (1), 4 (1),
            5 (1), 9 (1).'
        - name: channel_desc
          type: TEXT
          nullable: false
          description: 'A non-nullable text column representing the description of
            a channel. [Profile] never null; 5 distinct (unique per row); all values:
            Catalog (1), Direct Sales (1), Internet (1), Partners (1), Tele Sales
            (1).'
        - name: channel_class
          type: TEXT
          nullable: false
          description: 'A non-nullable text field representing the classification
            category of the channel, such as "Direct", "Indirect", or "Others". This
            column provides a human-readable label for the channel''s category, in
            contrast to `channel_class_id`, which provides a numeric identifier for
            the same classification. [Profile] never null; 3 distinct; all values:
            Direct (2), Indirect (2), Others (1).'
        - name: channel_class_id
          type: INTEGER
          nullable: false
          description: 'An integer identifier for the channel class, used to categorize
            different types of sales channels. This column provides a numeric key
            for the channel classification, in contrast to `channel_class`, which
            provides a textual label. For example, "Direct" in `channel_class` may
            correspond to a specific value in this column. [Profile] never null; 3
            distinct; all values: 12 (2), 13 (2), 14 (1).'
        - name: channel_total
          type: TEXT
          nullable: false
          description: 'A non-nullable TEXT column named `channel_total` that stores
            a description indicating the channel total, such as "Channel total". This
            column is distinct from `channel_id` and `channel_class_id`, which store
            numeric identifiers, and from `channel_desc`, which contains channel-specific
