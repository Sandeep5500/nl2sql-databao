datasource_id: databases/complex_oracle.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: cal_month_sales_mv
        columns:
        - name: calendar_month_desc
          type: TEXT
          nullable: true
          description: Calendar month description, stored as text and allowing null
            values. This column represents the year and month in the format "YYYY-MM"
            and is used to identify the time period for sales data. For example, "2019-01"
            represents January 2019, and it is used in queries to filter or group
            data by calendar month. It does not store day-level detail and differs
            from other potential date columns that might include specific dates or
            ranges. [Profile] never null; 48 distinct (unique per row); dates stored
            as TEXT in format YYYY-MM, range 2019-01 to 2022-12.
        - name: dollars
          type: ''
          nullable: true
          description: Represents a monetary value associated with calendar months,
            stored as a nullable field with unspecified data type. This column holds
            the total sales amount for each calendar month, such as 2277420.49 for
            January 2019. It is used in queries to analyze or aggregate sales revenue
            over time and differs from other potential numeric columns that might
            represent quantities or other metrics. [Profile] never null; 48 distinct
            (unique per row); range 1.57327e+06 to 2.54704e+06.
        samples:
        - calendar_month_desc: 2019-10
          dollars: 2236464.53
        - calendar_month_desc: 2020-01
          dollars: 2077439.76
        - calendar_month_desc: 2019-04
          dollars: 1975978.3
        - calendar_month_desc: 2020-04
          dollars: 1573272.66
        - calendar_month_desc: 2022-03
          dollars: 2330263.77
        description: 'Calendar month sales data viewed by month and total sales in
          dollars. [Structure] 48 rows. Grain: one row per (calendar_month_desc).
          Similar tables (check which fits the question): fweek_pscat_sales_mv (grain
          channel_id, promo_id, week_ending_day, prod_subcategory, 3652 rows). This
          is a VIEW derived from other tables.'
        kind: view
      - name: channels
