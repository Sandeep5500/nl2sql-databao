        - name: country_subregion
          type: TEXT
          nullable: false
          description: 'The `country_subregion` column contains the name of the subregion for each country, such as "Asia"
            or "Western Europe." This column provides a textual label for the subregion, which corresponds to the numeric
            identifier in the `country_subregion_id` column. For example, "Asia" in `country_subregion` corresponds to the
            ID 52793 in `country_subregion_id`, whereas "Western Europe" corresponds to 52799. Known sample values: ''Asia'',
            ''Western Europe'', ''Northern America'', ''Southern America''.'
