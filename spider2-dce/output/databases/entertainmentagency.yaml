          type: nvarchar (25)
          nullable: true
          description: 'Values: text.'
        - name: CustLastName
          type: nvarchar (25)
          nullable: true
          description: 'Values: text.'
        - name: CustStreetAddress
          type: nvarchar (50)
          nullable: true
          description: 'Values: text.'
