          type: decimal(15, 2)
          nullable: true
          description: 'Values: integer 110 .. 14105.'
          default_expression: '0'
        - name: CustomerID
          type: INT
          nullable: true
          description: 'Values: integer 10001 .. 10015.'
          default_expression: '0'
        - name: AgentID
