            first name of an agent as a variable-length Unicode string with a maximum
            length of 25 characters. It allows null values. [Profile] never null;
            9 distinct (unique per row); all values: Caleb (1), Carol (1), Daffy (1),
            John (1), Karen (1), Maria (1), Marianne (1), Scott (1), William (1).'
        - name: AgtLastName
