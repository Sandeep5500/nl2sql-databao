        description: 'Each row records one engagement (booking) of an entertainer
          for a customer, including dates, times, and contract price. The table links
          customers, agents, and entertainers to specific performance events. primary
          key (declared): (EngagementNumber)'
        kind: table
        primary_key:
          name: pk_Engagements
          columns:
          - EngagementNumber
          validated: true
        indexes:
        - name: AgentsEngagements
          columns:
          - AgentID
          unique: false
        - name: CustomersEngagements
          columns:
          - CustomerID
          unique: false
        - name: Engagements_EmployeeID
          columns:
          - AgentID
          unique: false
        - name: EntertainersEngagements
          columns:
          - EntertainerID
          unique: false
        foreign_keys:
        - name: fk_Engagements_0
          mapping:
          - from_column: EntertainerID
            to_column: EntertainerID
          referenced_table: main.Entertainers
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
        - name: fk_Engagements_1
          mapping:
          - from_column: CustomerID
            to_column: CustomerID
          referenced_table: main.Customers
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
        - name: fk_Engagements_2
          mapping:
          - from_column: AgentID
            to_column: AgentID
          referenced_table: main.Agents
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
