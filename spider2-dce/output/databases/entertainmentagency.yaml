          default_expression: '0'
        - name: CommissionRate
          type: float(24)
          nullable: true
          description: 'Values: decimal 0.01 .. 0.06; values: 0.04 (3), 0.01 (1),
            0.035 (1), 0.045 (1), 0.05 (1), 0.055 (1), 0.06 (1).'
