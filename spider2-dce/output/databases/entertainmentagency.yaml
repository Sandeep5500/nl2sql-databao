          nullable: false
          description: 'Values: integer 2 .. 131.'
          default_expression: '0'
        - name: StartDate
          type: date
          nullable: true
          description: 'Values: date 2017-09-02 .. 2018-03-04.'
        - name: EndDate
          type: date
          nullable: true
          description: 'Values: date 2017-09-06 .. 2018-03-13. The query returned
            5 rows where EndDate equals StartDate.'
        - name: StartTime
          type: time
          nullable: true
          description: 'Values: text; values: 20:00:00 (17), 17:00:00 (16), 14:00:00
            (15), 12:00:00 (13), 13:00:00 (13), 16:00:00 (12), 15:00:00 (10), 18:00:00
            (9), 19:00:00 (6).'
        - name: StopTime
          type: time
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): 99:99:99 100%
