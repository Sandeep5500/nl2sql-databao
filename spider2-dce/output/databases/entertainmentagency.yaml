      - name: Engagements
        columns:
        - name: EngagementNumber
          type: INT
          nullable: false
          description: EngagementNumber is a non-nullable integer column with a default
            value of 0, serving as the primary key for the Engagements table. Unlike
            other ID columns like CustomerID, AgentID, or EntertainerID, it uniquely
            identifies each engagement record and is not used to reference external
            entities. [Profile] never null; 111 distinct (unique per row); range 2
            to 131.
          default_expression: '0'
        - name: StartDate
          type: date
          nullable: true
          description: StartDate is a nullable date column representing the starting
            date of an engagement. It is used in conjunction with EndDate to define
            the date range of the engagement. When querying for engagements on a specific
            date, this column is used to filter by the start date. [Profile] never
            null; 64 distinct; dates stored as TEXT in format YYYY-MM-DD, range 2017-09-02
            to 2018-03-04.
        - name: EndDate
          type: date
          nullable: true
          description: EndDate is a nullable date column representing the end date
            of an engagement. It is used in conjunction with StartDate to define the
            date range of the engagement. When querying for engagements on or before
            a specific date, this column is used to filter by the end date. [Profile]
            never null; 77 distinct; dates stored as TEXT in format YYYY-MM-DD, range
            2017-09-06 to 2018-03-13.
        - name: StartTime
          type: time
          nullable: true
          description: 'StartTime is a nullable time column representing the starting
            time of an engagement. It is used in conjunction with StopTime to define
            the time window of the engagement. When querying for engagements starting
            at a specific time, this column is used. [Profile] never null; 9 distinct;
            dates stored as TEXT in format time H:MM[:SS], range 12:00:00 to 20:00:00;
            all values: 20:00:00 (17), 17:00:00 (16), 14:00:00 (15), 12:00:00 (13),
            13:00:00 (13), 16:00:00 (12), 15:00:00 (10), 18:00:00 (9), 19:00:00 (6).'
        - name: StopTime
