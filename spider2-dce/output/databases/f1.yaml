          race_id: 18
          constructor_id: 1
          points: 14.0
        - constructor_results_id: 2
          race_id: 18
          constructor_id: 2
          points: 8.0
        - constructor_results_id: 3
          race_id: 18
          constructor_id: 3
          points: 9.0
        - constructor_results_id: 4
          race_id: 18
          constructor_id: 4
          points: 5.0
        - constructor_results_id: 5
          race_id: 18
          constructor_id: 5
          points: 2.0
        description: A table that stores the results of constructors in races, including their points and status. Each result
          is uniquely identified by a constructor_results_id and linked to a specific race and constructor.
        kind: table
        primary_key:
          name: pk_constructor_results
          columns:
          - constructor_results_id
          validated: true
      - name: constructor_standings
        columns:
        - name: constructor_standings_id
          type: INT(11)
          nullable: false
          description: Unique identifier for each constructor standing entry.
        - name: race_id
          type: INT(11)
          nullable: false
          description: race_id is a non-nullable integer column with a default value of 0, representing the identifier for
            a race in the constructor_standings table.
          default_expression: '''0'''
        - name: constructor_id
          type: INT(11)
          nullable: false
          description: The `constructor_id` column stores the unique identifier for a constructor, represented as a non-nullable
            integer with a default value of 0.
          default_expression: '''0'''
        - name: points
          type: FLOAT
          nullable: false
          description: The `points` column stores the constructor's points as a non-nullable floating-point number, defaulting
