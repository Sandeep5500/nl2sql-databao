datasource_id: databases/f1.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: circuits
        columns:
        - name: circuit_id
          type: INT(11)
          nullable: false
          description: Unique identifier for each circuit.
        - name: circuit_ref
          type: VARCHAR(255)
          nullable: false
          description: A non-nullable column storing a reference identifier for the circuit, with an empty string as the default
            value.
          default_expression: ''''''
        - name: name
          type: VARCHAR(255)
          nullable: false
          description: The `name` column stores the full official name of the circuit as a non-nullable string. It differs
            from the `circuit_ref` column, which stores a shorter, non-official reference identifier such as "catalunya",
            whereas this column contains the full name like "Circuit de Barcelona-Catalunya".
          default_expression: ''''''
        - name: location
          type: VARCHAR(255)
          nullable: true
          description: The `location` column stores the city or region where the circuit is located, as a variable-length
            string. It can contain null values and defaults to null if not specified. Unlike the `country` column, which stores
            the name of the country (e.g., "Spain"), this column typically contains more specific geographic information such
            as "Montmeló".
          default_expression: 'NULL'
        - name: country
          type: VARCHAR(255)
          nullable: true
          description: The `country` column stores the name of the country where the circuit is located, with a maximum length
            of 255 characters. It allows null values and defaults to `NULL` if not specified. Unlike the `location` column,
            which may contain specific cities or regions like "Montmeló", this column contains broader geopolitical information
            such as "Spain".
          default_expression: 'NULL'
        - name: lat
          type: FLOAT
          nullable: true
          description: The `lat` column stores the latitude of the circuit location as a floating-point number and allows
            null values.
          default_expression: 'NULL'
        - name: lng
          type: FLOAT
          nullable: true
          description: The `lng` column stores the longitude coordinate of the circuit location as a floating-point number
            and allows null values.
          default_expression: 'NULL'
        - name: alt
          type: INT(11)
          nullable: true
          description: The `alt` column stores the elevation of the circuit in meters as an integer, and can contain null
            values.
          default_expression: 'NULL'
        - name: url
          type: VARCHAR(255)
          nullable: false
          description: The `url` column stores a non-nullable URL string, with an empty string as the default value.
          default_expression: ''''''
        samples:
        - circuit_id: 1
          circuit_ref: albert_park
          name: Albert Park Grand Prix Circuit
          location: Melbourne
          country: Australia
          lat: -37.8497
          lng: 144.968
          alt: 10
          url: http://en.wikipedia.org/wiki/Melbourne_Grand_Prix_Circuit
        - circuit_id: 2
          circuit_ref: sepang
          name: Sepang International Circuit
          location: Kuala Lumpur
          country: Malaysia
          lat: 2.76083
          lng: 101.738
          alt: 18
          url: http://en.wikipedia.org/wiki/Sepang_International_Circuit
        - circuit_id: 3
          circuit_ref: bahrain
          name: Bahrain International Circuit
          location: Sakhir
          country: Bahrain
          lat: 26.0325
          lng: 50.5106
          alt: 7
          url: http://en.wikipedia.org/wiki/Bahrain_International_Circuit
        - circuit_id: 4
          circuit_ref: catalunya
          name: Circuit de Barcelona-Catalunya
          location: Montmeló
          country: Spain
          lat: 41.57
          lng: 2.26111
          alt: 109
          url: http://en.wikipedia.org/wiki/Circuit_de_Barcelona-Catalunya
        - circuit_id: 5
          circuit_ref: istanbul
          name: Istanbul Park
          location: Istanbul
          country: Turkey
          lat: 40.9517
          lng: 29.405
          alt: 130
          url: http://en.wikipedia.org/wiki/Istanbul_Park
        description: The circuits table contains information about various racing circuits, including their names, locations,
          geographic coordinates, and official URLs. Each circuit is uniquely identified by a circuit_id.
        kind: table
        primary_key:
          name: pk_circuits
          columns:
          - circuit_id
          validated: true
      - name: circuits_ext
        columns:
        - name: circuit_id
          type: INT
          nullable: true
          description: Unique identifier for a racing circuit.
        - name: circuit_ref
          type: TEXT
          nullable: true
          description: 'The `circuit_ref` column contains a shortened or alternative identifier for the circuit, such as "albert_park"
            or "sepang." It is distinct from the `name` column, which contains the full name like "Albert Park Grand Prix
            Circuit." Use `circuit_ref` for compact references or joins where brevity is preferred over full names. Known
            sample values: ''albert_park'', ''sepang'', ''bahrain'', ''catalunya'', ''istanbul''.'
        - name: name
          type: TEXT
          nullable: true
          description: The `name` column contains the full textual name of the circuit, such as "Albert Park Grand Prix Circuit"
            or "Sepang International Circuit." It is distinct from `circuit_ref`, which holds a shortened or alternative identifier
            like "albert_park." Use `name` when the full official name is required for display or reference.
        - name: location
          type: TEXT
          nullable: true
          description: 'The `location` column contains the city or specific location of the racing circuit, such as "Melbourne"
            or "Kuala Lumpur." It is distinct from the `country` column, which contains the full country name like "Australia"
            or "Malaysia." Use `location` when the city or regional detail is needed, and `country` when the national context
            is required. Known sample values: ''Melbourne'', ''Kuala Lumpur'', ''Sakhir'', ''Montmeló'', ''Istanbul''.'
        - name: country
          type: TEXT
          nullable: true
          description: 'The `country` column stores the name of the country where each circuit is located. It is a nullable
            text field. Known sample values: ''Australia'', ''Malaysia'', ''Bahrain'', ''Spain'', ''Turkey''.'
        - name: lat
          type: REAL
          nullable: true
          description: Latitude coordinate of the circuit location.
        - name: lng
          type: REAL
          nullable: true
          description: Longitude coordinate of the racing circuit location.
        - name: alt
          type: INT
          nullable: true
          description: The `alt` column stores the elevation of the circuit in meters as an integer value.
        - name: url
          type: TEXT
          nullable: true
          description: The `url` column contains a link to the Wikipedia page for each circuit, providing additional information
            about the location.
        - name: last_race_year
          type: ''
          nullable: true
          description: The `last_race_year` column indicates the most recent year a race was held at the circuit.
        - name: number_of_races
          type: ''
          nullable: true
          description: The `number_of_races` column represents the total count of races held at a circuit.
        samples:
        - circuit_id: 1
          circuit_ref: albert_park
          name: Albert Park Grand Prix Circuit
          location: Melbourne
          country: Australia
          lat: -37.8497
          lng: 144.968
          alt: 10
