          race_id: 18
          constructor_id: 1
          points: 14.0
          position: 1
          position_text: '1'
          wins: 1
        - constructor_standings_id: 2
          race_id: 18
          constructor_id: 2
          points: 8.0
          position: 3
          position_text: '3'
          wins: 0
        - constructor_standings_id: 3
          race_id: 18
          constructor_id: 3
          points: 9.0
          position: 2
          position_text: '2'
          wins: 0
        - constructor_standings_id: 4
          race_id: 18
          constructor_id: 4
          points: 5.0
          position: 4
          position_text: '4'
          wins: 0
        - constructor_standings_id: 5
