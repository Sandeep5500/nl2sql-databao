          lat: 26.0325
          lng: 50.5106
          alt: 7
          url: http://en.wikipedia.org/wiki/Bahrain_International_Circuit
          last_race_year: 2024
          number_of_races: 21
        - circuit_id: 4
          circuit_ref: catalunya
          name: Circuit de Barcelona-Catalunya
          location: Montmeló
          country: Spain
          lat: 41.57
          lng: 2.26111
          alt: 109
          url: http://en.wikipedia.org/wiki/Circuit_de_Barcelona-Catalunya
          last_race_year: 2024
          number_of_races: 34
        - circuit_id: 5
          circuit_ref: istanbul
          name: Istanbul Park
          location: Istanbul
          country: Turkey
          lat: 40.9517
          lng: 29.405
          alt: 130
          url: http://en.wikipedia.org/wiki/Istanbul_Park
          last_race_year: 2021
          number_of_races: 9
        description: A table containing information about various racing circuits, including their names, locations, geographical
          coordinates, altitude, and details about the number of races held and the most recent race year.
        kind: table
      - name: constructor_results
        columns:
        - name: constructor_results_id
          type: INT(11)
          nullable: false
          description: The `constructor_results_id` is an integer column that uniquely identifies each constructor result
            entry and cannot be null.
        - name: race_id
          type: INT(11)
          nullable: false
          description: The `race_id` is an integer column that stores the identifier for a specific race associated with a
            constructor result, with a default value of 0 and does not allow null values. It is used to link this constructor
            result to a specific race, and should be used in conjunction with `constructor_id` to uniquely identify a constructor's
            performance in a race.
          default_expression: '''0'''
        - name: constructor_id
          type: INT(11)
          nullable: false
          description: The `constructor_id` is an integer column that stores the identifier for a specific constructor associated
            with a race result, with a default value of 0 and does not allow null values. It is used to link this constructor
            result to a specific constructor, and should be used in conjunction with `race_id` to uniquely identify a constructor's
            performance in a race.
          default_expression: '''0'''
        - name: points
          type: FLOAT
          nullable: true
          description: The `points` column is a nullable FLOAT column that stores the number of points a constructor earned
            in a race, with a default value of NULL. Unlike `constructor_id` and `race_id`, which are identifiers, this column
            represents a quantitative result of the race. For example, a constructor might earn 14.0 points in one race (as
            shown in sample values), while another might
          default_expression: 'NULL'
        - name: status
          type: VARCHAR(255)
          nullable: true
          description: The `status` column stores textual information about the constructor's race outcome, allowing up to
            255 characters. It can contain null values and defaults to null if not specified.
          default_expression: 'NULL'
