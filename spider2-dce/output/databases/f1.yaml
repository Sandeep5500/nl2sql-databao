          default_expression: '''0'''
        - name: position
          type: INT(11)
          nullable: true
          description: The `position` column stores the constructor's numerical ranking as an integer, which can be null.
            It is used when a precise numeric ranking is needed, as opposed to `position_text`, which stores the same information
            in a textual format. For example, a numeric position of `1` might correspond to the textual position of `"1st"`.
          default_expression: 'NULL'
        - name: position_text
          type: VARCHAR(255)
          nullable: true
          description: The `position_text` column stores the constructor's textual representation of their position in the
            standings, such as `"1st"` or `"2nd"`, and can be null. It is used when the ordinal representation is required,
            as opposed to `position`, which stores the same information in a numeric format. For example, a textual position
            of `"1st"` might correspond to the numeric position of `1`.
          default_expression: 'NULL'
        - name: wins
          type: INT(11)
          nullable: false
          description: The `wins` column stores the number of race wins for a constructor, represented as a non-nullable integer
            with a default value of 0.
          default_expression: '''0'''
