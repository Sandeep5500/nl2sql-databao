          pre_invoice_discount_pct: 0.0531
        description: A table containing pre-invoice discount percentages for hardware customers by fiscal year.
        kind: table
      - name: hardware_fact_sales_monthly
        columns:
        - name: date
          type: TEXT
          nullable: true
          description: 'The `date` column stores the specific date of the monthly sales record as text, with values like ''2019-09-01''.
            It is nullable and is typically used for time-based filtering or grouping, in contrast to the `fiscal_year` column,
            which stores only the year portion (e.g., 2020). Known sample values: ''2019-09-01''.'
        - name: product_code
          type: TEXT
          nullable: true
          description: product_code is a nullable text field representing the code identifier for a product.
        - name: customer_code
          type: INTEGER
          nullable: true
          description: customer_code is an integer column representing unique identifiers for customers, with null values
            allowed.
        - name: sold_quantity
          type: INTEGER
          nullable: true
          description: Represents the quantity of hardware products sold, stored as an integer with possible null values.
        - name: fiscal_year
          type: INTEGER
          nullable: true
          description: The `fiscal_year` column stores the year portion of the sales period as an integer, with values like
            2020. It is useful for high-level yearly aggregation and is distinct from the `date` column, which provides more
            granular monthly date information (e.g., '2019-09-01').
        samples:
        - date: '2019-09-01'
          product_code: A0118150101
          customer_code: 70002017
          sold_quantity: 137
