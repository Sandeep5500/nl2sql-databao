          type: INTEGER
          nullable: true
          description: FacNo is an integer column representing the unique identification number for a university faculty member.
            It is referenced by the FacSupervisor column to indicate the supervisor of a faculty member.
        - name: FacFirstName
          type: TEXT
          nullable: true
          description: Faculty first name.
        - name: FacLastName
          type: TEXT
          nullable: true
          description: FacLastName is a nullable TEXT column representing the last name of a university faculty member.
        - name: FacCity
          type: TEXT
          nullable: true
          description: FacCity is a nullable TEXT column representing the city where a faculty member is located.
        - name: FacState
          type: TEXT
          nullable: true
          description: FacState is a nullable TEXT column representing the state where a faculty member is located.
        - name: FacDept
          type: TEXT
          nullable: true
          description: Faculty department affiliation.
        - name: FacRank
          type: TEXT
          nullable: true
          description: Faculty rank designation, such as ASST, ASSC, or PROF.
        - name: FacSalary
          type: INTEGER
          nullable: true
          description: FacSalary is an integer column representing the salary of a faculty member, which can contain null
            values.
