datasource_id: databases/education_business.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: SalaryDataset
        columns:
        - name: index
          type: INTEGER
          nullable: true
          description: The index column contains integer values used as a unique identifier for each row in the table. It
            is typically used for sorting or referencing records and has sample values such as [0, 1, 2, 3, 4].
        - name: CompanyName
          type: TEXT
          nullable: true
          description: A column containing the name of the company where the job is posted.
        - name: JobTitle
          type: TEXT
          nullable: true
          description: JobTitle is a nullable TEXT column representing the title of the job position.
        - name: SalariesReported
          type: REAL
          nullable: true
          description: The SalariesReported column contains real number values indicating the count or average of salaries
            reported for a given position, with decimal precision and nullable entries. It differs from the Salary column,
            which stores textual salary values like '₹X,XX,XXX/yr'.
        - name: Location
          type: TEXT
          nullable: true
          description: Location is a nullable text field representing the place associated with the salary data.
        - name: Salary
          type: TEXT
          nullable: true
          description: The Salary column is a nullable TEXT column that stores formatted salary information, such as '₹X,XX,XXX/yr',
            and is used to represent the actual salary amount reported. Unlike the SalariesReported column, which stores a
            count or average as a real number, this column holds textual representations of individual salary values.
        samples:
        - index: 0
          companyname: Mu Sigma
          jobtitle: Data Scientist
          salariesreported: 105.0
          location: Bangalore
          salary: ₹6,48,573/yr
        - index: 1
          companyname: IBM
          jobtitle: Data Scientist
          salariesreported: 95.0
          location: Bangalore
          salary: ₹11,91,950/yr
        - index: 2
          companyname: Tata Consultancy Services
          jobtitle: Data Scientist
          salariesreported: 66.0
          location: Bangalore
          salary: ₹8,36,874/yr
        - index: 3
          companyname: Impact Analytics
          jobtitle: Data Scientist
          salariesreported: 40.0
          location: Bangalore
          salary: ₹6,69,578/yr
        - index: 4
          companyname: Accenture
          jobtitle: Data Scientist
          salariesreported: 32.0
          location: Bangalore
          salary: ₹9,44,110/yr
        description: A dataset containing reported salaries for Data Scientists at various companies in Bangalore, including
          company name, job title, number of salaries reported, and salary amounts.
        kind: table
      - name: StaffHours
        columns:
        - name: StaffMember
          type: TEXT
          nullable: true
          description: StaffMember is a nullable text field representing the identifier of a staff member.
        - name: EventDate
          type: TEXT
          nullable: true
          description: EventDate represents the calendar date of an event related to staff hours, such as "2024-03-15", and
            is stored as text with null allowed. It is used in conjunction with EventTime to specify the exact moment of an
            event, but queries that only need to filter by day or date should use this column rather than EventTime.
        - name: EventTime
          type: TEXT
          nullable: true
          description: EventTime represents the time of day for an event, such as "14:30:00", and is stored as text with null
            allowed. It is used in conjunction with EventDate to specify the exact moment of an event, but queries that only
            need to filter by time of day should use this column rather than EventDate.
        - name: EventType
          type: TEXT
          nullable: true
          description: Records the type of event, such as "Enter" or "Exit," associated with staff member activity.
        samples:
        - staffmember: B
          eventdate: '2013-02-01'
          eventtime: 09:00
          eventtype: Enter
        - staffmember: A
          eventdate: '2013-01-15'
          eventtime: 08:00
          eventtype: Exit
        - staffmember: C
          eventdate: '2013-03-01'
          eventtime: 07:45
          eventtype: Enter
        - staffmember: A
          eventdate: '2013-01-08'
          eventtime: '11:00'
          eventtype: Enter
        - staffmember: E
          eventdate: '2013-03-01'
          eventtime: '17:00'
          eventtype: Exit
        description: StaffHours is a table that records staff member activity with details including the staff member's name,
          event date, event time, and event type (e.g., Enter or Exit).
        kind: table
      - name: hardware_dim_customer
        columns:
        - name: customer_code
          type: INTEGER
          nullable: true
          description: Customer code identifier, represented as an integer, with possible null values.
        - name: customer
          type: TEXT
          nullable: true
          description: 'Customer name associated with the customer code, representing the business or entity. Known sample
            values: ''Atliq Exclusive'', ''Atliq e Store''.'
        - name: platform
          type: TEXT
          nullable: true
          description: 'platform is a nullable TEXT column representing the sales platform associated with the customer, such
            as "Brick & Mortar" or "E-Commerce". Known sample values: ''Brick & Mortar'', ''E-Commerce''.'
        - name: channel
          type: TEXT
          nullable: true
          description: 'The `channel` column represents the sales or distribution channel associated with the customer, such
            as "Direct." Known sample values: ''Direct''.'
        - name: market
          type: TEXT
          nullable: true
          description: 'The `market` column contains textual data representing the specific market or country associated with
            a customer, such as "India," "Indonesia," or "Japan." It differs from the `region` column, which represents broader
            geographic regions like "APAC." For example, "India" appears in `market` but corresponds to "APAC" in `region.`
            Known sample values: ''India'', ''Indonesia'', ''Japan''.'
        - name: sub_zone
          type: TEXT
          nullable: true
          description: 'The `sub_zone` column is a nullable text field representing a more granular geographic sub-zone associated
            with the customer, such as "India" or "ROA." It differs from the `market` column, which represents specific countries
            or markets like "India," and from the `region` column, which represents broader regions like "APAC." For example,
            "ROA" appears in `sub_zone` but not Known sample values: ''India'', ''ROA''.'
        - name: region
          type: TEXT
          nullable: true
          description: 'The `region` column contains textual values representing the broader geographic region associated
            with a customer, such as "APAC." It differs from the `market` column, which represents specific countries or markets
            like "India." For example, "India" appears in `market` but corresponds to "APAC" in `region.` Known sample values:
            ''APAC''.'
        samples:
        - customer_code: 70002017
          customer: Atliq Exclusive
          platform: Brick & Mortar
          channel: Direct
          market: India
          sub_zone: India
          region: APAC
        - customer_code: 70002018
          customer: Atliq e Store
          platform: E-Commerce
          channel: Direct
          market: India
          sub_zone: India
          region: APAC
        - customer_code: 70003181
          customer: Atliq Exclusive
          platform: Brick & Mortar
          channel: Direct
          market: Indonesia
          sub_zone: ROA
          region: APAC
        - customer_code: 70003182
          customer: Atliq e Store
          platform: E-Commerce
          channel: Direct
          market: Indonesia
          sub_zone: ROA
          region: APAC
        - customer_code: 70004069
          customer: Atliq Exclusive
          platform: Brick & Mortar
          channel: Direct
          market: Japan
          sub_zone: ROA
          region: APAC
        description: A table containing customer information with attributes such as customer code, name, platform, channel,
          and geographic details like market, sub-zone, and region.
        kind: table
      - name: hardware_dim_product
        columns:
        - name: product_code
          type: TEXT
          nullable: true
          description: Product code identifier for hardware items, used to uniquely specify product variants.
        - name: division
          type: TEXT
          nullable: true
          description: 'A text field representing the business division associated with the product, such as "P & A". Known
            sample values: ''P & A''.'
        - name: segment
          type: TEXT
          nullable: true
          description: 'A textual field representing the product segment, such as "Peripherals," used for categorizing products
            at a higher level. Known sample values: ''Peripherals''.'
        - name: category
          type: TEXT
          nullable: true
          description: 'A high-level classification of the product type, such as "Internal HDD". This differs from the `product`
            column, which provides a detailed name like "AQ Dracula HDD – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache". Known
            sample values: ''Internal HDD''.'
        - name: product
          type: TEXT
          nullable: true
          description: The full product name describing the hardware, including specific features and specifications, such
            as "AQ Dracula HDD – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache". This differs from the `category` column, which
            provides a higher-level classification like "Internal HDD".
        - name: variant
          type: TEXT
          nullable: true
          description: 'A textual description of different versions or types of a product, such as "Standard" or "Premium
            Plus". This differs from the `product` column, which includes full product names like "AQ WereWolf NAS Internal
            Hard Drive HDD – 8.89 cm". Known sample values: ''Standard'', ''Plus'', ''Premium'', ''Premium Plus''.'
        samples:
        - product_code: A0118150101
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ Dracula HDD – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache
          variant: Standard
        - product_code: A0118150102
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ Dracula HDD – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache
          variant: Plus
        - product_code: A0118150103
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ Dracula HDD – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache
          variant: Premium
        - product_code: A0118150104
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ Dracula HDD – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache
          variant: Premium Plus
        - product_code: A0219150201
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ WereWolf NAS Internal Hard Drive HDD – 8.89 cm
          variant: Standard
        description: A table containing product details for hardware items, including product code, division, segment, category,
          product name, and variant.
        kind: table
      - name: hardware_fact_gross_price
        columns:
        - name: product_code
          type: TEXT
          nullable: true
          description: Product code, represented as text, indicating specific hardware items.
        - name: fiscal_year
          type: INTEGER
          nullable: true
          description: The `fiscal_year` column represents the year associated with the hardware product's gross price, stored
            as an integer and allowing null values.
        - name: gross_price
          type: REAL
          nullable: true
          description: Gross price of hardware products, stored as a real number with possible null values.
        samples:
        - product_code: A0118150101
          fiscal_year: 2020
          gross_price: 16.2323
        - product_code: A0118150101
          fiscal_year: 2021
          gross_price: 19.0573
        - product_code: A0118150102
          fiscal_year: 2020
          gross_price: 19.8577
        - product_code: A0118150102
          fiscal_year: 2021
          gross_price: 21.4565
        - product_code: A0118150103
          fiscal_year: 2020
          gross_price: 22.1317
        description: A table containing product codes, fiscal years, and corresponding gross prices for hardware items.
        kind: table
      - name: hardware_fact_manufacturing_cost
        columns:
        - name: product_code
          type: TEXT
          nullable: true
          description: Product code, represented as text, which can contain null values.
        - name: cost_year
          type: INTEGER
          nullable: true
          description: The `cost_year` column stores the year associated with manufacturing cost data as an integer, and can
            contain null values.
        - name: manufacturing_cost
          type: REAL
          nullable: true
          description: Manufacturing cost of a product, represented as a real number.
        samples:
        - product_code: A0118150101
          cost_year: 2020
          manufacturing_cost: 5.0207
        - product_code: A0118150101
          cost_year: 2021
          manufacturing_cost: 5.5172
        - product_code: A0118150102
          cost_year: 2020
          manufacturing_cost: 5.718
        - product_code: A0118150102
          cost_year: 2021
          manufacturing_cost: 6.2835
        - product_code: A0118150103
          cost_year: 2020
          manufacturing_cost: 6.3264
        description: Manufacturing cost data for hardware products by product code and year.
        kind: table
      - name: hardware_fact_pre_invoice_deductions
        columns:
        - name: customer_code
          type: INTEGER
          nullable: true
          description: Customer code as an integer, allowing null values.
        - name: fiscal_year
          type: INTEGER
          nullable: true
          description: Represents the fiscal year associated with the pre-invoice discount data.
        - name: pre_invoice_discount_pct
          type: REAL
          nullable: true
          description: pre_invoice_discount_pct is a nullable REAL column representing the percentage discount applied before
            invoicing.
        samples:
        - customer_code: 70002017
          fiscal_year: 2020
          pre_invoice_discount_pct: 0.0735
        - customer_code: 70002017
          fiscal_year: 2021
          pre_invoice_discount_pct: 0.0703
        - customer_code: 70002018
