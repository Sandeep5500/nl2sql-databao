          crsdesc: FUNDAMENTALS OF BUSINESS PROGRAMMING
          crsunits: 4
        - courseno: IS460
          crsdesc: SYSTEMS ANALYSIS
          crsunits: 4
        description: A table containing information about university courses, including course number, description, and credit
          units.
        kind: table
      - name: university_enrollment
        columns:
