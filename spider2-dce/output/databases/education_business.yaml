datasource_id: databases/education_business.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: SalaryDataset
        columns:
        - name: index
          type: INTEGER
          nullable: true
          description: 'Values: integer 0 .. 4343.'
        - name: CompanyName
          type: TEXT
          nullable: true
          description: 'Values: text. The SalaryDataset table contains 3 rows where
            the CompanyName column is NULL.'
        - name: JobTitle
          type: TEXT
          nullable: true
          description: 'Values: text.'
        - name: SalariesReported
          type: REAL
          nullable: true
          description: 'Values: integer 1 .. 105.'
        - name: Location
          type: TEXT
          nullable: true
          description: 'Values: text; values: Bangalore (1584), Pune (818), Hyderabad
            (669), New Delhi (656), Mumbai (617).'
        - name: Salary
          type: TEXT
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): ₹9,99,999/A
            46% e.g. ''₹1,00,000/mo'', ₹99,99,999/A 30% e.g. ''₹10,00,000/yr'', ₹99,999/A
            22% e.g. ''₹10,000/mo''. The Salary column in the SalaryDataset table
            contains text values formatted with a currency symbol, numeric amount,
            and a frequency suffix of either ''/yr'' or ''/mo''.'
        samples:
        - index: 0
          companyname: Mu Sigma
          jobtitle: Data Scientist
          salariesreported: 105.0
          location: Bangalore
          salary: ₹6,48,573/yr
        - index: 1
          companyname: IBM
          jobtitle: Data Scientist
          salariesreported: 95.0
          location: Bangalore
          salary: ₹11,91,950/yr
        - index: 2
          companyname: Tata Consultancy Services
          jobtitle: Data Scientist
          salariesreported: 66.0
          location: Bangalore
          salary: ₹8,36,874/yr
        - index: 3
          companyname: Impact Analytics
          jobtitle: Data Scientist
          salariesreported: 40.0
          location: Bangalore
          salary: ₹6,69,578/yr
        - index: 4
          companyname: Accenture
          jobtitle: Data Scientist
          salariesreported: 32.0
          location: Bangalore
          salary: ₹9,44,110/yr
        description: Each row records a single salary report entry for a specific
          job title at a company in an Indian city. The index is a unique surrogate
          key with no semantic meaning. one row per (index) — a salary report entry
          for a job at a company in a location  [no declared key; proposed by an LLM
          and verified unique in the data] The Salary column in the SalaryDataset
          table contains text values formatted with a currency symbol, commas, and
          a '/mo' suffix, such as '₹41,271/mo'.
        kind: table
      - name: StaffHours
        columns:
        - name: StaffMember
          type: TEXT
          nullable: true
          description: 'Values: text. The StaffHours table contains 26 distinct staff
            members identified by single uppercase letters A-Z. Every staff member
            has at least one recorded event, with some having only Enter events (G,
            I, K, R, S, T, U) and others having only Exit events (none), while most
            have both Enter and Exit events with varying counts.'
        - name: EventDate
          type: TEXT
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): 9999-99-99
            100% e.g. ''2013-01-02''. The StaffHours table contains columns StaffMember,
            EventDate, EventTime, and EventType. EventDate values are stored as text
            in YYYY-MM-DD format, and all visible dates are in 2013. The sample includes
            entries for staff members A through E.'
        - name: EventTime
          type: TEXT
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): 99:99 100%
            e.g. ''07:30''. The EventTime column contains text values in HH:MM format
            ranging from 07:40 to 18:25.'
        - name: EventType
          type: TEXT
          nullable: true
          description: 'Values: text; values: Enter (123), Exit (113). The StaffHours
            table contains EventType values of ''Enter'' and ''Exit''. For staff members
            G, H, I, J, R, S, T, and U, only one event type is recorded, while all
            other staff members have both ''Enter'' and ''Exit'' events with varying
            counts.'
        samples:
        - staffmember: B
          eventdate: '2013-02-01'
          eventtime: 09:00
          eventtype: Enter
        - staffmember: A
          eventdate: '2013-01-15'
          eventtime: 08:00
          eventtype: Exit
        - staffmember: C
          eventdate: '2013-03-01'
          eventtime: 07:45
          eventtype: Enter
        - staffmember: A
          eventdate: '2013-01-08'
          eventtime: '11:00'
          eventtype: Enter
        - staffmember: E
          eventdate: '2013-03-01'
          eventtime: '17:00'
          eventtype: Exit
        description: Each row records a staff member's entry (Enter) or exit (Exit)
          event at a specific date and time. The table tracks attendance events for
          26 staff members (A-Z) over 64 distinct dates in 2013. one row per (StaffMember,
          EventDate, EventTime) — A staff member's entry or exit event on a specific
          date and time  [no declared key; proposed by an LLM and verified unique
          in the data] The StaffHours table stores EventDate and EventTime as text
          values in YYYY-MM-DD and HH:MM formats respectively.
        kind: table
      - name: hardware_dim_customer
        columns:
        - name: customer_code
          type: INTEGER
          nullable: true
          description: 'Values: integer 70002017 .. 90027207.'
        - name: customer
          type: TEXT
          nullable: true
          description: 'Values: text. The query result shows 20 rows from the hardware_dim_customer
            table where the customer column contains the value ''Amazon '' with a
            length of 7 characters.'
        - name: platform
          type: TEXT
          nullable: true
          description: 'Values: text; values: Brick & Mortar (150), E-Commerce (59).'
        - name: channel
          type: TEXT
          nullable: true
          description: 'Values: text; values: Retailer (164), Direct (40), Distributor
            (5).'
        - name: market
          type: TEXT
          nullable: true
          description: 'Values: text.'
        - name: sub_zone
          type: TEXT
          nullable: true
          description: 'Values: text; values: NE (61), SE (44), ROA (38), India (18),
            ANZ (15), LATAM (7).'
        - name: region
          type: TEXT
          nullable: true
          description: 'Values: text; values: EU (105), APAC (71), LATAM (7). The
            region column in hardware_dim_customer contains values such as APAC and
            EU, and the query result shows 20 rows with no NULL values.'
        samples:
        - customer_code: 70002017
          customer: Atliq Exclusive
          platform: Brick & Mortar
          channel: Direct
          market: India
          sub_zone: India
          region: APAC
        - customer_code: 70002018
          customer: Atliq e Store
          platform: E-Commerce
          channel: Direct
          market: India
          sub_zone: India
          region: APAC
        - customer_code: 70003181
          customer: Atliq Exclusive
          platform: Brick & Mortar
          channel: Direct
          market: Indonesia
          sub_zone: ROA
          region: APAC
        - customer_code: 70003182
          customer: Atliq e Store
          platform: E-Commerce
          channel: Direct
          market: Indonesia
          sub_zone: ROA
          region: APAC
        - customer_code: 70004069
          customer: Atliq Exclusive
          platform: Brick & Mortar
          channel: Direct
          market: Japan
          sub_zone: ROA
          region: APAC
        description: The table records one row per customer entity combined with its
          sales channel configuration. Each customer name may appear multiple times
          with different platforms and/or channels, representing distinct sales relationships.
          one row per (customer_code) — a distinct customer entity or sales channel
          combination  [no declared key; proposed by an LLM and verified unique in
          the data] The query result shows 20 rows where the customer column contains
          'Amazon ' with a length of 7.
        kind: table
      - name: hardware_dim_product
        columns:
        - name: product_code
          type: TEXT
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): A9999999999
            100% e.g. ''A0118150101''.'
        - name: division
          type: TEXT
          nullable: true
          description: 'Values: text; values: P & A (200), PC (161), N & S (36). The
            hardware_dim_product table''s division column contains three distinct
            values: ''N & S'', ''P & A'', and ''PC''.'
        - name: segment
          type: TEXT
          nullable: true
          description: 'Values: text; values: Notebook (129), Accessories (116), Peripherals
            (84), Desktop (32), Storage (27), Networking (9). The hardware_dim_product
            table''s segment column contains six distinct values: Accessories, Desktop,
            Networking, Notebook, Peripherals, and Storage.'
        - name: category
          type: TEXT
          nullable: true
          description: 'Values: text.'
        - name: product
          type: TEXT
          nullable: true
          description: 'Values: text.'
        - name: variant
          type: TEXT
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): A 9 44% e.g.
            ''Plus 1'', A A 24% e.g. ''Plus Black'', A 22% e.g. ''Plus''.'
        samples:
        - product_code: A0118150101
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ Dracula HDD – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache
          variant: Standard
        - product_code: A0118150102
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ Dracula HDD – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache
          variant: Plus
        - product_code: A0118150103
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ Dracula HDD – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache
          variant: Premium
        - product_code: A0118150104
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ Dracula HDD – 3.5 Inch SATA 6 Gb/s 5400 RPM 256 MB Cache
          variant: Premium Plus
        - product_code: A0219150201
          division: P & A
          segment: Peripherals
          category: Internal HDD
          product: AQ WereWolf NAS Internal Hard Drive HDD – 8.89 cm
          variant: Standard
        description: 'The table hardware_dim_product records the hierarchy of hardware
          products: division > segment > category > product > variant. Each row is
          a unique product variant identified by product_code. one row per (product_code)
          — a specific hardware product variant  [no declared key; proposed by an
          LLM and verified unique in the data] The query result shows two distinct
          category values, ''USB Flash Drives'' and ''Wi fi extender'', that are not
          present in the specified list of excluded categories.'
        kind: table
      - name: hardware_fact_gross_price
        columns:
        - name: product_code
          type: TEXT
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): A9999999999
            100% e.g. ''A0118150101''.'
        - name: fiscal_year
          type: INTEGER
          nullable: true
          description: 'Values: integer 2020 .. 2021; values: 2021 (334), 2020 (245).'
        - name: gross_price
          type: REAL
          nullable: true
          description: 'Values: decimal 2.9168 .. 834.9812.'
        samples:
        - product_code: A0118150101
          fiscal_year: 2020
          gross_price: 16.2323
        - product_code: A0118150101
          fiscal_year: 2021
          gross_price: 19.0573
        - product_code: A0118150102
          fiscal_year: 2020
          gross_price: 19.8577
        - product_code: A0118150102
          fiscal_year: 2021
          gross_price: 21.4565
        - product_code: A0118150103
          fiscal_year: 2020
          gross_price: 22.1317
        description: One row records the gross price for a specific product in a specific
          fiscal year. The table records product gross prices for fiscal years 2020
          and 2021. one row per (product_code, fiscal_year) — the gross price of a
          product in a specific fiscal year  [no declared key; proposed by an LLM
          and verified unique in the data]
        kind: table
      - name: hardware_fact_manufacturing_cost
        columns:
        - name: product_code
          type: TEXT
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): A9999999999
            100% e.g. ''A0118150101''.'
        - name: cost_year
          type: INTEGER
          nullable: true
          description: 'Values: integer 2020 .. 2021; values: 2021 (334), 2020 (245).
            The table hardware_fact_manufacturing_cost contains 13 rows where cost_year
            is 2020 and the product_code does not appear in any row where cost_year
            is 2021.'
        - name: manufacturing_cost
          type: REAL
          nullable: true
          description: 'Values: decimal 0.892 .. 240.5364.'
        samples:
        - product_code: A0118150101
          cost_year: 2020
          manufacturing_cost: 5.0207
        - product_code: A0118150101
          cost_year: 2021
          manufacturing_cost: 5.5172
        - product_code: A0118150102
          cost_year: 2020
          manufacturing_cost: 5.718
        - product_code: A0118150102
          cost_year: 2021
          manufacturing_cost: 6.2835
        - product_code: A0118150103
          cost_year: 2020
          manufacturing_cost: 6.3264
        description: One row records the manufacturing cost for a specific product
          in a specific fiscal year. This table tracks how production costs changed
