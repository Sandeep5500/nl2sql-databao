          fiscal_year: 2020
        - date: '2019-09-01'
          product_code: A0118150101
          customer_code: 70004069
          sold_quantity: 9
          fiscal_year: 2020
        description: One row records the quantity of a specific product sold to a
          specific customer on a specific month (date is always the 1st of the month).
          The table covers 24 months from Sep 2019 to Aug 2021, with fiscal_year 2020
          covering Sep 2019–Aug 2020 and fiscal_year 2021 covering Sep 2020–Aug 2021.
          one row per (date, product_code, customer_code) — sales quantity of a product
          to a customer on a specific date  [no declared key; proposed by an LLM and
          verified unique in the data] The hardware_fact_sales_monthly table contains
          fiscal year 2020 with dates from 2019-09-01 to 2020-08-01 and fiscal year
          2021 with dates from 2020-09-01 to 2021-08-01.
