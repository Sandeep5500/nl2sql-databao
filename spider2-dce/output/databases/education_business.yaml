        description: Monthly hardware sales data with details on products, customers, quantities sold, and fiscal years.
        kind: table
      - name: university_course
        columns:
        - name: CourseNo
          type: TEXT
          nullable: true
          description: CourseNo is a text column that stores the course number for university courses.
        - name: CrsDesc
          type: TEXT
          nullable: true
          description: CrsDesc is a text column that stores the full description of a university course, such as "FUNDAMENTALS
            OF FINANCE" or "CORPORATE FINANCE." It differs from CourseNo, which stores the course number rather than its description.
            A query would use CrsDesc when searching for or filtering by course content, while CourseNo would be used for
            identifying courses by their unique number.
        - name: CrsUnits
          type: INTEGER
          nullable: true
          description: CrsUnits is an integer column representing the number of course units for a university course.
        samples:
        - courseno: FIN300
          crsdesc: FUNDAMENTALS OF FINANCE
          crsunits: 4
        - courseno: FIN450
