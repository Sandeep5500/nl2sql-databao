      - name: university_offering
        columns:
        - name: OfferNo
          type: INTEGER
          nullable: true
          description: OfferNo is an integer column that uniquely identifies each university course offering. Unlike CourseNo,
            which identifies the course itself, OfferNo identifies a specific instance of a course being offered. Queries
            seeking to distinguish between different offerings of the same course would use OfferNo.
        - name: CourseNo
          type: TEXT
          nullable: true
          description: CourseNo is a nullable TEXT column representing the course number associated with a university offering.
            Unlike OfferNo, which uniquely identifies a specific offering, CourseNo identifies the general course. Queries
            seeking to find all offerings of a specific course would use CourseNo.
        - name: OffTerm
          type: TEXT
          nullable: true
          description: OffTerm is a text field representing the term in which the university course offering is held, such
            as "SUMMER," "FALL," or "SPRING." It is used in conjunction with OffYear to uniquely identify the academic term
            of an offering. Unlike OffYear, which identifies the year, OffTerm identifies the specific part of the year.
        - name: OffYear
          type: INTEGER
          nullable: true
          description: OffYear is a nullable integer column representing the year of the course offering. It is used in conjunction
            with OffTerm to uniquely identify the academic term of an offering. For example, an offering might occur in
        - name: OffLocation
          type: TEXT
          nullable: true
          description: A text field indicating the location where the course offering is held.
        - name: OffTime
          type: TEXT
          nullable: true
          description: The OffTime column stores the time of day when a university course is offered, such as "10:30 AM,"
            and is represented as text.
        - name: FacNo
          type: REAL
          nullable: true
          description: Faculty number associated with the course offering, stored as a real number.
        - name: OffDays
