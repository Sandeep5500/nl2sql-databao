          cost of a product in a given year  [no declared key; proposed by an LLM
          and verified unique in the data]
        kind: table
      - name: hardware_fact_pre_invoice_deductions
        columns:
        - name: customer_code
          type: INTEGER
          nullable: true
          description: 'Values: integer 70002017 .. 90027207.'
        - name: fiscal_year
          type: INTEGER
          nullable: true
          description: 'Values: integer 2020 .. 2021; values: 2020 (209), 2021 (209).'
        - name: pre_invoice_discount_pct
          type: REAL
          nullable: true
          description: 'Values: decimal 0.0531 .. 0.3095. The minimum value is 0.0531,
            the maximum is 0.3095, and the average is 0.23361626794258364.'
        samples:
        - customer_code: 70002017
          fiscal_year: 2020
          pre_invoice_discount_pct: 0.0735
        - customer_code: 70002017
          fiscal_year: 2021
          pre_invoice_discount_pct: 0.0703
        - customer_code: 70002018
          fiscal_year: 2020
          pre_invoice_discount_pct: 0.2255
        - customer_code: 70002018
          fiscal_year: 2021
          pre_invoice_discount_pct: 0.2061
        - customer_code: 70003181
          fiscal_year: 2020
          pre_invoice_discount_pct: 0.0531
        description: One row per customer and fiscal year records the pre-invoice
          discount percentage applied to that customer’s sales in that year. All 209
          customers in the customer dimension have exactly one row for each of the
          two fiscal years (2020 and 2021), so this table is a complete 1:1 match
          with hardware_dim_customer across both years. one row per (customer_code,
          fiscal_year) — the pre-invoice discount percentage for a customer in a fiscal
          year  [no declared key; proposed by an LLM and verified unique in the data]
        kind: table
