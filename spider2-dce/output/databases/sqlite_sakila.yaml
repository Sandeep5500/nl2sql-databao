datasource_id: databases/sqlite_sakila.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: actor
        columns:
        - name: actor_id
          type: numeric
          nullable: false
          description: The `actor_id` column is a non-nullable numeric field serving
            as the primary key for the `actor` table.
        - name: first_name
          type: VARCHAR(45)
          nullable: false
          description: A column storing the first name of an actor, with a maximum
            length of 45 characters and no null values allowed.
        - name: last_name
          type: VARCHAR(45)
          nullable: false
          description: The `last_name` column stores the surname of an actor as a
            non-nullable string with a maximum length of 45 characters.
        - name: last_update
          type: TIMESTAMP
          nullable: false
          description: The `last_update` column stores the timestamp of the most recent
            modification for each actor record and cannot be null.
        samples:
        - actor_id: 1
          first_name: PENELOPE
          last_name: GUINESS
          last_update: '2021-03-06 15:51:59'
        - actor_id: 2
          first_name: NICK
          last_name: WAHLBERG
          last_update: '2021-03-06 15:51:59'
        - actor_id: 3
          first_name: ED
          last_name: CHASE
          last_update: '2021-03-06 15:51:59'
        - actor_id: 4
          first_name: JENNIFER
          last_name: DAVIS
          last_update: '2021-03-06 15:51:59'
        - actor_id: 5
          first_name: JOHNNY
          last_name: LOLLOBRIGIDA
          last_update: '2021-03-06 15:51:59'
        description: The actor table contains information about actors, including
          their unique ID, first name, last name, and last update timestamp. It is
          primarily indexed on actor_id and includes an index on last_name.
        kind: table
        primary_key:
          name: pk_actor
          columns:
          - actor_id
          validated: true
        indexes:
        - name: idx_actor_last_name
          columns:
          - last_name
          unique: false
      - name: address
        columns:
        - name: address_id
          type: INT
          nullable: false
          description: The `address_id` column is an integer that uniquely identifies
            each address entry and cannot be null.
        - name: address
          type: VARCHAR(50)
          nullable: false
          description: The `address` column stores the primary address information
            as a non-nullable string with a maximum length of 50 characters. It typically
            contains the street address, such as "47 MySakila Drive", whereas `address2`
            is used for an optional second line of address information.
        - name: address2
          type: VARCHAR(50)
          nullable: true
          description: The `address2` column stores an optional second line of an
            address, with a maximum length of 50 characters. It allows null values
            and defaults to `NULL` if not provided, whereas `address` contains the
            primary address line, such as "47 MySakila Drive".
          default_expression: 'NULL'
        - name: district
          type: VARCHAR(20)
          nullable: false
          description: The `district` column stores a non-nullable string of up to
            20 characters representing the district information for an address.
        - name: city_id
          type: INT
          nullable: false
          description: The `city_id` column is a non-nullable integer that represents
            the identifier of the associated city in the address table. It is used
            to link this address to a specific city in a related table, such as a
            `city` table with a matching `city_id`.
        - name: postal_code
          type: VARCHAR(10)
          nullable: true
          description: The `postal_code` column stores optional postal code information
            as a string with a maximum length of 10 characters. It allows null values
            and defaults to `NULL` if not specified.
          default_expression: 'NULL'
        - name: phone
          type: VARCHAR(20)
          nullable: false
          description: The `phone` column stores a non-nullable string of up to 20
            characters representing a phone number associated with an address.
        - name: last_update
          type: TIMESTAMP
          nullable: false
          description: The `last_update` column stores the timestamp of the last modification,
            and it cannot contain null values.
        samples:
        - address_id: 1
          address: 47 MySakila Drive
          district: ' '
          city_id: 300
          phone: ' '
          last_update: '2021-03-06 15:51:54'
        - address_id: 2
          address: 28 MySQL Boulevard
          district: ' '
          city_id: 576
          phone: ' '
          last_update: '2021-03-06 15:51:54'
        - address_id: 3
          address: 23 Workhaven Lane
          district: ' '
          city_id: 300
          phone: ' '
          last_update: '2021-03-06 15:51:54'
        - address_id: 4
          address: 1411 Lillydale Drive
          district: ' '
          city_id: 576
          phone: ' '
          last_update: '2021-03-06 15:51:54'
        - address_id: 5
          address: 1913 Hanoi Way
          district: ' '
          city_id: 463
          postal_code: '35200'
          phone: ' '
          last_update: '2021-03-06 15:51:54'
        description: The address table stores location details such as street addresses,
          district, city reference, postal code, and phone number, with a primary
          key on address_id and a foreign key link to the city table via city_id.
        kind: table
        primary_key:
          name: pk_address
          columns:
          - address_id
          validated: true
        indexes:
        - name: idx_fk_city_id
          columns:
          - city_id
          unique: false
        foreign_keys:
        - name: fk_address_0
          mapping:
          - from_column: city_id
            to_column: city_id
          referenced_table: main.city
          enforced: true
          validated: true
          on_update: cascade
          on_delete: no action
      - name: category
        columns:
        - name: category_id
          type: SMALLINT
          nullable: false
          description: category_id is a non-nullable SMALLINT column serving as the
            primary key for the category table.
        - name: name
          type: VARCHAR(25)
          nullable: false
          description: The `name` column stores the category name as a non-nullable
            string with a maximum length of 25 characters.
        - name: last_update
          type: TIMESTAMP
          nullable: false
          description: A non-nullable timestamp column indicating the last update
            time for the category.
        samples:
        - category_id: 1
          name: Action
          last_update: '2021-03-06 15:52:00'
        - category_id: 2
          name: Animation
          last_update: '2021-03-06 15:52:00'
        - category_id: 3
          name: Children
          last_update: '2021-03-06 15:52:00'
        - category_id: 4
          name: Classics
          last_update: '2021-03-06 15:52:00'
        - category_id: 5
          name: Comedy
          last_update: '2021-03-06 15:52:00'
        description: The category table contains a list of movie categories with unique
          identifiers, names, and timestamps for the last update. It includes categories
          such as Action, Animation, Children, Classics, and Comedy.
        kind: table
        primary_key:
          name: pk_category
          columns:
          - category_id
          validated: true
      - name: city
        columns:
        - name: city_id
          type: INT
          nullable: false
          description: city_id is a non-nullable integer column serving as the primary
            key for the city table.
        - name: city
          type: VARCHAR(50)
          nullable: false
          description: A column named "city" that stores city names as non-nullable
            strings with a maximum length of 50 characters.
        - name: country_id
          type: SMALLINT
          nullable: false
          description: A non-nullable SMALLINT column representing the foreign key
            to the country table, used to link each city to its corresponding country.
            This column differs from the city column, which stores city names like
            "Abha" or "Adana", whereas country_id stores numeric identifiers like
            87 or 101 to reference the country table.
        - name: last_update
          type: TIMESTAMP
          nullable: false
          description: A non-nullable timestamp column indicating the last update
            time for a city record.
        samples:
        - city_id: 1
          city: A Corua (La Corua)
          country_id: 87
          last_update: '2021-03-06 15:51:49'
        - city_id: 2
          city: Abha
          country_id: 82
          last_update: '2021-03-06 15:51:49'
        - city_id: 3
          city: Abu Dhabi
          country_id: 101
          last_update: '2021-03-06 15:51:49'
        - city_id: 4
          city: Acua
          country_id: 60
          last_update: '2021-03-06 15:51:49'
        - city_id: 5
          city: Adana
          country_id: 97
          last_update: '2021-03-06 15:51:49'
        description: A table containing city information including city ID, name,
          country ID, and last update timestamp.
        kind: table
        primary_key:
          name: pk_city
          columns:
          - city_id
          validated: true
        indexes:
        - name: idx_fk_country_id
          columns:
          - country_id
          unique: false
        foreign_keys:
        - name: fk_city_0
          mapping:
          - from_column: country_id
            to_column: country_id
          referenced_table: main.country
          enforced: true
          validated: true
          on_update: cascade
          on_delete: no action
      - name: country
        columns:
        - name: country_id
          type: SMALLINT
          nullable: false
          description: country_id is a non-nullable SMALLINT column serving as the
            primary key for the country table.
        - name: country
          type: VARCHAR(50)
          nullable: false
          description: A column named "country" of type VARCHAR(50) that stores country
            names and cannot contain null values.
        - name: last_update
          type: TIMESTAMP
          nullable: true
          description: A nullable timestamp column indicating the last update time
            for the country record.
        samples:
        - country_id: 1
          country: Afghanistan
          last_update: '2021-03-06 15:51:49'
        - country_id: 2
          country: Algeria
          last_update: '2021-03-06 15:51:49'
        - country_id: 3
          country: American Samoa
          last_update: '2021-03-06 15:51:49'
        - country_id: 4
          country: Angola
          last_update: '2021-03-06 15:51:49'
        - country_id: 5
          country: Anguilla
          last_update: '2021-03-06 15:51:49'
        description: A table containing country information, including a unique country
          ID, country name, and last update timestamp. The primary key is the country_id
          field.
        kind: table
        primary_key:
          name: pk_country
          columns:
          - country_id
          validated: true
      - name: customer
        columns:
        - name: customer_id
          type: INT
          nullable: false
          description: customer_id is an integer column that uniquely identifies each
            customer and cannot be null.
        - name: store_id
          type: INT
          nullable: false
          description: The `store_id` column is an integer that identifies the store
            associated with the customer and cannot be null.
        - name: first_name
          type: VARCHAR(45)
          nullable: false
          description: Customer's first name, stored as a non-nullable string with
            a maximum length of 45 characters.
        - name: last_name
          type: VARCHAR(45)
          nullable: false
          description: The `last_name` column stores the customer's surname as a non-nullable
            string with a maximum length of 45 characters.
        - name: email
          type: VARCHAR(50)
          nullable: true
          description: The email column stores a customer's email address as a variable
            character string up to 50 characters, allowing null values with a default
            of NULL.
          default_expression: 'NULL'
        - name: address_id
          type: INT
          nullable: false
          description: The `address_id` column is an integer that uniquely identifies
            a customer's address and cannot be null.
        - name: active
          type: CHAR(1)
          nullable: false
          description: The `active` column is a non-nullable CHAR(1) field with a
            default value of 'Y', indicating whether the customer is active. It differs
            from timestamp-based status indicators like `last_update` by providing
            a direct boolean-like flag for customer status. For example, a customer
            with `active` = 'Y' and `last_update` = '2021-03-06 15:53:36' is currently
            active and recently updated.
          default_expression: '''Y'''
        - name: create_date
          type: TIMESTAMP
          nullable: false
          description: The `create_date` column stores the timestamp when a customer
            record was created, and cannot be null.
        - name: last_update
          type: TIMESTAMP
          nullable: false
          description: The `last_update` column stores the timestamp of the most recent
            update to a customer record and cannot be null. It is used to determine
            when a customer's information was last modified, in contrast to `create_date`,
            which records when the customer was first added. For example, a customer
            with `create_date` = '2006-02-14 22:04:36.000' and `last_update` = '2021-03-06
            15:53:36' was created in 2006 and last updated in 2021.
        samples:
        - customer_id: 1
          store_id: 1
          first_name: MARY
          last_name: SMITH
          email: MARY.SMITH@sakilacustomer.org
          address_id: 5
          active: '1'
          create_date: '2006-02-14 22:04:36.000'
          last_update: '2021-03-06 15:53:36'
        - customer_id: 2
          store_id: 1
          first_name: PATRICIA
          last_name: JOHNSON
          email: PATRICIA.JOHNSON@sakilacustomer.org
          address_id: 6
          active: '1'
          create_date: '2006-02-14 22:04:36.000'
          last_update: '2021-03-06 15:53:36'
        - customer_id: 3
          store_id: 1
          first_name: LINDA
          last_name: WILLIAMS
          email: LINDA.WILLIAMS@sakilacustomer.org
          address_id: 7
          active: '1'
          create_date: '2006-02-14 22:04:36.000'
          last_update: '2021-03-06 15:53:36'
        - customer_id: 4
          store_id: 2
          first_name: BARBARA
          last_name: JONES
          email: BARBARA.JONES@sakilacustomer.org
          address_id: 8
          active: '1'
          create_date: '2006-02-14 22:04:36.000'
          last_update: '2021-03-06 15:53:36'
        - customer_id: 5
          store_id: 1
          first_name: ELIZABETH
          last_name: BROWN
          email: ELIZABETH.BROWN@sakilacustomer.org
          address_id: 9
