        - name: active
          type: CHAR(1)
          nullable: false
          description: 'The `active` column is a non-nullable CHAR(1) field with a
            default value of ''Y'', indicating whether the customer is active. It
            differs from timestamp-based status indicators like `last_update` by providing
            a direct boolean-like flag for customer status. For example, a customer
            with `active` = ''Y'' and `last_update` = ''2021-03-06 15:53:36'' is currently
