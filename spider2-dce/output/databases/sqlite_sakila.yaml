        description: A view containing customer information such as name, address,
          city, country, and additional details like zip code, phone, and notes.
        kind: view
      - name: film
        columns:
        - name: film_id
          type: INT
          nullable: false
          description: film_id is an integer column that uniquely identifies each
            film and cannot be null.
        - name: title
          type: VARCHAR(255)
          nullable: false
          description: The `title` column stores the film's name as a non-nullable
            string with a maximum length of 255 characters.
        - name: description
          type: BLOB SUB_TYPE TEXT
          nullable: true
          description: The `description` column is a nullable text field used to store
            detailed information about a film, with a default value of `NULL`.
          default_expression: 'NULL'
        - name: release_year
          type: VARCHAR(4)
          nullable: true
          description: The `release_year` column stores the year a film was released
            as a 4-character string, and can contain null values.
          default_expression: 'NULL'
        - name: language_id
          type: SMALLINT
          nullable: false
          description: A required column storing the identifier for the language in
            which the film is presented. It is distinct from `original_language_id`,
            which is a nullable column representing the original language of the film.
            For example, if a film is originally in French (`original_language_id`
            might be 2) but presented in English (`language_id` would be 1).
        - name: original_language_id
          type: SMALLINT
          nullable: true
          description: A nullable SMALLINT column representing the original language
            of the film, with a default value of NULL. It is distinct from `language_id`,
            which is a required column storing the identifier for the language in
            which the film is presented. For example, if a film is originally in French
            (`original_language_id` might be 2) but presented in English (`language_id`
            would be 1).
          default_expression: 'NULL'
        - name: rental_duration
          type: SMALLINT
          nullable: false
          description: The `rental_duration` column specifies the default number of
            days a film can be rented, with a fixed default value of 3 days and cannot
            be null.
          default_expression: '3'
        - name: rental_rate
          type: DECIMAL(4,2)
          nullable: false
          description: The `rental_rate` column stores the rental price of a film
            as a decimal value with a fixed precision of 4 and scale of 2. It cannot
            be null and defaults to 4.99 if not specified. This column differs from
            `replacement_cost`, which represents the cost to replace a film and has
            a different scale and precision (5
          default_expression: '4.99'
        - name: length
          type: SMALLINT
          nullable: true
          description: The `length` column stores the duration of the film in minutes
            as a small integer, allowing null values with a default of `NULL`.
          default_expression: 'NULL'
        - name: replacement_cost
          type: DECIMAL(5,2)
          nullable: false
          description: The `replacement_cost` column stores the cost to replace a
            film, with a fixed precision of 5 digits and 2 decimal places. It cannot
            be null and defaults to 19.99 if no value is provided.
          default_expression: '19.99'
        - name: rating
          type: VARCHAR(10)
          nullable: true
          description: The `rating` column stores a film's content rating as a string
            of up to 10 characters, with a default value of 'G' and allows null values.
          default_expression: '''G'''
        - name: special_features
          type: VARCHAR(100)
          nullable: true
          description: special_features is a nullable VARCHAR(100) column that stores
            additional details about a film, such as "Deleted Scenes" or "Behind the
            Scenes." It has a default value of NULL.
          default_expression: 'NULL'
        - name: last_update
          type: TIMESTAMP
          nullable: false
          description: The `last_update` column stores the timestamp of the last modification
            to the film record and cannot be null.
