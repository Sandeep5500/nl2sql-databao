    - name: main
      tables:
      - name: actor
        columns:
        - name: actor_id
          type: numeric
          nullable: false
          description: The `actor_id` column is a non-nullable numeric field serving
            as the primary key for the `actor` table. [Profile] never null; 200 distinct
            (unique per row); range 1 to 200.
        - name: first_name
          type: VARCHAR(45)
          nullable: false
          description: 'A column storing the first name of an actor, with a maximum
            length of 45 characters and no null values allowed. [Profile] never null;
