          create_date: '2006-02-14 22:04:36.000'
          last_update: '2021-03-06 15:53:36'
        description: The customer table stores customer information including IDs,
          names, email addresses, store and address associations, and account activity
          status. It includes indexes for efficient lookups and foreign key relationships
          to address and store tables.
        kind: table
        primary_key:
          name: pk_customer
          columns:
          - customer_id
          validated: true
        indexes:
        - name: idx_customer_fk_address_id
          columns:
          - address_id
          unique: false
        - name: idx_customer_fk_store_id
          columns:
          - store_id
          unique: false
        - name: idx_customer_last_name
          columns:
          - last_name
          unique: false
        foreign_keys:
        - name: fk_customer_0
          mapping:
          - from_column: address_id
            to_column: address_id
          referenced_table: main.address
          enforced: true
          validated: true
          on_update: cascade
          on_delete: no action
        - name: fk_customer_1
          mapping:
          - from_column: store_id
            to_column: store_id
          referenced_table: main.store
          enforced: true
          validated: true
          on_update: cascade
          on_delete: no action
      - name: customer_list
        columns:
        - name: ID
          type: INT
          nullable: true
          description: The `ID` column is a unique integer identifier for each customer
            record and typically serves as the primary key for the table. Unlike the
            `SID` column, it is intended to uniquely identify rows in this table.
        - name: name
          type: ''
          nullable: true
          description: The "name" column contains customer names and allows null values,
            though all sample entries have data.
        - name: address
          type: VARCHAR(50)
          nullable: true
          description: The `address` column contains the physical address of the customer,
            with a maximum length of 50 characters. It allows null values.
        - name: zip_code
          type: VARCHAR(10)
          nullable: true
          description: The `zip_code` column stores postal code information as variable-length
            text, up to 10 characters, and allows null values.
        - name: phone
          type: VARCHAR(20)
          nullable: true
          description: The `phone` column stores customer phone numbers as variable-length
            text, up to 20 characters, and allows null values.
        - name: city
          type: VARCHAR(50)
          nullable: true
          description: The `city` column contains the city names of customers, with
            a maximum length of 50 characters. It allows null values.
        - name: country
          type: VARCHAR(50)
          nullable: true
          description: The `country` column contains the country name associated with
            each customer, stored as a variable character string up to 50 characters
            in length.
        - name: notes
          type: ''
          nullable: true
          description: The "notes" column contains textual information about customers,
            with values such as "active". It has no specified data type and allows
            null values.
        - name: SID
          type: INT
          nullable: true
          description: The `SID` column is an integer field that can contain null
            values and is distinct from the `ID` column, which is used as the primary
            key. While both are integer columns, `ID` is used for unique customer
            identification, whereas `SID` has no clear purpose from the sample data
