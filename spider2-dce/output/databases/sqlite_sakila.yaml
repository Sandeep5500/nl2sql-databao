        - actor_id: 114
          first_name: MORGAN
          last_name: MCDORMAND
          last_update: '2021-03-06 15:51:59'
        - actor_id: 173
          first_name: ALAN
          last_name: DREYFUSS
          last_update: '2021-03-06 15:52:00'
        - actor_id: 125
          first_name: ALBERT
          last_name: NOLTE
          last_update: '2021-03-06 15:52:00'
        - actor_id: 84
          first_name: JAMES
          last_name: PITT
          last_update: '2021-03-06 15:51:59'
        - actor_id: 191
          first_name: GREGORY
          last_name: GOODING
          last_update: '2021-03-06 15:52:00'
        description: 'The actor table contains information about actors, including
          their unique ID, first name, last name, and last update timestamp. It is
          primarily indexed on actor_id and includes an index on last_name. [Structure]
          200 rows. Grain: one row per (actor_id).'
        kind: table
        primary_key:
          name: pk_actor
          columns:
          - actor_id
          validated: true
        indexes:
        - name: idx_actor_last_name
          columns:
          - last_name
          unique: false
      - name: address
        columns:
        - name: address_id
          type: INT
          nullable: false
          description: The `address_id` column is an integer that uniquely identifies
            each address entry and cannot be null. [Profile] never null; 603 distinct
            (unique per row); range 1 to 605.
        - name: address
          type: VARCHAR(50)
          nullable: false
          description: The `address` column stores the primary address information
            as a non-nullable string with a maximum length of 50 characters. It typically
            contains the street address, such as "47 MySakila Drive", whereas `address2`
            is used for an optional second line of address information. [Profile]
            never null; 603 distinct (unique per row).
        - name: address2
          type: VARCHAR(50)
          nullable: true
          description: The `address2` column stores an optional second line of an
            address, with a maximum length of 50 characters. It allows null values
            and defaults to `NULL` if not provided, whereas `address` contains the
            primary address line, such as "47 MySakila Drive". [Profile] 100% null;
            0 distinct.
          default_expression: 'NULL'
        - name: district
          type: VARCHAR(20)
          nullable: false
          description: 'The `district` column stores a non-nullable string of up to
            20 characters representing the district information for an address. [Profile]
            never null; 1 distinct; all values:   (603).'
        - name: city_id
          type: INT
          nullable: false
          description: The `city_id` column is a non-nullable integer that represents
            the identifier of the associated city in the address table. It is used
            to link this address to a specific city in a related table, such as a
            `city` table with a matching `city_id`. [Profile] never null; 599 distinct;
            range 1 to 600.
        - name: postal_code
          type: VARCHAR(10)
          nullable: true
          description: 'The `postal_code` column stores optional postal code information
            as a string with a maximum length of 10 characters. It allows null values
