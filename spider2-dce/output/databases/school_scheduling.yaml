datasource_id: databases/school_scheduling.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: Buildings
        columns:
        - name: BuildingCode
          type: TEXT
          nullable: false
          description: 'Values: text; values: AS (1), CC (1), GYM (1), IB (1), LB
            (1), TB (1).'
        - name: BuildingName
          type: TEXT
          nullable: true
          description: 'Values: text; values: Arts and Sciences (1), College Center
            (1), Instructional Building (1), Library (1), PE and Wellness (1), Technology
            Building (1). The BuildingCode ''GYM'' corresponds to the BuildingName
            ''PE and Wellness'' and does not appear in the Classes or Class_Rooms
            tables.'
        - name: NumberOfFloors
          type: INTEGER
          nullable: true
          description: 'Values: integer 1 .. 3; values: 3 (3), 2 (2), 1 (1).'
        - name: ElevatorAccess
          type: BOOLEAN
          nullable: false
          description: 'Values: integer 0 .. 1; values: 1 (5), 0 (1).'
          default_expression: '0'
        - name: SiteParkingAvailable
          type: BOOLEAN
          nullable: false
          description: 'Values: integer 0 .. 1; values: 1 (5), 0 (1).'
          default_expression: '0'
        samples:
        - buildingcode: AS
          buildingname: Arts and Sciences
          numberoffloors: 3
          elevatoraccess: 1
          siteparkingavailable: 1
        - buildingcode: CC
          buildingname: College Center
          numberoffloors: 3
          elevatoraccess: 1
          siteparkingavailable: 0
        - buildingcode: GYM
          buildingname: PE and Wellness
          numberoffloors: 1
          elevatoraccess: 0
          siteparkingavailable: 1
        - buildingcode: IB
          buildingname: Instructional Building
          numberoffloors: 3
          elevatoraccess: 1
          siteparkingavailable: 1
        - buildingcode: LB
          buildingname: Library
          numberoffloors: 2
          elevatoraccess: 1
          siteparkingavailable: 1
        description: 'The Buildings table lists six campus buildings. Each row represents
          one building. The GYM building has no classes scheduled in it, while the
          other five buildings host all classes. primary key (declared): (BuildingCode)
          The BuildingCode ''GYM'' with BuildingName ''PE and Wellness'' exists in
          the Buildings table but has no associated records in the Classes or Class_Rooms
          tables. The query result shows 20 of 147 rows linking ClassID to BuildingCode
          values of AS, CC, IB, and TB.'
        kind: table
        primary_key:
          name: pk_Buildings
          columns:
          - BuildingCode
          validated: true
        indexes:
        - name: NumberOfFloors
          columns:
          - NumberOfFloors
          unique: false
      - name: Categories
        columns:
        - name: CategoryID
          type: TEXT
          nullable: false
          description: 'Values: text.'
        - name: CategoryDescription
          type: TEXT
          nullable: true
          description: 'Values: text.'
        - name: DepartmentID
          type: INTEGER
          nullable: true
          description: 'Values: integer 1 .. 5; values: 3 (5), 4 (5), 2 (4), 1 (3),
            5 (2). The Categories table contains 19 rows, each linking a CategoryID
            and CategoryDescription to a DepartmentID. The LEFT JOIN with the Departments
            table shows that every CategoryID has a matching DeptName, with Business
            Administration (ID 1) associated with Accounting, Business, and Journalism.'
          default_expression: '0'
        samples:
        - categoryid: ACC
          categorydescription: Accounting
          departmentid: 1
        - categoryid: ART
          categorydescription: Art
          departmentid: 3
        - categoryid: BIO
          categorydescription: Biology
          departmentid: 2
        - categoryid: BUS
          categorydescription: Business
          departmentid: 1
        - categoryid: CHE
          categorydescription: Chemistry
          departmentid: 2
        description: 'Each row defines an academic subject category and maps it to
          a department. Categories may exist without any subjects. primary key (declared):
          (CategoryID) The Categories table contains CategoryIDs GER, FRE, and PSY
          that have no associated subjects in the Subjects table.'
        kind: table
        primary_key:
          name: pk_Categories
          columns:
          - CategoryID
          validated: true
        indexes:
        - name: DepartmentID
          columns:
          - DepartmentID
          unique: false
      - name: Class_Rooms
        columns:
        - name: ClassRoomID
          type: INTEGER
          nullable: false
          description: 'Values: integer 1131 .. 3455.'
        - name: BuildingCode
          type: TEXT
          nullable: true
          description: 'Values: text; values: IB (18), CC (12), AS (10), TB (4), LB
            (3).'
        - name: PhoneAvailable
          type: BOOLEAN
          nullable: false
          description: 'Values: integer 0 .. 1; values: 0 (27), 1 (20).'
          default_expression: '0'
        samples:
        - classroomid: 1131
          buildingcode: LB
          phoneavailable: 1
        - classroomid: 1142
          buildingcode: LB
          phoneavailable: 0
        - classroomid: 1231
          buildingcode: LB
          phoneavailable: 1
        - classroomid: 1514
          buildingcode: AS
          phoneavailable: 1
        - classroomid: 1515
          buildingcode: AS
          phoneavailable: 1
        description: 'Each row records a physical classroom, its location in a building,
          and whether it has a phone. The table includes classrooms that are not currently
          assigned to any class. primary key (declared): (ClassRoomID)'
        kind: table
        primary_key:
          name: pk_Class_Rooms
          columns:
          - ClassRoomID
          validated: true
        indexes:
        - name: BuildingNumber
          columns:
          - BuildingCode
          unique: false
        foreign_keys:
        - name: fk_Class_Rooms_0
          mapping:
          - from_column: BuildingCode
            to_column: BuildingCode
          referenced_table: main.Buildings
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
      - name: Classes
        columns:
        - name: ClassID
          type: INTEGER
          nullable: false
          description: 'Values: integer 1000 .. 6600.'
        - name: SubjectID
          type: INTEGER
          nullable: true
          description: 'Values: integer 1 .. 56.'
          default_expression: '0'
        - name: ClassRoomID
          type: INTEGER
          nullable: true
          description: 'Values: integer 1131 .. 3446.'
          default_expression: '0'
        - name: Credits
          type: INTEGER
          nullable: true
          description: 'Values: integer 2 .. 5; values: 5 (111), 4 (19), 3 (15), 2
            (2).'
          default_expression: '0'
        - name: StartDate
          type: DATE
          nullable: true
          description: 'Values: date 2017-09-11 .. 2018-01-20; values: 2018-01-15
            (65), 2017-09-11 (52), 2018-01-16 (15), 2017-09-12 (13), 2017-09-16 (1),
            2018-01-20 (1).'
        - name: StartTime
          type: TIME
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): 99:99:99 100%
            e.g. ''07:00:00''.'
        - name: Duration
          type: INTEGER
          nullable: true
          description: 'Values: integer 50 .. 280; values: 50 (100), 140 (30), 110
            (12), 80 (3), 280 (2). The Classes table contains a Duration column with
            distinct values of 50, 80, 110, 140, and 280.'
          default_expression: '0'
        - name: MondaySchedule
          type: BOOLEAN
          nullable: false
          description: 'Values: integer 0 .. 1; values: 1 (118), 0 (29).'
          default_expression: '0'
        - name: TuesdaySchedule
          type: BOOLEAN
          nullable: false
          description: 'Values: integer 0 .. 1; values: 1 (97), 0 (50).'
          default_expression: '0'
        - name: WednesdaySchedule
          type: BOOLEAN
          nullable: false
          description: 'Values: integer 0 .. 1; values: 1 (112), 0 (35).'
          default_expression: '0'
        - name: ThursdaySchedule
          type: BOOLEAN
          nullable: false
          description: 'Values: integer 0 .. 1; values: 1 (99), 0 (48).'
          default_expression: '0'
        - name: FridaySchedule
          type: BOOLEAN
          nullable: false
          description: 'Values: integer 0 .. 1; values: 1 (99), 0 (48).'
          default_expression: '0'
        - name: SaturdaySchedule
          type: BOOLEAN
          nullable: false
          description: 'Values: integer 0 .. 1; values: 0 (127), 1 (20).'
          default_expression: '0'
        samples:
        - classid: 1000
          subjectid: 11
          classroomid: 1231
          credits: 5
          startdate: '2017-09-12'
          starttime: '10:00:00'
          duration: 50
          mondayschedule: 0
          tuesdayschedule: 1
          wednesdayschedule: 1
          thursdayschedule: 1
          fridayschedule: 1
          saturdayschedule: 1
        - classid: 1002
          subjectid: 12
          classroomid: 1619
          credits: 4
          startdate: '2017-09-11'
          starttime: '15:30:00'
          duration: 110
          mondayschedule: 1
          tuesdayschedule: 0
          wednesdayschedule: 1
          thursdayschedule: 0
          fridayschedule: 0
          saturdayschedule: 0
        - classid: 1004
          subjectid: 13
          classroomid: 1627
          credits: 4
          startdate: '2017-09-11'
          starttime: 08:00:00
          duration: 50
          mondayschedule: 1
          tuesdayschedule: 0
          wednesdayschedule: 1
          thursdayschedule: 1
          fridayschedule: 1
          saturdayschedule: 0
        - classid: 1006
          subjectid: 13
          classroomid: 1627
          credits: 4
          startdate: '2017-09-11'
          starttime: 09:00:00
          duration: 110
          mondayschedule: 1
          tuesdayschedule: 0
          wednesdayschedule: 1
          thursdayschedule: 0
          fridayschedule: 0
          saturdayschedule: 0
        - classid: 1012
          subjectid: 14
          classroomid: 1627
          credits: 4
          startdate: '2017-09-12'
          starttime: '13:00:00'
          duration: 110
          mondayschedule: 0
          tuesdayschedule: 1
          wednesdayschedule: 0
          thursdayschedule: 1
          fridayschedule: 0
          saturdayschedule: 0
        description: 'Each row records a scheduled class session (a specific section
          of a subject taught in a specific room). The table tracks when and where
          each class meets, its credit value, and which days it occurs. primary key
          (declared): (ClassID)'
        kind: table
        primary_key:
          name: pk_Classes
          columns:
          - ClassID
          validated: true
        indexes:
        - name: ClassRoomID
          columns:
          - ClassRoomID
          unique: false
        - name: ClassesCategoryID
          columns:
          - SubjectID
          unique: false
        foreign_keys:
        - name: fk_Classes_0
          mapping:
          - from_column: SubjectID
            to_column: SubjectID
          referenced_table: main.Subjects
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
        - name: fk_Classes_1
          mapping:
          - from_column: ClassRoomID
            to_column: ClassRoomID
          referenced_table: main.Class_Rooms
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
      - name: Departments
        columns:
        - name: DepartmentID
          type: INTEGER
          nullable: false
          description: 'Values: integer 1 .. 5; values: 1 (1), 2 (1), 3 (1), 4 (1),
            5 (1).'
        - name: DeptName
          type: TEXT
          nullable: true
          description: 'Values: text; values: Business Administration (1), Humanities
            (1), Information Technology (1), Sciences (1), Social Sciences (1).'
        - name: DeptChair
          type: INTEGER
          nullable: true
          description: 'Values: integer 98005 .. 98059; values: 98005 (1), 98007 (1),
            98010 (1), 98012 (1), 98059 (1).'
          default_expression: '0'
        samples:
        - departmentid: 1
          deptname: Business Administration
          deptchair: 98012
        - departmentid: 2
          deptname: Sciences
          deptchair: 98010
        - departmentid: 3
          deptname: Humanities
          deptchair: 98005
        - departmentid: 4
          deptname: Social Sciences
          deptchair: 98059
        - departmentid: 5
          deptname: Information Technology
          deptchair: 98007
        description: 'Each row records a department and its designated chairperson.
          The table has 5 departments, each with a unique chair from the Staff table.
          primary key (declared): (DepartmentID)'
        kind: table
        primary_key:
          name: pk_Departments
          columns:
          - DepartmentID
          validated: true
        indexes:
        - name: StaffDepartments
          columns:
          - DeptChair
          unique: false
        foreign_keys:
        - name: fk_Departments_0
