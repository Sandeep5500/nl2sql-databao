            98057 (Graduate Advisor).'
          default_expression: '0'
        - name: Title
          type: TEXT
          nullable: true
          description: 'Values: text; values: Professor (11), Instructor (8), Associate
            Professor (5).'
        - name: Status
          type: TEXT
          nullable: true
          description: 'Values: text; values: Full Time (22), On Leave (1), Part Time
            (1). The Faculty table contains two records with Status values other than
            ''Full Time'': StaffID 98010 (Professor) has Status ''On Leave'' and StaffID
            98052 (Instructor) has Status ''Part Time''.'
        - name: Tenured
          type: BOOLEAN
          nullable: false
          description: 'Values: integer 0 .. 1; values: 1 (22), 0 (2).'
          default_expression: '0'
        samples:
        - staffid: 98005
          title: Professor
          status: Full Time
          tenured: 1
        - staffid: 98007
          title: Professor
          status: Full Time
          tenured: 1
        - staffid: 98010
          title: Professor
          status: On Leave
          tenured: 1
        - staffid: 98011
          title: Instructor
          status: Full Time
          tenured: 1
        - staffid: 98012
          title: Professor
          status: Full Time
          tenured: 1
        description: 'The Faculty table records one row per faculty member who holds
          a faculty position, as indicated by Position=''Faculty'' in the Staff table.
          It tracks their academic title, employment status, and tenure status. primary
          key (declared): (StaffID)'
        kind: table
        primary_key:
          name: pk_Faculty
          columns:
          - StaffID
          validated: true
        foreign_keys:
        - name: fk_Faculty_0
          mapping:
          - from_column: StaffID
            to_column: StaffID
          referenced_table: main.Staff
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
      - name: Faculty_Categories
        columns:
        - name: StaffID
          type: INTEGER
          nullable: false
          description: 'Values: integer 98005 .. 98064.'
        - name: CategoryID
          type: TEXT
          nullable: false
          description: 'Values: text. The Categories table contains CategoryID values
            ACC, ART, BIO, BUS, CHE, CIS, CSC, ECO, ENG, FRE, GEG, GER, HIS, JRN,
            MAT, MUS, PHY, POL, and PSY, each with a corresponding CategoryDescription.'
          default_expression: '''ACC'''
        samples:
        - staffid: 98005
          categoryid: ART
        - staffid: 98005
          categoryid: ENG
        - staffid: 98005
          categoryid: MUS
        - staffid: 98007
          categoryid: ACC
        - staffid: 98007
          categoryid: ART
        description: 'Each row records that a faculty member is qualified to teach
          in a specific subject category. This table links faculty to the academic
          categories (e.g., ART, ENG) they can teach. primary key (declared): (StaffID,
          CategoryID)'
        kind: table
        primary_key:
          name: pk_Faculty_Categories
          columns:
          - StaffID
