        kind: table
        primary_key:
          name: pk_Class_Rooms
          columns:
          - ClassRoomID
          validated: true
        indexes:
        - name: BuildingNumber
          columns:
          - BuildingCode
          unique: false
        foreign_keys:
        - name: fk_Class_Rooms_0
          mapping:
          - from_column: BuildingCode
