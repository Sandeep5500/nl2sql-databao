datasource_id: databases/school_scheduling.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: Buildings
        columns:
        - name: BuildingCode
          type: TEXT
          nullable: false
          description: BuildingCode is a required text field uniquely identifying
            each building.
        - name: BuildingName
          type: TEXT
          nullable: true
          description: BuildingName is a nullable TEXT column that stores the name
            of the building.
        - name: NumberOfFloors
          type: INTEGER
          nullable: true
          description: The NumberOfFloors column represents the number of floors in
            a building, with integer values and nullable entries.
        - name: ElevatorAccess
          type: BOOLEAN
          nullable: false
          description: ElevatorAccess is a non-nullable boolean column indicating
            whether the building has elevator access, with a default value of 0 (false).
          default_expression: '0'
        - name: SiteParkingAvailable
          type: BOOLEAN
          nullable: false
          description: SiteParkingAvailable is a non-nullable BOOLEAN column with
            a default value of 0, indicating whether parking is available on-site
            for the building.
          default_expression: '0'
        samples:
        - buildingcode: AS
          buildingname: Arts and Sciences
          numberoffloors: 3
          elevatoraccess: 1
          siteparkingavailable: 1
        - buildingcode: CC
          buildingname: College Center
          numberoffloors: 3
          elevatoraccess: 1
          siteparkingavailable: 0
        - buildingcode: GYM
          buildingname: PE and Wellness
          numberoffloors: 1
          elevatoraccess: 0
          siteparkingavailable: 1
        - buildingcode: IB
          buildingname: Instructional Building
          numberoffloors: 3
          elevatoraccess: 1
          siteparkingavailable: 1
        - buildingcode: LB
          buildingname: Library
          numberoffloors: 2
          elevatoraccess: 1
          siteparkingavailable: 1
        description: A table containing information about buildings, including their
          codes, names, number of floors, elevator access, and site parking availability.
          The primary key is the BuildingCode.
        kind: table
        primary_key:
          name: pk_Buildings
          columns:
          - BuildingCode
          validated: true
        indexes:
        - name: NumberOfFloors
          columns:
          - NumberOfFloors
          unique: false
      - name: Categories
        columns:
        - name: CategoryID
          type: TEXT
          nullable: false
          description: CategoryID is a non-nullable TEXT column serving as the primary
            key for the Categories table.
        - name: CategoryDescription
          type: TEXT
          nullable: true
          description: A text field that stores the description of a category, which
            can be left empty.
        - name: DepartmentID
          type: INTEGER
          nullable: true
          description: DepartmentID is an optional INTEGER column with a default value
            of 0, used to associate categories with departments. This column is distinct
            from CategoryID, which is a TEXT-based primary key with no numeric or
            default value behavior. Queries would use DepartmentID to filter or join
            categories with department-related data, while CategoryID is used for
            uniquely identifying individual categories.
          default_expression: '0'
        samples:
        - categoryid: ACC
          categorydescription: Accounting
          departmentid: 1
        - categoryid: ART
          categorydescription: Art
          departmentid: 3
        - categoryid: BIO
          categorydescription: Biology
          departmentid: 2
        - categoryid: BUS
          categorydescription: Business
          departmentid: 1
        - categoryid: CHE
          categorydescription: Chemistry
          departmentid: 2
        description: The Categories table contains category information with a primary
          key on CategoryID, and includes descriptions and associated department IDs.
        kind: table
        primary_key:
          name: pk_Categories
          columns:
          - CategoryID
          validated: true
        indexes:
        - name: DepartmentID
          columns:
          - DepartmentID
          unique: false
      - name: Class_Rooms
        columns:
        - name: ClassRoomID
          type: INTEGER
          nullable: false
          description: ClassRoomID is an integer column that uniquely identifies each
            classroom and cannot be null.
        - name: BuildingCode
          type: TEXT
          nullable: true
          description: BuildingCode is a nullable TEXT column representing the building
            where the classroom is located.
        - name: PhoneAvailable
          type: BOOLEAN
          nullable: false
          description: A non-nullable boolean column indicating whether a phone is
            available in the classroom, with a default value of 0 (false).
          default_expression: '0'
