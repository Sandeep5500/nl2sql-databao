          - from_column: StaffID
            to_column: StaffID
          referenced_table: main.Faculty
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
        - name: fk_Faculty_Categories_1
          mapping:
          - from_column: CategoryID
            to_column: CategoryID
          referenced_table: main.Categories
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
      - name: Faculty_Classes
