      - name: actor
        columns:
        - name: actor_id
          type: numeric
          nullable: false
          description: The `actor_id` column is a numeric, non-nullable field that
            uniquely identifies each actor in the `actor` table. [Profile] never null;
            200 distinct (unique per row); range 1 to 200.
        - name: first_name
          type: VARCHAR(45)
          nullable: false
          description: 'A column storing the first name of an actor, with a maximum
            length of 45 characters and no null values allowed. [Profile] never null;
            128 distinct; most frequent: JULIA (4), KENNETH (4), PENELOPE (4), BURT
            (3), CAMERON (3), CHRISTIAN (3), CUBA (3), DAN (3).'
