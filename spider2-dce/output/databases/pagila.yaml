            non-nullable string with a maximum length of 45 characters. [Profile]
            never null; 121 distinct; most frequent: KILMER (5), NOLTE (4), TEMPLE
            (4), AKROYD (3), ALLEN (3), BERRY (3), DAVIS (3), DEGENERES (3).'
        - name: last_update
          type: TIMESTAMP
          nullable: false
          description: 'The `last_update` column stores the timestamp of the most
            recent modification for each actor record and cannot be null. [Profile]
            never null; 2 distinct; dates stored as TEXT in format YYYY-MM-DD HH:MM:SS,
            range 2021-03-06 15:51:59 to 2021-03-06 15:52:00; all values: 2021-03-06
            15:51:59 (123), 2021-03-06 15:52:00 (77).'
