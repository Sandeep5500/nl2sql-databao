        - name: address
          type: VARCHAR(50)
          nullable: false
          description: The `address` column stores the primary address information
            as a non-nullable string with a maximum length of 50 characters. It typically
            contains the street address, such as "47 MySakila Drive", and should be
            used when retrieving the main address line, as opposed to `address2`,
            which may contain additional details like apartment numbers. [Profile]
            never null; 603 distinct (unique per row).
        - name: address2
          type: VARCHAR(50)
          nullable: true
          description: The `address2` column stores optional additional address information
            as a string with a maximum length of 50 characters. It allows null values
            and is used for supplementary address details, such as apartment or suite
            numbers, whereas `address` holds the main street address, like "47 MySakila
            Drive". [Profile] 100% null; 0 distinct.
