        - actor_id: 77
          first_name: CARY
          last_name: MCCONAUGHEY
          last_update: '2021-03-06 15:51:59'
        - actor_id: 48
          first_name: FRANCES
          last_name: DAY-LEWIS
          last_update: '2021-03-06 15:51:59'
        - actor_id: 123
