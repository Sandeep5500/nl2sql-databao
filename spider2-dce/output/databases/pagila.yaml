          nullable: false
          description: A non-nullable integer column representing the identifier of
            a city, linked to the city table via a foreign key. [Profile] never null;
            599 distinct; range 1 to 600.
        - name: postal_code
          type: VARCHAR(10)
          nullable: true
          description: 'The `postal_code` column stores optional postal code or ZIP
            code information as a string with a maximum length of 10 characters. It
            allows null values and is used when retrieving postal code data, unlike
            `district`, which holds administrative or geographic district names. For
            example, "35200" might appear in `postal_code`, while `district` might
            be left empty or contain a district name. [Profile] 0.7% null; 596 distinct;
