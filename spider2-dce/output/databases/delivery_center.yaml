datasource_id: databases/delivery_center.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: channels
        columns:
        - name: channel_id
          type: INTEGER
          nullable: false
          description: channel_id is an integer column that uniquely identifies each
            channel and cannot be null. [Profile] never null; 40 distinct (unique
            per row); range 1 to 49.
        - name: channel_name
          type: VARCHAR(50)
          nullable: true
          description: A column storing the specific name of a channel, with a maximum
            length of 50 characters. It allows null values and is distinct from `channel_type`,
            which categorizes the kind of channel. For example, `channel_name` might
            hold values like "PHONE PLACE", while `channel_type` might hold "MARKETPLACE".
            [Profile] never null; 40 distinct (unique per row).
        - name: channel_type
          type: VARCHAR(50)
          nullable: true
          description: 'A column storing the category or type of a channel, with a
            maximum length of 50 characters. It allows null values and is distinct
            from `channel_name`, which provides the specific name of the channel.
            For example, `channel_type` might hold "MARKETPLACE", while `channel_name`
            might hold "PHONE PLACE". [Profile] never null; 2 distinct; all values:
            MARKETPLACE (26), OWN CHANNEL (14).'
        samples:
        - channel_id: 41
          channel_name: PANCEPS PLACE
          channel_type: MARKETPLACE
        - channel_id: 48
          channel_name: CENTER PLACE
          channel_type: MARKETPLACE
        - channel_id: 34
          channel_name: AHORA PLACE
          channel_type: MARKETPLACE
        - channel_id: 24
          channel_name: FULL PLACE
          channel_type: MARKETPLACE
        - channel_id: 10
          channel_name: LISBON PLACE
          channel_type: OWN CHANNEL
        description: 'A table containing information about different channels, including
          their unique ID, name, and type. It is primarily keyed on channel_id. [Structure]
          40 rows. Grain: one row per (channel_id). Referenced by: orders.channel_id.'
        kind: table
        primary_key:
          name: pk_channels
          columns:
          - channel_id
          validated: true
      - name: deliveries
        columns:
        - name: delivery_id
          type: INTEGER
          nullable: false
          description: Unique identifier for a delivery, stored as an integer. Unlike
            `delivery_order_id`, this column always contains a non-null value and
            is used to uniquely identify a delivery record in the `deliveries` table.
            [Profile] never null; 378843 distinct (unique per row); range 2174658
            to 3144739.
        - name: delivery_order_id
          type: INTEGER
          nullable: true
          description: The `delivery_order_id` column stores the unique identifier
            of an order associated with a delivery, as an integer value. It is nullable,
            meaning a delivery may not always be linked to an order. This column differs
            from `delivery_id`, which is a non-null unique identifier for the delivery
            itself. For example, a delivery with `delivery_id` 2174658 may be associated
            with an order having `delivery_order_id` 68413340. [Profile] joins to
            orders.delivery_order_id (N:1, 100% of values match); never null; 358654
            distinct; range 68409030 to 93139817.
        - name: driver_id
          type: INTEGER
          nullable: true
          description: The `driver_id` column stores the unique identifier of the
            driver assigned to a delivery, with integer values that can be null. This
            column is used to associate a delivery with a specific driver, if one
            is assigned. [Profile] joins to drivers.driver_id (N:1, 100% of values
            match); 4.2% null; 4583 distinct; range 133 to 66459.
        - name: delivery_distance_meters
          type: DECIMAL(10, 2)
          nullable: true
          description: 'Represents the distance of a delivery in meters, stored as
            a decimal with up to 10 digits and 2 decimal places. This field is optional
            and may be null. [Profile] never null; 16477 distinct; most frequent:
            845 (424), 1559 (335), 427 (330), 1634 (320), 791 (314), 2285 (314), 1565
            (309), 1563 (304).'
        - name: delivery_status
          type: VARCHAR(50)
          nullable: true
          description: 'A column storing the status of a delivery, such as "DELIVERED,"
            with a maximum length of 50 characters. [Profile] never null; 3 distinct;
            all values: DELIVERED (371367), CANCELLED (7253), DELIVERING (223).'
        samples:
        - delivery_id: 2667795
          delivery_order_id: 83850717
          driver_id: 20500
          delivery_distance_meters: 1440
          delivery_status: DELIVERED
        - delivery_id: 2707671
          delivery_order_id: 84803166
          driver_id: 7033
          delivery_distance_meters: 6666
          delivery_status: DELIVERED
        - delivery_id: 3060247
          delivery_order_id: 92758496
          driver_id: 63322
          delivery_distance_meters: 2247
          delivery_status: DELIVERED
        - delivery_id: 3076267
          delivery_order_id: 93092301
          driver_id: 30933
          delivery_distance_meters: 672
          delivery_status: DELIVERED
        - delivery_id: 2829314
          delivery_order_id: 87410498
          driver_id: 5171
          delivery_distance_meters: 1932
          delivery_status: DELIVERED
        description: 'A table tracking delivery information, including delivery ID,
          order ID, driver ID, distance in meters, and delivery status. Each delivery
          is uniquely identified by a primary key, delivery_id. [Structure] 378843
          rows. Grain: one row per (delivery_id). Joins: delivery_order_id -> orders.delivery_order_id
          [N:1, 100%]; driver_id -> drivers.driver_id [N:1, 100%].'
        kind: table
        primary_key:
          name: pk_deliveries
          columns:
          - delivery_id
          validated: true
        foreign_keys:
        - name: inferred_fk_deliveries_0
          mapping:
          - from_column: delivery_order_id
            to_column: delivery_order_id
          referenced_table: main.orders
          enforced: false
          validated: false
          on_update: no action
          on_delete: no action
        - name: inferred_fk_deliveries_1
          mapping:
          - from_column: driver_id
            to_column: driver_id
          referenced_table: main.drivers
          enforced: false
          validated: false
          on_update: no action
          on_delete: no action
      - name: drivers
