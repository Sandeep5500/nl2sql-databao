datasource_id: databases/delivery_center.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: channels
        columns:
        - name: channel_id
          type: INTEGER
          nullable: false
          description: 'Values: integer 1 .. 49. The query result shows that channel_id
            42 exists in the channels table but not in the orders table.'
        - name: channel_name
          type: VARCHAR(50)
          nullable: true
          description: 'Values: text.'
        - name: channel_type
          type: VARCHAR(50)
          nullable: true
          description: 'Values: text; values: MARKETPLACE (26), OWN CHANNEL (14).
            The channels table contains channel_type values of ''MARKETPLACE'' and
            ''OWN CHANNEL'', with order counts ranging from 0 to 288723.'
        samples:
        - channel_id: 1
          channel_name: OTHER PLACE
          channel_type: OWN CHANNEL
        - channel_id: 2
          channel_name: PHONE PLACE
          channel_type: OWN CHANNEL
        - channel_id: 3
          channel_name: WHATS PLACE
          channel_type: OWN CHANNEL
        - channel_id: 4
          channel_name: FACE PLACE
          channel_type: OWN CHANNEL
        - channel_id: 5
          channel_name: FOOD PLACE
          channel_type: MARKETPLACE
        description: 'This table defines the sales channels (e.g., marketplace vs.
          own platform) through which orders are placed. Each row represents a distinct
          channel instance. primary key (declared): (channel_id) The query result
          shows that channel_id 42 exists in the channels table but not in the orders
          table. The query result shows 41 channels with order counts ranging from
          0 to 288,723, with ''FOOD PLACE'' having the highest count and ''OFF PLACE''
          having zero orders.'
        kind: table
        primary_key:
          name: pk_channels
          columns:
          - channel_id
          validated: true
      - name: deliveries
        columns:
        - name: delivery_id
          type: INTEGER
          nullable: false
          description: 'Values: integer 2174658 .. 3144739.'
        - name: delivery_order_id
          type: INTEGER
          nullable: true
          description: 'Values: integer 68409030 .. 93139817.'
        - name: driver_id
          type: INTEGER
          nullable: true
          description: 'Values: integer 133 .. 66459.'
        - name: delivery_distance_meters
          type: DECIMAL(10, 2)
          nullable: true
          description: 'Values: integer 0 .. 7251291.'
        - name: delivery_status
          type: VARCHAR(50)
          nullable: true
          description: 'Values: text; values: DELIVERED (371367), CANCELLED (7253),
            DELIVERING (223).'
        samples:
        - delivery_id: 2174658
          delivery_order_id: 68413340
          driver_id: 8378
          delivery_distance_meters: 5199
          delivery_status: DELIVERED
        - delivery_id: 2174660
          delivery_order_id: 68414309
          driver_id: 2473
          delivery_distance_meters: 410
          delivery_status: DELIVERED
        - delivery_id: 2174661
          delivery_order_id: 68416230
          driver_id: 7615
          delivery_distance_meters: 3784
          delivery_status: DELIVERED
        - delivery_id: 2174663
          delivery_order_id: 68412721
          driver_id: 8378
          delivery_distance_meters: 5714
          delivery_status: DELIVERED
        - delivery_id: 2174675
          delivery_order_id: 68414018
          driver_id: 10463
          delivery_distance_meters: 3746
          delivery_status: DELIVERED
        description: 'Each row records a delivery attempt for an order. A single order
          (delivery_order_id) can have multiple delivery rows if there were multiple
          attempts. 10,345 orders have delivery_order_id set but no delivery record.
          primary key (declared): (delivery_id) The query result shows 10,345 orders
          have no matching delivery row. In the deliveries table, all 7253 CANCELLED
          deliveries have a NULL driver_id.'
        kind: table
        primary_key:
          name: pk_deliveries
          columns:
          - delivery_id
          validated: true
      - name: drivers
        columns:
        - name: driver_id
          type: INTEGER
          nullable: false
          description: 'Values: integer 133 .. 66494.'
        - name: driver_modal
          type: VARCHAR(50)
          nullable: true
          description: 'Values: text; values: MOTOBOY (3222), BIKER (1602).'
        - name: driver_type
          type: VARCHAR(50)
          nullable: true
          description: 'Values: text; values: FREELANCE (3939), LOGISTIC OPERATOR
            (885). The drivers table contains 4,824 records with driver_type values
            of FREELANCE or LOGISTIC OPERATOR. There are 2,338 MOTOBOY FREELANCE,
            1,601 BIKER FREELANCE, 884 MOTOBOY LOGISTIC OPERATOR, and 1 BIKER LOGISTIC
            OPERATOR.'
        samples:
        - driver_id: 133
          driver_modal: MOTOBOY
          driver_type: LOGISTIC OPERATOR
        - driver_id: 138
          driver_modal: MOTOBOY
          driver_type: FREELANCE
        - driver_id: 140
          driver_modal: MOTOBOY
          driver_type: FREELANCE
        - driver_id: 143
          driver_modal: BIKER
          driver_type: FREELANCE
        - driver_id: 148
          driver_modal: MOTOBOY
          driver_type: FREELANCE
        description: 'Each row records a driver''s profile (modal and type). The table
          includes drivers who have never been assigned a delivery (241 of 4824 rows).
          primary key (declared): (driver_id) The deliveries table contains 15,886
          rows where driver_id is NULL. The query result shows a count of 241 drivers
          in the drivers table who are not present in the deliveries table with a
          non-null driver_id.'
        kind: table
        primary_key:
          name: pk_drivers
          columns:
          - driver_id
          validated: true
      - name: hubs
