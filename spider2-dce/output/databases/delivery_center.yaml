        description: A table containing payment records with details such as payment
          ID, order ID, amount, fee, method, and status. Each payment is uniquely
          identified by a payment ID.
        kind: table
        primary_key:
          name: pk_payments
          columns:
          - payment_id
          validated: true
      - name: stores
        columns:
        - name: store_id
          type: INTEGER
          nullable: false
          description: The `store_id` column is a required integer that uniquely identifies
            each store, distinct from `hub_id`, which optionally links a store to
            a hub. A query would use `store_id` to reference a specific store, while
            `hub_id` is used to associate a store with a hub. Sample values like `3`
            and `53` in `store_id` contrast with `2` and `3` in `hub_id`, illustrating
            the different ranges and purposes of these identifiers.
        - name: hub_id
          type: INTEGER
          nullable: true
          description: The `hub_id` column in the `stores` table is an optional integer
            field that associates a store with a hub, distinct from `store_id`, which
            uniquely identifies each store. A query would use `hub_id` to filter or
            group stores by their associated hub, while `store_id` is used to uniquely
            reference a specific store. Sample values like `2` and `3` in `hub_id`
            contrast with `3` and `53` in `store_id`, illustrating the different ranges
            and purposes of these identifiers.
        - name: store_name
          type: VARCHAR(50)
          nullable: true
          description: A column storing the name of the store, with a maximum length
            of 50 characters.
        - name: store_segment
          type: VARCHAR(50)
          nullable: true
          description: A column in the stores table that represents the category or
            type of the store, with a maximum length of 50 characters.
        - name: store_plan_price
          type: DECIMAL(10, 2)
          nullable: true
          description: The `store_plan_price` column stores the price of the store's
            plan as a decimal number with up to 10 digits, 2 of which are after the
            decimal point. It allows null values.
        - name: store_latitude
          type: DECIMAL(9, 6)
          nullable: true
          description: Store latitude coordinate with up to 9 digits, 6 of which can
            be after the decimal point.
        - name: store_longitude
          type: DECIMAL(9, 6)
          nullable: true
          description: Store longitude coordinate, stored as a decimal with up to
            9 digits, 6 of which after the decimal point.
