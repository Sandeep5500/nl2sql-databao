        description: The "orders" table contains order details including status, timestamps,
          amounts, and associated metrics, with a primary key on "order_id".
        kind: table
        primary_key:
          name: pk_orders
          columns:
          - order_id
          validated: true
      - name: payments
        columns:
        - name: payment_id
          type: INTEGER
          nullable: false
          description: The `payment_id` column is a unique identifier for each payment
            record. It differs from `payment_order_id`, which links a payment to an
            order and is not guaranteed to be unique or non-null. A query would use
            `payment_id` to reference a specific payment, whereas `payment_order_id`
            is used to associate a payment with an order (e.g., with sample values
            like 68410055).
        - name: payment_order_id
          type: INTEGER
          nullable: true
          description: The `payment_order_id` column stores an integer value representing
            the associated order for a payment. It is nullable, meaning a payment
            may not always be linked to an order. This column is distinct from `payment_id`,
            which uniquely identifies each payment record. A query would use `payment_order_id`
            to filter or join payments with their corresponding orders, while `payment_id`
            is used to uniquely reference individual payment records.
        - name: payment_amount
          type: DECIMAL(10, 2)
          nullable: true
          description: The `payment_amount` column stores the amount of each payment
            as a decimal value with up to 10 digits and 2 decimal places. It allows
            null values.
        - name: payment_fee
          type: DECIMAL(10, 2)
          nullable: true
          description: Represents the fee associated with a payment, stored as a decimal
            value with up to 10 digits and 2 decimal places. This field is optional.
        - name: payment_method
          type: VARCHAR(50)
          nullable: true
          description: A column storing the method used for the payment, such as "VOUCHER"
            or "ONLINE", with a maximum length of 50 characters.
        - name: payment_status
          type: VARCHAR(50)
          nullable: true
          description: The `payment_status` column stores the current status of a
            payment as a variable-length string, with examples including "PAID". It
            allows null values.
