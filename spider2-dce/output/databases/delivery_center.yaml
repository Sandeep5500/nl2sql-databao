        description: A table containing information about stores, including store
          identifiers, location data, and segment classification. Each store is uniquely
          identified by a store_id.
        kind: table
        primary_key:
          name: pk_stores
          columns:
          - store_id
          validated: true
      description: The main schema contains key tables such as channels, deliveries,
        drivers, hubs, orders, payments, and stores, forming the core structure of
        the default catalog.
    description: The default catalog contains a schema named "main" with tables for
      managing channels, deliveries, drivers, hubs, orders, payments, and stores,
      each with defined columns, data types, and sample records.
