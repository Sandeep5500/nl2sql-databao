            This column differs from `driver_type`, which categorizes the driver''s
            employment or operational status (e.g., "LOGISTIC OPERATOR" or "FREELANCE").
            [Profile] never null; 2 distinct; all values: MOTOBOY (3222), BIKER (1602).'
        - name: driver_type
          type: VARCHAR(50)
          nullable: true
          description: 'A column storing the employment or operational status of the
            driver, such as "LOGISTIC OPERATOR" or "FREELANCE," with a maximum length
            of 50 characters. This column differs from `driver_modal`, which describes
            the transportation mode used by the driver (e.g., "MOTOBOY" or "BIKER").
