datasource_id: databases/stacking.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: eda
        columns:
        - name: name
          type: TEXT
          nullable: true
          description: 'Values: text.'
        - name: version
          type: INTEGER
          nullable: true
          description: 'Values: integer 1 .. 8; values: 1 (321), 2 (321), 3 (321),
            4 (235), 5 (213), 6 (91), 7 (38), 8 (7). For the ''iris'' dataset, versions
            1 through 5 contain features named ''petal_length'', ''petal_width'',
            ''sepal_length'', ''sepal_width'', and ''variety'', while versions 6 and
            7 contain ''Id'', ''PetalLengthCm'', ''PetalWidthCm'', ''SepalLengthCm'',
            ''SepalWidthCm'', and ''Species''. The ''Id'' feature appears in versions
            6 and 7 with drop_user=1, and the ''variety'' feature in versions 1-5
            and ''Species'' in versions 6-7 have drop_correlation=1.'
        - name: feature
          type: TEXT
          nullable: true
          description: 'Values: text. In versions 1-5, the feature names are petal_length,
            petal_width, sepal_length, sepal_width, and variety, while in versions
            6-7, they are Id, PetalLengthCm, PetalWidthCm, SepalLengthCm, SepalWidthCm,
            and Species. The feature variety in versions 1-5 and Species in versions
            6-7 have target=1, whereas Id in versions 6-7 has drop_user=1.'
        - name: type
          type: TEXT
          nullable: true
          description: 'Values: text; values: num (1036), cat (205). The ''type''
            column contains ''num'' for features like petal_length and sepal_width,
            while the ''variety'' feature in versions 1-5 and ''Id''/''Species'' in
            versions 6-7 have NULL values in the ''type'' column.'
        - name: range
          type: BLOB
          nullable: true
          description: 'Values: text. The ''range'' column contains string values
            like "[1.0, 6.9]" for features of type ''num'' and is empty for features
            of type ''variety'' or ''Id''.'
        - name: drop_user
          type: INTEGER
          nullable: true
          description: 'Values: integer 0 .. 1; values: 0 (1342), 1 (205). The drop_user
            column contains only 0 or 1. For versions 1-5, all features have drop_user
            0. For versions 6-7, the Id feature has drop_user 1, while all other features
            have drop_user 0.'
        - name: drop_correlation
          type: INTEGER
          nullable: true
          description: 'Values: integer 0 .. 1; values: 0 (1396), 1 (151). In the
            eda table, the drop_correlation column contains values 0 or 1. For features
            petal_length, petal_width, PetalLengthCm, and PetalWidthCm, drop_correlation
            is 1. For features sepal_length, sepal_width, SepalLengthCm, and SepalWidthCm,
            drop_correlation is 0.'
        - name: target
          type: INTEGER
          nullable: true
          description: 'Values: integer 0 .. 1; values: 0 (1446), 1 (101). In the
            eda table, the feature ''variety'' has target=1 for versions 1 through
            5, while ''Species'' has target=1 for versions 6 and 7. All other listed
            features have target=0.'
        samples:
        - name: iris
          version: 1
          feature: sepal_length
          type: num
          range: '[4.3, 7.9]'
          drop_user: 0
          drop_correlation: 0
          target: 0
        - name: iris
          version: 1
          feature: sepal_width
          type: num
          range: '[2.0, 4.4]'
          drop_user: 0
          drop_correlation: 0
          target: 0
        - name: iris
          version: 1
          feature: petal_length
          type: num
          range: '[1.0, 6.9]'
          drop_user: 0
          drop_correlation: 1
          target: 0
        - name: iris
          version: 1
          feature: petal_width
          type: num
          range: '[0.1, 2.5]'
          drop_user: 0
          drop_correlation: 1
          target: 0
        - name: iris
          version: 1
          feature: variety
          drop_user: 0
          drop_correlation: 0
          target: 1
        description: The tables record one row per feature for a specific dataset
          (name) and version, including its type, value range, and flags for whether
          it should be dropped by user choice or due to high correlation with the
          target. The same feature set is repeated across versions, but feature names
          and the target column can change between versions. one row per (name, version,
          feature) — A feature's metadata and EDA flags for a specific dataset version  [no
          declared key; proposed by an LLM and verified unique in the data] The table
          contains 7 versions of the iris dataset. Versions 1 through 5 use feature
          names petal_length, petal_width, sepal_length, sepal_width, and variety,
          while versions 6 and 7 use Id, PetalLengthCm, PetalWidthCm, SepalLengthCm,
          SepalWidthCm, and Species. The 'range' column contains text values such
          as "[1.0, 6.9]". The 'variety' column has no 'range' values for versions
          1 through 5, and the 'Id' and 'Species' columns have no 'range' values for
          versions 6 and 7.
        kind: table
      - name: feature_importance
        columns:
        - name: name
          type: TEXT
          nullable: true
          description: 'Values: text. The feature_importance table contains 20 distinct
            name values: Critical Heat Flux, Delaney solubility, Franck-Hertz, Hospital
            Mortality Prediction, Liver disease prediction, PCOS, PSS3E5, Pumpkin
            Seeds, Solar Power Generation, Tunnel diode, concrete, diabetes, iris,
            kindey stone urine analysis, lithium ion batteries, oil spill, smoke detection
            iot, survey lung cancer, water quality, and water quality 2.'
        - name: version
          type: INTEGER
          nullable: true
          description: 'Values: integer 1 .. 8; values: 2 (590), 1 (586), 3 (586),
            4 (454), 5 (409), 6 (169), 7 (78), 8 (15).'
        - name: step
          type: INTEGER
          nullable: true
          description: 'Values: integer 1 .. 3; values: 1 (1241), 2 (1241), 3 (405).
            The step column in the feature_importance table contains the distinct
            values 1, 2, and 3.'
        - name: feature
          type: TEXT
          nullable: true
          description: 'Values: text.'
        - name: importance
          type: NUMERIC
          nullable: true
          description: 'Values: decimal -4.7143 .. 3.4286.'
        samples:
        - name: iris
          version: 1
          step: 1
          feature: petal_length
          importance: 0
        - name: iris
          version: 1
          step: 1
          feature: petal_width
          importance: 0
        - name: iris
          version: 1
          step: 1
          feature: sepal_width
          importance: 0.28125
        - name: iris
          version: 1
          step: 1
          feature: sepal_length
          importance: 0.7187499999999999
        - name: iris
          version: 1
          step: 2
          feature: petal_length
          importance: 0
        description: One row records the importance score of a specific feature for
          a given problem (name), model version (version), and step (step). one row
          per (name, version, step, feature) — the importance score of a specific
          feature for a given model version and step  [no declared key; proposed by
          an LLM and verified unique in the data] The feature_importance table contains
          varying counts of features per (name, version, step) combination, with values
          such as 7, 5, 4, and 3 observed in the sample data. The 'step' column in
          the 'feature_importance' table contains the distinct values 1, 2, and 3.
        kind: table
      - name: model
        columns:
        - name: name
          type: TEXT
          nullable: true
          description: 'Values: text.'
        - name: version
          type: INTEGER
          nullable: true
          description: 'Values: integer 1 .. 8; values: 1 (60), 2 (60), 3 (60), 4
            (48), 5 (42), 6 (18), 7 (12), 8 (3).'
        - name: step
          type: INTEGER
          nullable: true
          description: 'Values: integer 1 .. 3; values: 1 (101), 2 (101), 3 (101).'
        - name: L1_model
          type: TEXT
          nullable: true
          description: 'Values: text; values: regression (213), tree (90). The L1_model
            column in the model table contains the values ''regression'' and ''tree''.'
        samples:
        - name: iris
          version: 1
          step: 1
          l1_model: regression
        - name: iris
          version: 1
          step: 2
          l1_model: regression
        - name: iris
          version: 1
          step: 3
          l1_model: regression
        - name: iris
          version: 2
          step: 1
          l1_model: regression
        - name: iris
          version: 2
          step: 2
          l1_model: regression
        description: One row records the L1 model type (regression or tree) used for
          a specific step (1, 2, or 3) of an experiment version for a given problem
          name. This table links model configurations to experiments via (name, version),
          where name matches problem.name and version matches solution.version. one
          row per (name, version, step) — the model type used at a specific step of
          an experiment version  [no declared key; proposed by an LLM and verified
          unique in the data]
        kind: table
      - name: model_importance
        columns:
        - name: name
          type: TEXT
          nullable: true
          description: 'Values: text.'
        - name: version
          type: INTEGER
          nullable: true
          description: 'Values: integer 1 .. 8; values: 1 (537), 3 (518), 2 (477),
            4 (377), 5 (351), 6 (172), 7 (107), 8 (28).'
        - name: step
          type: INTEGER
          nullable: true
          description: 'Values: integer 1 .. 3; values: 1 (1661), 3 (454), 2 (452).'
        - name: model
          type: TEXT
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): A 93% e.g.
            ''ABC'', A9 7% e.g. ''MLPC1''.'
        - name: importance
          type: NUMERIC
          nullable: true
          description: 'Values: decimal 0.0 .. 1.0. The sum of importance values for
            each (name, version, step) group in the model_importance table is approximately
            1.0, with specific deviations such as 0.9999999999999999 and 1.0000000000000002
            observed in the results.'
        samples:
        - name: iris
          version: 1
          step: 1
          model: LOGRSCV
          importance: 0.0027022443424496926
        - name: iris
          version: 1
          step: 1
          model: LOGRLCV
          importance: 0.0027583162720716957
        - name: iris
          version: 1
          step: 1
          model: MLPC1
          importance: 0.0076949449019090045
        - name: iris
          version: 1
          step: 1
          model: DTCG
          importance: 0.027860703756201175
        - name: iris
          version: 1
          step: 1
          model: DTCE
          importance: 0.04369120479319936
        description: The table model_importance records one row per feature importance
          score for a specific model within a dataset (name), version, and step. The
          importance values for all models in a given (name, version, step) group
          sum to 1.0. one row per (name, version, step, model) — feature importance
          score for a specific model in a dataset version and step  [no declared key;
          proposed by an LLM and verified unique in the data] The model_importance
          table contains 303 rows grouped by (name, version, step), with model counts
          ranging from 2 to 19.
        kind: table
      - name: model_score
        columns:
        - name: name
          type: TEXT
          nullable: true
          description: 'Values: text.'
        - name: version
          type: INTEGER
          nullable: true
          description: 'Values: integer 1 .. 8; values: 1 (597), 3 (578), 2 (537),
            4 (425), 5 (395), 6 (190), 7 (119), 8 (31).'
        - name: step
          type: INTEGER
          nullable: true
          description: 'Values: integer 1 .. 3; values: 1 (1762), 2 (555), 3 (555).'
        - name: model
          type: TEXT
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): A 94% e.g.
            ''ABC'', A9 6% e.g. ''MLPC1''.'
        - name: train_score
          type: NUMERIC
          nullable: true
          description: 'Values: decimal -85292809.8023 .. 1.0.'
        - name: test_score
          type: NUMERIC
          nullable: true
          description: 'Values: decimal -65597190.8646 .. 1.0.'
        samples:
        - name: iris
          version: 1
          step: 1
          model: DTCG
          train_score: 0.96
          test_score: 0.66
        - name: iris
          version: 1
          step: 1
          model: DTCE
          train_score: 0.96
          test_score: 0.74
        - name: iris
          version: 1
          step: 1
