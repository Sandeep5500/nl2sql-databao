          nullable: true
          description: 'Values: decimal 0.29 .. 0.33; values: 0.33 (90), 0.29 (10),
            0.3 (1). The query result shows 12 rows where the test_size column has
            a value of 0.33.'
        - name: resampling
          type: INTEGER
          nullable: true
          description: 'Values: integer 0 .. 1; values: 0 (75), 1 (26). The query
