datasource_id: databases/stacking.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: eda
        columns:
        - name: name
          type: TEXT
          nullable: true
          description: A column representing a name, stored as text and allowing null values.
        - name: version
          type: INTEGER
          nullable: true
          description: version is an integer column that represents the version of the data entry, with some values allowed
            to be null.
        - name: feature
          type: TEXT
          nullable: true
          description: 'A column named ''feature'' of type TEXT that can contain null values. Known sample values: ''sepal_length'',
            ''sepal_width'', ''petal_length'', ''petal_width'', ''variety''.'
        - name: type
          type: TEXT
          nullable: true
          description: 'The column "type" in the eda table contains text values and allows null entries. Known sample values:
            ''num''.'
        - name: range
          type: BLOB
          nullable: true
          description: The `range` column stores BLOB data representing the range of values for a feature, such as '[4.3,
            7.9]'.
        - name: drop_user
          type: INTEGER
          nullable: true
          description: Column "drop_user" indicates whether a feature was dropped by the user, with 0 meaning not dropped
            and values potentially representing different statuses.
        - name: drop_correlation
          type: INTEGER
          nullable: true
          description: drop_correlation is an integer column indicating whether a feature was dropped due to correlation.
        - name: target
          type: INTEGER
          nullable: true
          description: The `target` column is an integer column that indicates whether a feature is used as a target variable,
            with 1 representing the target and 0 indicating it is not.
        samples:
        - name: iris
          version: 1
          feature: sepal_length
          type: num
          range: '[4.3, 7.9]'
          drop_user: 0
          drop_correlation: 0
          target: 0
        - name: iris
          version: 1
          feature: sepal_width
          type: num
          range: '[2.0, 4.4]'
          drop_user: 0
          drop_correlation: 0
          target: 0
        - name: iris
          version: 1
          feature: petal_length
          type: num
          range: '[1.0, 6.9]'
          drop_user: 0
          drop_correlation: 1
          target: 0
        - name: iris
          version: 1
          feature: petal_width
          type: num
          range: '[0.1, 2.5]'
          drop_user: 0
          drop_correlation: 1
          target: 0
        - name: iris
          version: 1
          feature: variety
          drop_user: 0
          drop_correlation: 0
          target: 1
        description: The `eda` table contains exploratory data analysis metadata, including feature names, types, ranges,
          and flags for dropping features due to user input or correlation. It is structured to support data preprocessing
          and feature selection workflows.
        kind: table
      - name: feature_importance
        columns:
        - name: name
          type: TEXT
          nullable: true
          description: A column named 'name' of type TEXT that allows null values.
        - name: version
          type: INTEGER
          nullable: true
          description: version is an integer column that stores the version number associated with each record, and it allows
            null values.
        - name: step
          type: INTEGER
          nullable: true
          description: A nullable integer column representing the step number associated with the feature importance data.
        - name: feature
          type: TEXT
          nullable: true
          description: 'The `feature` column stores the name of the feature, represented as text, and allows null values.
            Known sample values: ''petal_length'', ''petal_width'', ''sepal_width'', ''sepal_length''.'
        - name: importance
          type: NUMERIC
          nullable: true
          description: A numeric column representing the importance score of a feature, which can contain null values.
        samples:
        - name: iris
          version: 1
          step: 1
          feature: petal_length
          importance: 0
        - name: iris
          version: 1
          step: 1
          feature: petal_width
          importance: 0
        - name: iris
          version: 1
          step: 1
          feature: sepal_width
          importance: 0.28125
        - name: iris
          version: 1
          step: 1
          feature: sepal_length
          importance: 0.7187499999999999
        - name: iris
          version: 1
          step: 2
          feature: petal_length
          importance: 0
        description: The `feature_importance` table stores information about the importance of features in a machine learning
          model, including the model name, version, step, feature name, and importance score.
        kind: table
      - name: model
        columns:
        - name: name
          type: TEXT
          nullable: true
          description: A column named 'name' of type TEXT that allows null values.
        - name: version
          type: INTEGER
          nullable: true
          description: A nullable integer column representing the version of the model.
        - name: step
          type: INTEGER
          nullable: true
          description: The `step` column represents an integer value indicating the step associated with a model entry.
        - name: L1_model
          type: TEXT
          nullable: true
          description: The L1_model column stores text values representing the type of model used, such as "regression". It
            allows null values.
        samples:
        - name: iris
          version: 1
          step: 1
          l1_model: regression
        - name: iris
          version: 1
          step: 2
          l1_model: regression
        - name: iris
          version: 1
          step: 3
          l1_model: regression
        - name: iris
          version: 2
          step: 1
          l1_model: regression
        - name: iris
          version: 2
          step: 2
          l1_model: regression
        description: A table containing model metadata, including name, version, step, and L1 model type, typically used to
          track different iterations and configurations of machine learning models.
        kind: table
      - name: model_importance
        columns:
        - name: name
          type: TEXT
          nullable: true
          description: The `name` column stores text values and can contain null entries.
        - name: version
          type: INTEGER
          nullable: true
          description: version is an integer column that stores the version number associated with each record, and it allows
            null values.
        - name: step
          type: INTEGER
          nullable: true
          description: The `step` column represents an integer value indicating the step number associated with each model
            importance record.
        - name: model
          type: TEXT
          nullable: true
          description: 'The `model` column contains text values representing different machine learning models, such as "LOGRSCV"
            and "DTCG". Known sample values: ''LOGRSCV'', ''LOGRLCV'', ''MLPC1'', ''DTCG'', ''DTCE''.'
        - name: importance
          type: NUMERIC
          nullable: true
          description: The `importance` column stores numeric values representing the importance score of a model, with support
            for null values.
        samples:
        - name: iris
          version: 1
          step: 1
          model: LOGRSCV
          importance: 0.0027022443424496926
        - name: iris
          version: 1
          step: 1
          model: LOGRLCV
          importance: 0.0027583162720716957
        - name: iris
          version: 1
          step: 1
          model: MLPC1
          importance: 0.0076949449019090045
        - name: iris
          version: 1
          step: 1
          model: DTCG
          importance: 0.027860703756201175
        - name: iris
          version: 1
          step: 1
          model: DTCE
          importance: 0.04369120479319936
        description: The `model_importance` table stores information about the importance scores of different models, including
          the model name, version, step, and numeric importance values. It is used to track model performance metrics across
          various configurations.
        kind: table
      - name: model_score
        columns:
        - name: name
          type: TEXT
          nullable: true
          description: A column named 'name' of type TEXT that can contain null values.
        - name: version
          type: INTEGER
          nullable: true
          description: A column named 'version' of type INTEGER, which can contain null values.
        - name: step
          type: INTEGER
          nullable: true
          description: The `step` column represents an integer value indicating the training step or iteration associated
            with the model score.
        - name: model
          type: TEXT
          nullable: true
          description: 'Model identifier as text. Known sample values: ''DTCG'', ''DTCE'', ''RFCG'', ''RFCE'', ''ABC''.'
        - name: train_score
          type: NUMERIC
          nullable: true
          description: train_score is a numeric column that stores the training score of a model, and it allows null values.
        - name: test_score
          type: NUMERIC
          nullable: true
          description: test_score is a numeric column that stores the test score values, which can be null.
        samples:
        - name: iris
          version: 1
          step: 1
          model: DTCG
          train_score: 0.96
          test_score: 0.66
        - name: iris
          version: 1
          step: 1
          model: DTCE
          train_score: 0.96
          test_score: 0.74
        - name: iris
          version: 1
          step: 1
          model: RFCG
          train_score: 0.96
          test_score: 0.74
        - name: iris
          version: 1
          step: 1
          model: RFCE
          train_score: 0.96
          test_score: 0.74
        - name: iris
          version: 1
          step: 1
          model: ABC
          train_score: 0.74
          test_score: 0.74
        description: A table containing model evaluation scores for different machine learning models, including training
          and test scores.
        kind: table
      - name: problem
        columns:
        - name: name
          type: TEXT
          nullable: false
          description: The column 'name' contains non-nullable text representing the identifier for each problem entry in
            the table.
        - name: path
          type: TEXT
          nullable: true
          description: The `path` column stores a text reference to the dataset's source location and can contain null values.
        - name: type
          type: TEXT
          nullable: true
          description: 'The column "type" in the "problem" table stores text values and can contain NULL entries. Known sample
            values: ''classification'', ''regression''.'
        - name: target
          type: TEXT
          nullable: true
          description: 'The `target` column stores the name of the target variable in the dataset, used for prediction or
            analysis. It is a nullable text field. Known sample values: ''variety'', ''Concrete compressive strength(MPa,
            megapascals)'', ''logS'', ''chf_exp [MW/m2]'', ''Dataset''.'
        samples:
        - name: iris
          path: https://www.kaggle.com/datasets/uciml/iris
          type: classification
          target: variety
        - name: concrete
          path: https://www.kaggle.com/datasets/prathamtripathi/regression-with-neural-networking
          type: regression
          target: 'Concrete compressive strength(MPa, megapascals) '
        - name: Delaney solubility
          path: https://www.kaggle.com/datasets/prashanthbairu/delaney-solubility-with-descriptors
          type: regression
          target: logS
        - name: Critical Heat Flux
          path: https://www.kaggle.com/datasets/saurabhshahane/predicting-heat-flux
          type: regression
          target: chf_exp [MW/m2]
        - name: Liver disease prediction
          path: https://www.kaggle.com/datasets/uciml/indian-liver-patient-records
          type: classification
          target: Dataset
        description: A table containing information about different machine learning problems, including their name, data
          source path, problem type (classification or regression), and target variable. Each problem is uniquely identified
          by its name.
        kind: table
        primary_key:
          name: pk_problem
          columns:
          - name
          validated: true
      - name: solution
        columns:
        - name: name
          type: TEXT
          nullable: true
          description: A column named 'name' of type TEXT that can contain null values.
        - name: version
          type: INTEGER
          nullable: true
          description: A column representing the version number associated with each solution entry.
        - name: correlation
          type: NUMERIC
          nullable: true
          description: A numeric column representing the correlation value, which can be null.
        - name: nb_model
          type: INTEGER
          nullable: true
          description: The `nb_model` column represents the number of models used, with integer values and nullable entries.
        - name: nb_feature
          type: INTEGER
          nullable: true
          description: The `nb_feature` column represents the number of features used in a machine learning model, with integer
            values and nullable entries.
        - name: score
          type: NUMERIC
          nullable: true
          description: A numeric column representing the score associated with each solution, which can contain null values.
        - name: test_size
          type: NUMERIC
          nullable: true
          description: The `test_size` column represents the proportion of the dataset used for testing, stored as a numeric
            value. It is nullable and typically ranges between 0 and 1.
        - name: resampling
          type: INTEGER
          nullable: true
          description: The `resampling` column is an integer column with a default value of 0, indicating whether resampling
            is applied.
          default_expression: '0'
        samples:
        - name: iris
          version: 1
          correlation: 0.75
          nb_model: 5
          nb_feature: 5
          score: 0.7
          test_size: 0.33
          resampling: 0
        - name: iris
          version: 2
          correlation: 0.75
          nb_model: 2
          nb_feature: 5
          score: 0.7
          test_size: 0.33
          resampling: 0
        - name: iris
          version: 3
          correlation: 0.75
          nb_model: 2
          nb_feature: 5
          score: 0.7
          test_size: 0.33
          resampling: 0
        - name: concrete
          version: 1
          correlation: 0.75
          nb_model: 5
          nb_feature: 5
          score: 0.7
          test_size: 0.33
          resampling: 0
        - name: concrete
          version: 2
          correlation: 0.75
          nb_model: 3
          nb_feature: 3
          score: 0.7
          test_size: 0.33
          resampling: 0
        description: A table containing information about different data solutions, including name, version, correlation,
          number of models, number of features, score, test size, and resampling method.
        kind: table
      - name: solution_ext
        columns:
        - name: name
          type: TEXT
          nullable: true
          description: The column "name" in the solution_ext table stores text values and allows null entries.
        - name: version
          type: INTEGER
          nullable: true
          description: A nullable integer column representing the version of the solution.
        - name: L1_model
          type: TEXT
          nullable: true
          description: The L1_model column contains text values indicating the type of model used, such as "regression" or
            "tree".
        samples:
        - name: Critical Heat Flux
          version: 1
          l1_model: regression
        - name: Critical Heat Flux
          version: 2
          l1_model: regression
        - name: Critical Heat Flux
          version: 3
          l1_model: tree
        - name: Critical Heat Flux
          version: 4
          l1_model: tree
        - name: Critical Heat Flux
          version: 5
          l1_model: regression
        description: A view containing information about different versions of solutions, including their name, version number,
          and associated L1 model type.
        kind: view
      - name: stack_ok
        columns:
        - name: name
          type: TEXT
          nullable: true
          description: A column named "name" of type TEXT that allows null values.
        - name: version
          type: INTEGER
          nullable: true
          description: version is an integer column that represents different iterations or releases of a model or process.
        - name: step
          type: INTEGER
          nullable: true
          description: The `step` column represents an integer value indicating a specific step in a process, and it can contain
            null values.
        - name: L1_model
          type: TEXT
          nullable: true
          description: A column named L1_model of type TEXT that can contain null values.
        - name: status
          type: ''
          nullable: true
          description: The "status" column is a nullable field with no specified data type, used to indicate the status of
            an entry, such as "strong."
        samples:
        - name: Critical Heat Flux
          version: 1
          step: 2
          l1_model: regression
          status: strong
        - name: Critical Heat Flux
          version: 1
          step: 3
          l1_model: regression
          status: strong
        - name: Critical Heat Flux
          version: 2
          step: 2
          l1_model: regression
          status: strong
        - name: Critical Heat Flux
          version: 2
          step: 3
          l1_model: regression
          status: strong
        - name: Critical Heat Flux
          version: 5
          step: 2
          l1_model: regression
          status: strong
        description: A view containing information about models, including their name, version, step, L1 model type, and status.
        kind: view
      - name: stack_ok_score
        columns:
        - name: name
          type: TEXT
          nullable: true
          description: The `name` column stores textual values representing the names of entries, such as "Critical Heat Flux"
            and "Delaney solubility." It allows null values.
        - name: version
          type: INTEGER
          nullable: true
          description: A nullable integer column representing the version number associated with each entry.
        - name: score_1
          type: NUMERIC
          nullable: true
          description: A numeric column representing a score, with values such as 0.8767667331999809.
        - name: score_2
          type: NUMERIC
          nullable: true
          description: score_2 is a numeric column that can contain null values, representing one of the scored metrics in
            the stack_ok_score view.
        - name: score_3
          type: NUMERIC
          nullable: true
          description: score_3 is a numeric column that can contain null values, representing one of three scores associated
            with each entry in the stack_ok_score table.
        samples:
        - name: Critical Heat Flux
          version: 1
          score_1: 0.8767667331999809
          score_2: 0.8860441283949297
          score_3: 0.8913847510635327
        - name: Critical Heat Flux
          version: 2
          score_1: 0.8767667331999809
          score_2: 0.8906124602518019
          score_3: 0.896051215319373
        - name: Critical Heat Flux
          version: 5
          score_1: 0.8767667331999809
          score_2: 0.902460663638466
          score_3: 0.8731034587804976
        - name: Delaney solubility
          version: 1
          score_1: 0.8603318218230251
          score_2: 0.8709068763294372
          score_3: 0.8709068763294372
        - name: Delaney solubility
          version: 2
          score_1: 0.8603318218230251
          score_2: 0.8676115461542331
          score_3: 0.8676115461542331
        description: A view containing scores related to various models or versions, with numeric performance metrics and
          optional text identifiers.
        kind: view
      description: The main schema contains tables related to data analysis, modeling, and evaluation, including eda, feature_importance,
        model, and solution components.
    description: The default catalog contains multiple schemas and tables used for data analysis, machine learning model tracking,
      and problem-solving workflows, including exploratory data analysis (EDA), feature importance, model performance, and
      problem definitions. It is structured to support datasets like Iris, Concrete, and others with associated metadata and
      metrics.
