          train_score: 0.74
          test_score: 0.74
        description: One row records the train and test scores for a specific model
          evaluated on a specific problem version at a specific step. one row per
          (name, version, step, model) — the train and test scores for a specific
          model on a specific problem version  [no declared key; proposed by an LLM
          and verified unique in the data]
        kind: table
      - name: problem
        columns:
        - name: name
          type: TEXT
          nullable: false
          description: 'Values: text.'
        - name: path
          type: TEXT
          nullable: true
          description: 'Values: text.'
        - name: type
          type: TEXT
          nullable: true
          description: 'Values: text; values: classification (14), regression (6).'
        - name: target
          type: TEXT
          nullable: true
          description: 'Values: text. The ''target'' column in the ''problem'' table
            contains 20 distinct values, including ''Class'', ''Crystal System'',
            ''Dataset'', ''Fire Alarm'', ''I'', ''LUNG_CANCER'', ''Outcome'', ''PCOS
            (Y/N)'', ''Power Generated'', ''Water_Quality'', ''chf_exp [MW/m2]'',
            ''is_safe'', ''logS'', ''outcome'', ''quality'', ''target'', ''variety'',
            and ''Concrete compressive strength(MPa, megapascals) ''.'
        samples:
        - name: iris
          path: https://www.kaggle.com/datasets/uciml/iris
          type: classification
          target: variety
        - name: concrete
          path: https://www.kaggle.com/datasets/prathamtripathi/regression-with-neural-networking
