    description: The default catalog contains multiple schemas and tables used for
      data analysis, machine learning model tracking, and problem-solving workflows,
      including exploratory data analysis (EDA), feature importance, model performance,
      and problem definitions. It is structured to support datasets like Iris, Concrete,
      and others with associated metadata and metrics.
