        description: 'Each row defines a machine learning problem with a unique name,
          a Kaggle dataset path, and whether it is a classification or regression
          task. The target column specifies the prediction goal, often including units
          or formatting details. primary key (declared): (name) The problem table
          contains entries such as ''Critical Heat Flux'' which have multiple corresponding
          rows in the eda table for features like ''id'', ''author'', and ''chf_exp
          [MW/m2]''. The eda table also contains entries for ''Delaney solubility'',
          ''Franck-Hertz'', and ''Hospital Mortality Prediction'' with features including
          ''logS'', ''I'', ''Lymphocyte'', ''ID'', ''INR'', ''RBC'', and ''MCV''.'
