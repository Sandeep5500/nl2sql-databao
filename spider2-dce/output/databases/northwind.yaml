        description: 'The table customergroupthreshold defines four customer spending
          tiers (Low, Medium, High, Very High) with contiguous, non-overlapping monetary
          ranges. Each row represents one tier''s lower and upper spending bounds.
          one row per (groupname) — a customer tier and its spending threshold range  [no
          declared key; proposed by an LLM and verified unique in the data] The column
          ''groupname'' exists in the ''customergroupthreshold'' table. The customergroupthreshold
