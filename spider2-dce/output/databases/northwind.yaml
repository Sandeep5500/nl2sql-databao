datasource_id: databases/northwind.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: categories
        columns:
        - name: categoryid
          type: INTEGER
          nullable: false
          description: A non-nullable integer column representing the unique identifier
            for each category.
        - name: categoryname
          type: TEXT
          nullable: false
          description: A non-nullable text column representing the name of the category.
        - name: description
          type: TEXT
          nullable: true
          description: A text field containing a brief description of the category,
            which can be left empty.
        - name: picture
          type: BLOB
          nullable: true
          description: The `picture` column stores binary data (BLOB) representing
            images for categories, and can contain null values.
        samples:
        - categoryid: 1
          categoryname: Beverages
          description: Soft drinks, coffees, teas, beers, and ales
          picture: \x
        - categoryid: 2
          categoryname: Condiments
          description: Sweet and savory sauces, relishes, spreads, and seasonings
          picture: \x
        - categoryid: 3
          categoryname: Confections
          description: Desserts, candies, and sweet breads
          picture: \x
        - categoryid: 4
          categoryname: Dairy Products
          description: Cheeses
          picture: \x
        - categoryid: 5
          categoryname: Grains/Cereals
          description: Breads, crackers, pasta, and cereal
          picture: \x
        description: A table containing category information with fields for category
          ID, name, description, and picture.
        kind: table
      - name: customercustomerdemo
        columns:
        - name: customerid
          type: TEXT
          nullable: false
          description: A non-nullable TEXT column named customerid.
        - name: customertypeid
          type: TEXT
          nullable: false
          description: A non-nullable TEXT column representing the customer type identifier.
        samples: []
        description: A table that links customers to their customer types using customer
          ID and customer type ID.
        kind: table
      - name: customerdemographics
        columns:
        - name: customertypeid
          type: TEXT
          nullable: false
          description: A non-nullable TEXT column named 'customertypeid' used to uniquely
            identify customer types.
        - name: customerdesc
          type: TEXT
          nullable: true
          description: A nullable text column named customerdesc in the customerdemographics
            table.
        samples: []
        description: A table containing customer demographic information, including
          customer type identifiers and optional descriptions.
        kind: table
      - name: customergroupthreshold
        columns:
        - name: groupname
          type: TEXT
          nullable: false
          description: A non-nullable text column representing the name of the customer
            group.
        - name: rangebottom
          type: DECIMAL
          nullable: false
          description: The `rangebottom` column defines the lower bound of a numeric
            spending range for customer groups, stored as a non-nullable decimal value.
            It works in conjunction with the `rangetop` column to define a full spending
            range. For example, a group might have a `rangebottom` of 0 and a `rangetop`
            of 999.9999.
        - name: rangetop
          type: DECIMAL
          nullable: false
          description: The `rangetop` column defines the upper bound of a numeric
            spending range for customer groups, stored as a non-nullable decimal value.
            It works in conjunction with the `rangebottom` column to define a full
            spending range. For example, a group might have a `rangebottom` of 0 and
            a `rangetop` of 999.9999.
        samples:
        - groupname: Low
          rangebottom: 0
          rangetop: 999.9999
        - groupname: Medium
          rangebottom: 1000
          rangetop: 4999.9999
        - groupname: High
          rangebottom: 5000
          rangetop: 9999.9999
        - groupname: Very High
          rangebottom: 10000
          rangetop: 922337203685477.6
        description: A table that defines customer group thresholds with a name, a
          lower bound (rangebottom), and an upper bound (rangetop) for each group.
        kind: table
      - name: customers
        columns:
        - name: customerid
          type: TEXT
          nullable: false
          description: Customer ID, a required text field uniquely identifying each
            customer.
        - name: companyname
          type: TEXT
          nullable: false
          description: The `companyname` column contains the name of the customer's
            company and is a required text field. It differs from `contactname`, which
            holds the name of the individual contact person, such as "Alfreds Futterkiste"
            versus "Maria Anders".
        - name: contactname
          type: TEXT
          nullable: true
          description: The `contactname` column stores the name of the contact person
            at the customer's company, and can contain null values. It differs from
            `companyname`, which holds the name of the organization itself, such as
            "Alfreds Futterkiste" versus "Maria Anders".
        - name: contacttitle
          type: TEXT
          nullable: true
          description: The `contacttitle` column stores the job title or role of the
            contact person at the customer company, such as "Sales Representative"
            or "Owner." It is a nullable text field.
        - name: address
          type: TEXT
          nullable: true
          description: The `address` column stores the physical address of the customer
            as text and can contain null values.
        - name: city
          type: TEXT
          nullable: true
          description: The `city` column stores the city name associated with a customer's
            address, and it can contain null values. It is part of the address hierarchy,
            typically used alongside `region` and `postalcode` to fully describe a
            location, such as "Berlin" for a city in Germany.
        - name: region
          type: TEXT
          nullable: true
          description: The `region` column stores textual region information for customer
            addresses and can contain null values.
        - name: postalcode
          type: TEXT
          nullable: true
          description: The `postalcode` column stores postal code information as text
            and can contain null values. It is often used in conjunction with `city`
            and `region` to identify a specific geographic area, such as "1220
        - name: country
          type: TEXT
          nullable: true
          description: The `country` column stores the country information for the
            customer's address, with a text data type that allows null values.
        - name: phone
          type: TEXT
          nullable: true
          description: The `phone` column stores the contact phone number for customers
            as text, and it can contain null values.
        - name: fax
          type: TEXT
          nullable: true
          description: The fax column stores the fax number of the customer, with
            text data type and allows null values.
