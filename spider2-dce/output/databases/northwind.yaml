          quantity: 9
          discount: 0.0
        - orderid: 10249
          productid: 51
          unitprice: 42.4000015
          quantity: 40
          discount: 0.0
        description: The order_details table contains information about individual
          items within orders, including order ID, product ID, unit price, quantity,
          and discount. Each row represents a product ordered as part of a specific
          order.
        kind: table
      - name: orders
        columns:
        - name: orderid
          type: INTEGER
          nullable: false
          description: The `orderid` column is an integer that uniquely identifies
            each order and cannot be null.
        - name: customerid
          type: TEXT
          nullable: true
          description: customerid is a nullable TEXT column representing the identifier
            for the customer associated with an order.
        - name: employeeid
          type: INTEGER
          nullable: true
          description: The `employeeid` column represents the identifier for the employee
            associated with the order, with a data type of INTEGER and allows NULL
            values.
        - name: orderdate
          type: DATE
          nullable: true
          description: orderdate is a DATE column that stores the date an order was
            placed. It allows NULL values.
        - name: requireddate
          type: DATE
          nullable: true
          description: The `requireddate` column stores the date by which an order
            is required, with nullable DATE values.
        - name: shippeddate
          type: DATE
          nullable: true
          description: The `shippeddate` column stores the date when an order was
            shipped, with nullable DATE values indicating the shipment date may not
            be available for all records.
        - name: shipvia
          type: INTEGER
          nullable: true
          description: The `shipvia` column represents the shipping company used for
            the order, identified by an integer value.
        - name: freight
          type: REAL
          nullable: true
          description: The `freight` column stores the shipping cost as a real number
            and can contain null values.
        - name: shipname
          type: TEXT
          nullable: true
          description: The `shipname` column contains the name of the shipping company
            or recipient for the order, as a text value. It is nullable and differs
            from `shipaddress` in that it typically holds the name (e.g., "Vins et
            alcools Chevalier") rather than the full address (e.g., "59 rue de l'Abbaye").
        - name: shipaddress
          type: TEXT
          nullable: true
          description: The `shipaddress` column contains the full street address for
            the shipping location, as a text string. It is nullable and differs from
            `shipname` in that it typically holds the address (e.g., "59 rue de l'Abbaye")
            rather than the name (e.g., "Vins et alcools Chevalier").
        - name: shipcity
          type: TEXT
          nullable: true
          description: The `shipcity` column contains the city portion of the shipping
            address, as a text value. It is nullable and is typically used in conjunction
            with `shipregion` and `shippostalcode` to fully specify the shipping location.
        - name: shipregion
          type: TEXT
          nullable: true
          description: The `shipregion` column contains the region portion of the
            shipping address, such as a state
        - name: shippostalcode
          type: TEXT
          nullable: true
          description: The `shippostalcode` column stores the postal code for the
            shipping address as text and can contain null values.
        - name: shipcountry
          type: TEXT
          nullable: true
          description: The `shipcountry` column stores the destination country for
            shipping, as text, and can contain null values.
