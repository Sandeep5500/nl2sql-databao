      - name: order_details
        columns:
        - name: orderid
          type: INTEGER
          nullable: false
          description: The `orderid` column is an integer that uniquely identifies
            an order in the `order_details` table and cannot be null. It is distinct
            from `productid`, which uniquely identifies a product. A query would use
            `orderid` to retrieve all items in a specific order, such as order 10248.
        - name: productid
          type: INTEGER
          nullable: false
          description: The `productid` column is an integer that uniquely identifies
            a product in the `order_details` table and cannot be null. It is distinct
            from `orderid`, which uniquely identifies an order. A query would use
            `productid` to retrieve all orders containing a specific product, such
            as product 11.
        - name: unitprice
          type: REAL
          nullable: false
          description: The `unitprice` column is a non-nullable REAL column representing
            the price per unit of a product in an order. It differs from `quantity`
            in that it reflects the cost per item rather than the number of items.
            For example, a unitprice of 14.0 might be applied to a quantity of 12.
        - name: quantity
          type: INTEGER
          nullable: false
          description: The `quantity` column is an integer that represents the number
            of units of a product
        - name: discount
          type: REAL
          nullable: false
          description: The `discount` column stores the discount applied to an order
            item as a real number and cannot be null.
        samples:
        - orderid: 10248
          productid: 11
          unitprice: 14.0
          quantity: 12
          discount: 0.0
        - orderid: 10248
          productid: 42
          unitprice: 9.80000019
          quantity: 10
          discount: 0.0
        - orderid: 10248
          productid: 72
          unitprice: 34.7999992
          quantity: 5
          discount: 0.0
        - orderid: 10249
