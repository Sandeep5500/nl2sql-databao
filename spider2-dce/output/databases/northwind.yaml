      - name: products
        columns:
        - name: productid
          type: INTEGER
          nullable: false
          description: Product ID is an integer column that uniquely identifies each
            product and cannot be null.
        - name: productname
          type: TEXT
          nullable: false
          description: Product name, a required text field identifying the product.
        - name: supplierid
          type: INTEGER
          nullable: true
          description: The `supplierid` column is an optional integer column representing
            the identifier for the product's supplier. It is related to the `categoryid`
            column, which instead identifies the category to which a product belongs.
            For example, a product might have a `supplierid` of 8 while having a `categoryid`
            of 1.
        - name: categoryid
          type: INTEGER
          nullable: true
          description: The `categoryid` column is an optional integer field that identifies
            the category to which a product belongs. It is related to the `supplierid`
            column, which instead identifies the product's supplier. For example,
            a product might have a `supplierid` of 8 while having a `categoryid` of
            1.
        - name: quantityperunit
          type: TEXT
          nullable: true
          description: Describes the quantity and packaging details of the product,
            such as "10 boxes x 30 bags" or "24 - 12 oz bottles."
        - name: unitprice
          type: REAL
          nullable: true
          description: The `unitprice` column stores the price per unit of a product
            as a real number and can contain null values.
        - name: unitsinstock
          type: INTEGER
          nullable: true
          description: The `unitsinst
        - name: unitsonorder
          type: INTEGER
          nullable: true
          description: The `unitsonorder` column represents the number of units currently
            on order for a product, and it can contain null values. It differs from
            the `unitsinstock` column, which represents the number of units currently
            in stock. For example, a product might have `unitsinstock` of 39 and `unitsonorder`
            of 0.
        - name: reorderlevel
          type: INTEGER
          nullable: true
          description: The reorderlevel column indicates the stock level at which
            a product should be reordered, and it is an optional integer value.
        - name: discontinued
          type: INTEGER
          nullable: false
          description: The `discontinued` column is an integer that indicates whether
            a product is discontinued, with a value of 0 or 1. It is required and
            cannot be null.
