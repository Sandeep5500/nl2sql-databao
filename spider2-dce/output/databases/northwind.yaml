      - name: employees
        columns:
        - name: employeeid
          type: INTEGER
          nullable: false
          description: employeeid is an integer column that uniquely identifies each
            employee and does not allow null values.
        - name: lastname
          type: TEXT
          nullable: false
          description: The `lastname` column contains the employee's last name, stored
            as non-nullable text.
        - name: firstname
          type: TEXT
          nullable: false
          description: The `firstname` column stores the first name of each employee
            as non-nullable text.
        - name: title
          type: TEXT
          nullable: true
          description: The `title` column stores the employee's job title or position,
            such as "Sales Representative" or "Vice President, Sales," and should
            be used when querying for roles or responsibilities. It differs from `titleofcourtesy`,
            which stores honorifics like "Mr." or "Ms." For example, "Sales Representative"
            is a sample value for `title`, while "Ms." is a sample value for `titleofcourtesy`.
        - name: titleofcourtesy
          type: TEXT
          nullable: true
          description: The `titleofcourtesy` column stores honorifics or titles used
            for the employee, such as "Mr.", "Mrs.", "Ms.", or "Dr.", and is optional.
            It differs from `title`, which stores the employee's job title, such as
            "Sales Representative." For example, "Ms." is a sample value for `titleofcourtesy`,
            while "Sales Representative" is a sample value for `title`.
        - name: birthdate
          type: DATE
          nullable: true
          description: The `birthdate` column stores the date of birth for employees,
            with a date data type that allows null values.
        - name: hiredate
          type: DATE
          nullable: true
          description: The `hiredate` column stores the date when an employee was
            hired, with a nullable DATE type.
        - name: address
          type: TEXT
          nullable: true
          description: The `address` column stores the full physical address of the
            employee, including street, city, and other details, as text. It differs
            from the `city`, `region`, `postalcode`, and `country` columns
        - name: city
          type: TEXT
          nullable: true
          description: The `city` column stores the city name where an employee is
            located. It is a nullable text field.
        - name: region
          type: TEXT
          nullable: true
          description: The `region` column stores textual region information for employee
            addresses and allows null values.
        - name: postalcode
          type: TEXT
          nullable: true
          description: The `postalcode` column stores the postal code of an employee's
            address as a text value and can contain null entries.
        - name: country
          type: TEXT
          nullable: true
          description: The country column stores the country of residence for each
            employee as text and can contain null values.
        - name: homephone
          type: TEXT
          nullable: true
          description: The `homephone` column stores the employee's home phone number
            as text and allows null values.
        - name: extension
          type: TEXT
          nullable: true
          description: The `extension` column stores text values representing phone
            extensions for employees, and can contain null values.
        - name: photo
          type: BLOB
          nullable: true
          description: The `photo` column stores employee photographs as binary data
            (BLOB) and can contain null values.
        - name: notes
          type: TEXT
          nullable: true
          description: The `notes` column contains textual information about employees,
            such as educational background, professional experience, and other relevant
            details. It allows null values.
        - name: reportsto
          type: INTEGER
          nullable: true
          description: The `reportsto` column is an optional integer field indicating
            the employee ID of the supervisor to whom this employee reports.
        - name: photopath
          type: TEXT
          nullable: true
          description: Stores the file path or URL for employee photos.
