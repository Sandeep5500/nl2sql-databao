datasource_id: databases/ipl.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: ball_by_ball
        columns:
        - name: match_id
          type: INTEGER
          nullable: false
          description: A unique identifier for the match, stored as an integer and required for each record.
        - name: over_id
          type: INTEGER
          nullable: false
          description: A required integer column representing the over number in a cricket match.
        - name: ball_id
          type: INTEGER
          nullable: false
          description: ball_id is an integer column representing the specific ball number within an over, and it cannot be
            null.
        - name: innings_no
          type: INTEGER
          nullable: false
          description: The `innings_no` column represents the inning number (as an integer) for a given ball in a cricket
            match. It is a required field.
        - name: team_batting
          type: INTEGER
          nullable: true
          description: The `team_batting` column represents the team batting in a given ball, identified by an integer value.
            It is distinct from `team_bowling`, which identifies the team bowling. A query would use `team_batting` to filter
            or analyze batting team actions, while `team_bowling` would be used for bowling team actions.
        - name: team_bowling
          type: INTEGER
          nullable: true
          description: The `team_bowling` column represents the team bowling in a given ball, identified by an integer value.
            It is distinct from `team_batting`, which identifies the team batting. A query would use `team_bowling` to filter
            or analyze bowling team actions, while `team_batting` would be used for batting team actions.
        - name: striker_batting_position
          type: INTEGER
          nullable: true
          description: The `striker_batting_position` column represents the batting order position of the striker at the time
            of the ball, and it allows null values.
        - name: striker
          type: INTEGER
          nullable: true
          description: The `striker` column represents the player facing the ball, identified by an integer ID. It is distinct
            from `non_striker`, which identifies the player at the non-striker's end. For example, a ball may have `striker`
            value 6 and `non_striker` value 7. A query would use these columns to analyze player
        - name: non_striker
          type: INTEGER
          nullable: true
          description: The `non_striker` column represents the player at the non-striker's end during a ball, identified by
            an integer player ID.
        - name: bowler
          type: INTEGER
          nullable: true
          description: The `bowler` column represents the player ID of the bowler for a given ball, and it allows null values.
        samples:
        - match_id: 335987
          over_id: 1
          ball_id: 1
          innings_no: 2
          team_batting: 2
          team_bowling: 1
          striker_batting_position: 1
          striker: 6
          non_striker: 7
          bowler: 106
        - match_id: 335987
          over_id: 1
          ball_id: 2
          innings_no: 1
          team_batting: 1
          team_bowling: 2
          striker_batting_position: 2
          striker: 2
          non_striker: 1
          bowler: 14
        - match_id: 335987
          over_id: 1
          ball_id: 2
          innings_no: 2
          team_batting: 2
          team_bowling: 1
          striker_batting_position: 2
          striker: 7
          non_striker: 6
          bowler: 106
        - match_id: 335987
          over_id: 1
          ball_id: 3
          innings_no: 1
          team_batting: 1
          team_bowling: 2
          striker_batting_position: 2
          striker: 2
          non_striker: 1
          bowler: 14
        - match_id: 335987
          over_id: 1
          ball_id: 3
          innings_no: 2
          team_batting: 2
          team_bowling: 1
          striker_batting_position: 2
          striker: 7
          non_striker: 6
          bowler: 106
        description: A table containing detailed ball-by-ball data for cricket matches, including batting and bowling team
          IDs, player positions, and identifiers for the striker, non-striker, and bowler.
        kind: table
        primary_key:
          name: pk_ball_by_ball
          columns:
          - match_id
          - over_id
          - ball_id
          - innings_no
          validated: true
      - name: batsman_scored
        columns:
        - name: match_id
          type: INTEGER
          nullable: false
          description: A unique identifier for a match, stored as an integer and required for each record.
        - name: over_id
          type: INTEGER
          nullable: false
          description: The `over_id` column represents the specific over in a cricket match, stored as an integer and required
            (non-nullable).
        - name: ball_id
          type: INTEGER
          nullable: false
          description: ball_id is an integer column representing the specific ball number within an over, and it cannot contain
            null values.
        - name: runs_scored
          type: INTEGER
          nullable: true
          description: The `runs_scored` column stores the number of runs scored on a specific ball, and it can contain null
            values.
        - name: innings_no
          type: INTEGER
          nullable: false
          description: The `innings_no` column represents the specific innings within a match, identified by an integer value.
        samples:
        - match_id: 335987
          over_id: 1
          ball_id: 1
          runs_scored: 1
          innings_no: 2
        - match_id: 335987
          over_id: 1
          ball_id: 2
          runs_scored: 0
          innings_no: 1
        - match_id: 335987
          over_id: 1
          ball_id: 3
          runs_scored: 0
