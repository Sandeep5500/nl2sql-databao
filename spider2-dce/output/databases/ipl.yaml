        description: A table storing details of cricket matches, including teams, dates, venues, outcomes, and match statistics.
          Each match is uniquely identified by a match_id.
        kind: table
        primary_key:
          name: pk_match
          columns:
          - match_id
          validated: true
      - name: player
        columns:
        - name: player_id
          type: INTEGER
          nullable: false
          description: Player ID is an integer column that uniquely identifies each player and cannot be null.
        - name: player_name
