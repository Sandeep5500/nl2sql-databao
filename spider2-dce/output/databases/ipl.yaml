            style, such as "Left-hand bat" or "Right-hand bat." A query would use `bowling_skill` to filter or analyze players
            based on their bowling style, while `batting_hand` would be used for batting-related analysis. Known sample values:
            ''Right-arm medium'', ''Right-arm offbreak''.'
        - name: country_name
          type: TEXT
          nullable: true
          description: The `country_name` column stores the name of the country associated with the player as text. It allows
