      - name: player_match
        columns:
        - name: match_id
          type: INTEGER
          nullable: false
          description: match_id is an integer column that uniquely identifies a match and is required (non-nullable).
        - name: player_id
          type: INTEGER
          nullable: false
          description: player_id is an integer column that uniquely identifies a player within the context of a specific match,
            as identified by match_id. It is distinct from a player's global identifier in other tables and cannot be null.
        - name: role
          type: TEXT
          nullable: true
          description: 'The `role` column stores the role of a player in a match as text, such as "Captain". It allows null
            values. Known sample values: ''Captain''.'
        - name: team_id
          type: INTEGER
          nullable: true
          description: team_id is an integer column that stores the team identifier for a player in a specific match, as identified
            by match_id. It can contain null values and should be used in conjunction with match_id and player_id to associate
            players with teams within matches. Sample values like 7 and 1 differ from the numeric values in match_id (e.g.,
            392220) and player_id (e.g., 133).
        samples:
        - match_id: 392220
