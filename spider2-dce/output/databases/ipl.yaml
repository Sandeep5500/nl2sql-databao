        - match_id: 335987
          over_id: 1
          ball_id: 4
          runs_scored: 1
          innings_no: 2
        description: Records the runs scored by batsmen for each ball in a cricket match, including the match, over, ball,
          and innings details.
        kind: table
        primary_key:
          name: pk_batsman_scored
          columns:
          - match_id
          - over_id
          - ball_id
          - innings_no
          validated: true
      - name: extra_runs
        columns:
        - name: match_id
          type: INTEGER
          nullable: false
          description: A required integer field representing the unique identifier of a cricket match. This column is used
            to link this table to other tables containing match-level data, such as team or player information.
        - name: over_id
          type: INTEGER
          nullable: false
          description: The `over_id` column represents the specific over within a cricket match, stored as an integer and
            required (non-nullable). It is used in conjunction with `ball_id` to uniquely identify a ball within a match.
            For example, over 16 may contain ball 3, which is distinct from over 18, ball 3.
        - name: ball_id
          type: INTEGER
          nullable: false
          description: The `ball_id` column represents the specific ball number within an over, stored as an integer and required
            (non-nullable). It is used in conjunction with `over_id` to uniquely identify a ball within a match. For example,
            over 16, ball 3 is distinct from over 18, ball 3.
        - name: extra_type
          type: TEXT
          nullable: true
          description: 'The `extra_type` column is a nullable TEXT column that stores the type of extra runs, such as ''legbyes''.
            It provides context for the `extra_runs` column, indicating Known sample values: ''legbyes''.'
        - name: extra_runs
          type: INTEGER
          nullable: true
          description: extra_runs is an integer column that records the number of extra runs scored in a cricket match, and
            it can contain null values.
        - name: innings_no
          type: INTEGER
          nullable: false
          description: A required integer field indicating the innings number in a cricket match.
        samples:
        - match_id: 501229
          over_id: 16
          ball_id: 3
          extra_type: legbyes
          extra_runs: 1
          innings_no: 1
        - match_id: 501229
          over_id: 18
          ball_id: 1
          extra_type: legbyes
          extra_runs: 1
          innings_no: 2
        - match_id: 501229
          over_id: 18
          ball_id: 6
          extra_type: legbyes
          extra_runs: 4
          innings_no: 2
        - match_id: 392239
          over_id: 18
          ball_id: 6
          extra_type: legbyes
          extra_runs: 1
          innings_no: 2
        - match_id: 501229
          over_id: 20
          ball_id: 3
          extra_type: legbyes
          extra_runs: 1
          innings_no: 1
        description: Records additional runs awarded during cricket matches, including details like match, over, ball, innings,
          type of extra, and runs.
        kind: table
        primary_key:
          name: pk_extra_runs
          columns:
          - match_id
          - over_id
          - ball_id
          - innings_no
          validated: true
      - name: match
        columns:
        - name: match_id
          type: INTEGER
          nullable: false
          description: Unique identifier for each match.
        - name: team_1
          type: INTEGER
          nullable: true
          description: Represents the first team participating in a match, identified by an integer ID. This column is distinct
            from `team_2`, which represents the second team in the match. For example, `team_1` may contain the value 2, while
            `team_2` may contain the value 1 in the same match.
        - name: team_2
          type: INTEGER
          nullable: true
          description: Represents the second team participating in a match, identified by an integer ID. This column is distinct
            from `team_1`, which represents the first team in the match. For example, `team_2` may contain the value 1, while
            `team_1` may contain the value 2 in the same match.
        - name: match_date
          type: DATE
          nullable: true
          description: The `match_date` column stores the date when a match was played, with a DATE data type and allows NULL
            values.
        - name: season_id
          type: INTEGER
          nullable: true
          description: season_id is an integer column representing the identifier for the season in which the match took place.
        - name: venue
          type: TEXT
          nullable: true
          description: 'venue is a nullable TEXT column representing the location where the match was played. Known sample
            values: ''M Chinnaswamy Stadium'', ''Punjab Cricket Association Stadium Mohali'', ''Feroz Shah Kotla'', ''Wankhede
            Stadium'', ''Eden Gardens''.'
        - name: toss_winner
          type: INTEGER
          nullable: true
          description: The `toss_winner` column stores the team ID of the team that won the toss for a match, and is distinct
            from `match_winner`, which stores the team ID of the team that won the match. For example, `toss_winner` may contain
            the value 2, while `match_winner` may contain the value 1 in the same match.
        - name: toss_decision
          type: TEXT
          nullable: true
          description: 'The `toss_decision` column stores the decision made by the team winning the toss, such as ''bat''
            or ''field''. Known sample values: ''field'', ''bat''.'
        - name: win_type
          type: TEXT
          nullable: true
          description: 'The `win_type` column stores the type of win in a match, such as "runs" or "wickets," and allows null
            values. Known sample values: ''runs'', ''wickets''.'
        - name: win_margin
          type: INTEGER
          nullable: true
          description: The `win_margin` column represents the margin by which a team won the match, measured in runs or wickets,
            and is stored as an integer value.
        - name: outcome_type
          type: TEXT
          nullable: true
          description: 'The `outcome_type` column stores the result status of a match, such as "Result," and is represented
            as text. Known sample values: ''Result''.'
        - name: match_winner
          type: INTEGER
          nullable: true
          description: The `match_winner`
        - name: man_of_the_match
          type: INTEGER
          nullable: true
          description: The `man_of_the_match` column stores the ID of the player awarded "Man of the Match" for each match,
            with null values allowed.
        samples:
        - match_id: 335987
          team_1: 2
          team_2: 1
          match_date: '2008-04-18'
