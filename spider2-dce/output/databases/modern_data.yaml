      - name: pizza_recipes
        columns:
        - name: pizza_id
          type: INTEGER
          nullable: true
          description: pizza_id is an integer column that can contain null values.
        - name: toppings
          type: TEXT
          nullable: true
          description: 'The "toppings" column is a TEXT column that can contain null values and is used to store a list or
