        kind: table
      - name: pizza_clean_customer_orders
        columns:
        - name: order_id
          type: INTEGER
          nullable: true
          description: order_id is an integer column that uniquely identifies each order, with null values allowed.
        - name: customer_id
          type: INTEGER
          nullable: true
          description: customer_id is an integer column representing the unique identifier for a customer, with null values
            allowed.
        - name: pizza_id
          type: INTEGER
          nullable: true
          description: pizza_id is an integer column representing the identifier for a pizza in a customer order, which can
            contain null values.
        - name: exclusions
          type: TEXT
          nullable: true
          description: 'The `exclusions` column stores text data indicating ingredients or options a customer has excluded
            from their pizza order, such as "pepperoni" or "olives". It allows null values and is used in contrast to the
            `extras` column, which records additional toppings or modifications. For example, an exclusion might be "mushrooms",
            while an extra might be "extra cheese". Known sample values: ''4''.'
        - name: extras
          type: TEXT
          nullable: true
          description: The `extras` column contains additional toppings or modifications requested for a pizza, stored as
            text, such as "extra cheese" or "double pepperoni". It allows null values and is used in contrast to the `exclusions`
            column, which records ingredients the customer does not want. For example, an exclusion might be "mushrooms",
            while an extra might be "extra cheese".
        - name: order_time
          type: TEXT
          nullable: true
          description: 'The `order_time` column stores the timestamp of when a pizza order was placed, in text format. It
            is nullable, meaning some entries may not have a recorded time. Known sample values: ''2021-01-01 18:05:02'',
            ''2021-01-01 19:00:52'', ''2021-01-02 23:51:23'', ''2021-01-04 13:23:46''.'
        samples:
        - order_id: 1
          customer_id: 101
          pizza_id: 1
          order_time: '2021-01-01 18:05:02'
        - order_id: 2
          customer_id: 101
          pizza_id: 1
          order_time: '2021-01-01 19:00:52'
        - order_id: 3
          customer_id: 102
          pizza_id: 1
          order_time: '2021-01-02 23:51:23'
        - order_id: 3
          customer_id: 102
          pizza_id: 2
          order_time: '2021-01-02 23:51:23'
        - order_id: 4
          customer_id: 103
          pizza_id: 1
          exclusions: '4'
          order_time: '2021-01-04 13:23:46'
        description: A table containing customer pizza orders with details such as order ID, customer ID, pizza ID, exclusions,
          extras, and order time.
        kind: table
      - name: pizza_clean_runner_orders
        columns:
        - name: order_id
          type: INTEGER
          nullable: true
          description: The `order_id` is an integer column representing the unique identifier for each pizza order, and it
            may contain null values. It is distinct from `runner_id`, which identifies the runner handling the order. A query
            would use `order_id` to reference a specific customer order, while `runner_id` would be used to track which runner
            was assigned to that order.
        - name: runner_id
          type: INTEGER
          nullable: true
          description: The `runner_id` is an integer column representing the unique identifier for the runner who picked up
            the pizza order. It is distinct from `order_id`, which identifies the customer order itself. A query would use
            `runner_id` to analyze runner performance or assignments, while `order_id` would be used to track the status of
            a specific order.
        - name: pickup_time
          type: TEXT
          nullable: true
          description: 'The pickup_time column stores the time a pizza order was picked up by the runner, recorded as a text
            string in the format ''YYYY-MM-DD HH:MM:SS''. Known sample values: ''2021-01-01 18:15:34'', ''2021-01-01 19:10:54'',
            ''2021-01-03 00:12:37'', ''2021-01-04 13:53:03'', ''2021-01-08 21:10:57''.'
        - name: distance
          type: REAL
          nullable: true
          description: The `distance` column stores the distance of the pizza delivery as a real number, and it can contain
            null values.
        - name: duration
          type: REAL
          nullable: true
          description: The `duration` column represents the time taken for a pizza delivery in minutes, stored as a real number
            and allowing null values.
        - name: cancellation
          type: TEXT
          nullable: true
          description: The `cancellation` column stores text information indicating if an order was cancelled, with possible
            reasons or statuses. It allows null values, meaning not all orders are cancelled.
        samples:
        - order_id: 1
          runner_id: 1
          pickup_time: '2021-01-01 18:15:34'
          distance: 20.0
          duration: 32.0
        - order_id: 2
          runner_id: 1
          pickup_time: '2021-01-01 19:10:54'
          distance: 20.0
          duration: 27.0
        - order_id: 3
          runner_id: 1
          pickup_time: '2021-01-03 00:12:37'
          distance: 13.4
          duration: 20.0
        - order_id: 4
          runner_id: 2
          pickup_time: '2021-01-04 13:53:03'
          distance: 23.4
          duration: 40.0
        - order_id: 5
          runner_id: 3
          pickup_time: '2021-01-08 21:10:57'
          distance: 10.0
          duration: 15.0
        description: A table containing information about pizza runner orders, including order identifiers, runner details,
          pickup times, delivery distances, durations, and cancellation status.
        kind: table
      - name: pizza_customer_orders
        columns:
        - name: order_id
          type: INTEGER
          nullable: true
          description: order_id is an integer column that uniquely identifies each order, with null values allowed.
        - name: customer_id
          type: INTEGER
          nullable: true
          description: customer_id is an integer column representing the unique identifier for a customer, with null values
            allowed.
        - name: pizza_id
          type: INTEGER
          nullable: true
          description: pizza_id is an integer column representing the identifier for a pizza in a customer order.
        - name: exclusions
          type: TEXT
          nullable: true
          description: 'The `exclusions` column stores text data indicating ingredients or options a customer has excluded
            from their pizza order. It allows null values and is used in queries where a customer''s omitted toppings need
            to be identified, such as when filtering for pizzas without certain ingredients. Unlike the `extras` column, which
            holds additional toppings like "extra cheese", `exclusions` might contain values like "no anchovies". Known sample
            values: ''4''.'
        - name: extras
          type: TEXT
          nullable: true
          description: The `extras` column stores additional toppings or options selected for a pizza order as text. It can
            contain null values if no extras are specified and is used in queries where additional toppings are relevant,
            such as when calculating extra charges or customizing pizza details. Unlike the `exclusions` column, which might
            contain values like "no anchovies", `extras` might include values like "extra cheese".
        - name: order_time
          type: TEXT
          nullable: true
          description: 'The `order_time` column stores the timestamp of when a pizza order was placed, in text format. It
