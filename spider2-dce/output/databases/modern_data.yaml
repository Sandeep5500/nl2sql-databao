          estimate_median_income: 56120
          margin_of_error_median_income: 3925
          estimate_mean_income: 78208
          margin_of_error_mean_income: 3788
        - zipcode: 10451
          estimate_total: 18140
          margin_of_error_total: 405
          estimate_median_income: 26048
          margin_of_error_median_income: 2140
          estimate_mean_income: 40836
          margin_of_error_mean_income: 3424
        - zipcode: 10452
          estimate_total: 25432
          margin_of_error_total: 368
          estimate_median_income: 24790
          margin_of_error_median_income: 1337
          estimate_mean_income: 36083
          margin_of_error_mean_income: 1578
        - zipcode: 10453
          estimate_total: 26802
