datasource_id: databases/modern_data.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: companies_dates
        columns:
        - name: company_id
          type: INTEGER
          nullable: true
          description: The `company_id` column contains integer values representing company identifiers, with some entries
            allowing null values.
        - name: date_joined
          type: TEXT
          nullable: true
          description: The `date_joined` column stores the exact date and time a company joined, in text format (e.g., "2020-09-08T00:00:00.000").
            This differs from `year_founded`, which records the year a company was founded (e.g., 2004). Use `date_joined`
            when querying for precise timestamps of when companies joined, and `year_founded` when analyzing founding years.
        - name: year_founded
          type: INTEGER
          nullable: true
          description: The `year_founded` column stores the year a company was founded, as an integer value (e.g., 2004).
            This differs from `date_joined`, which records the exact date and time a company joined (e.g., "2020-09-08T00:00:00.000").
            Use `year_founded` when analyzing founding years and `date_joined` when querying for precise timestamps of when
            companies joined.
        samples:
        - company_id: 109
          date_joined: '2020-09-08T00:00:00.000'
          year_founded: 2004
        - company_id: 821
          date_joined: '2019-05-16T00:00:00.000'
          year_founded: 2009
        - company_id: 153
          date_joined: '2019-07-11T00:00:00.000'
          year_founded: 2016
        - company_id: 972
          date_joined: '2018-10-17T00:00:00.000'
          year_founded: 2016
        - company_id: 1022
          date_joined: '2021-06-02T00:00:00.000'
          year_founded: 2013
        description: A table containing company information including company ID, date joined, and year founded.
        kind: table
      - name: companies_funding
        columns:
        - name: company_id
          type: INTEGER
          nullable: true
          description: Unique identifier for a company, represented as an integer.
        - name: valuation
          type: INTEGER
          nullable: true
          description: The "valuation" column represents the estimated value of a company in integer format, typically much
            higher than the funding amount, and it can contain null values. For example, a valuation of 10000000000 may represent
            a company's overall worth, whereas a funding amount of 2000000000 (as seen in the "funding" column) reflects the
            total capital raised. A query would use "valuation" to assess company worth and "funding" to understand capital
            raised.
        - name: funding
          type: INTEGER
          nullable: true
          description: The "funding" column represents the amount of funding a company has received, measured in integer values
            and stored as nullable data. It is typically lower than the valuation and reflects capital raised rather than
            overall company value. For example, a funding amount of 2000000000 (as seen in this column) may be part of a company's
            valuation of 10000000000 (as seen in the "valuation" column). A query would use "funding" to assess capital raised
            and "valuation" to understand company worth.
        - name: select_investors
          type: TEXT
          nullable: true
          description: A text field containing a list of selected investors associated with a company, represented as a quoted
            string.
        samples:
        - company_id: 548
          valuation: 2000000000
          funding: 449000000
          select_investors: '"Accel Partners, Index Ventures, Insight Venture Partners"'
        - company_id: 645
          valuation: 1000000000
          funding: 188000000
          select_investors: '"Sequoia Capital China, China Life Investment Holding Company, Qiming Venture Partners"'
        - company_id: 615
          valuation: 1000000000
          funding: 2000000000
          select_investors: '"CreditEase Fintech Investment Fund, BMW i Ventures, SoftBank Group"'
        - company_id: 51
          valuation: 10000000000
          funding: 564000000
          select_investors: '"DFJ Growth Fund, Coatue Management, Addition"'
        - company_id: 680
          valuation: 1000000000
          funding: 362000000
          select_investors: '"China Grand Prosperity Investment, CSC Group"'
        description: A table containing funding details for companies, including company ID, valuation, funding amount, and
          a list of select investors.
        kind: table
      - name: companies_industries
        columns:
        - name: company_id
          type: INTEGER
          nullable: true
          description: A nullable integer column representing company identifiers.
        - name: industry
          type: TEXT
          nullable: true
          description: 'The `industry` column contains textual data representing the industry classification of companies,
            such as "Fintech" or "Internet software & services." The values are nullable. Known sample values: ''Fintech'',
            ''Internet software & services''.'
        samples:
        - company_id: 316
          industry: Fintech
        - company_id: 162
          industry: Fintech
        - company_id: 803
          industry: Fintech
        - company_id: 278
          industry: Internet software & services
        - company_id: 983
          industry: Fintech
        description: A table that maps company IDs to their respective industries, such as Fintech or Internet software &
          services.
        kind: table
      - name: income_trees
