          estimate_total: 15198
          margin_of_error_total: 353
          estimate_median_income: 47575
          margin_of_error_median_income: 3834
          estimate_mean_income: 73353
          margin_of_error_mean_income: 3929
        - zipcode: 11218
          estimate_total: 24909
