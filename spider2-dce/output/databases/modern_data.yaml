        - name: Margin_of_Error_Mean_income
          type: INTEGER
          nullable: true
          description: Margin of error for the mean income estimate in a given ZIP code. This column is related to `Estimate_Mean_income`
            and provides statistical confidence bounds for that estimate. It differs from `
        samples:
