          order_time: '2021-01-04 13:23:46'
        description: A table containing customer pizza orders with details such as order ID, customer ID, pizza ID, exclusions,
          extras, and order time.
        kind: table
      - name: pizza_get_exclusions
        columns:
        - name: row_id
          type: INTEGER
          nullable: true
          description: Row identifier with integer values that can be null.
        - name: order_id
          type: INTEGER
          nullable: true
          description: The column "order_id" contains integer values representing pizza orders, with some entries allowing
            null values.
        - name: exclusions
          type: INTEGER
          nullable: true
          description: The `exclusions` column represents the specific toppings excluded from a pizza order, stored as an
            integer value. It differs from `total_exclusions`, which counts the total number of exclusions in an order. For
            example, an entry with value 4 in `exclusions` might represent a specific topping code, while `total_exclusions`
            might show 3 to indicate the total number of exclusions in that order.
        - name: total_exclusions
          type: INTEGER
          nullable: true
          description: The `total_exclusions` column represents the total number of exclusions in a pizza order, stored as
            an integer value. It differs from `exclusions`, which refers to specific toppings excluded. For example, an entry
            with value 3 in `total_exclusions` indicates the total count of exclusions, while `exclusions` might show 4 to
            represent a specific topping code.
        samples:
        - row_id: 1
          order_id: 4
          exclusions: 4
          total_exclusions: 3
        - row_id: 1
          order_id: 9
          exclusions: 4
          total_exclusions: 1
        - row_id: 1
          order_id: 10
          exclusions: 2
          total_exclusions: 2
        - row_id: 2
          order_id: 10
          exclusions: 6
          total_exclusions: 2
        description: A table listing pizza orders with details about exclusions, including order identifiers, specific exclusions,
          and total count of exclusions.
        kind: table
      - name: pizza_get_extras
        columns:
        - name: row_id
          type: INTEGER
          nullable: true
          description: Row identifier with integer values that can be null.
        - name: order_id
          type: INTEGER
          nullable: true
          description: order_id is an integer column representing the identifier for a pizza order.
        - name: extras
          type: INTEGER
          nullable: true
          description: The `extras` column represents an integer value indicating the type of pizza extras ordered, with null
            values allowed. It differs from `extras_count`, which indicates the number of extra items, not the type. For example,
            `extras` might have a value of 1 (representing a specific extra type), while `extras_count` might have a value
            of 2 (indicating two of that extra were added).
        - name: extras_count
          type: INTEGER
          nullable: true
          description: The `extras_count` column represents the number of extra items added to a pizza order, with integer
            values and nullable entries. It differs from `extras`, which indicates the type of extra, not the quantity. For
            example, `extras` might have a value of 5 (representing a specific extra type), while `extras_count` might have
            a value of 2 (indicating two of that extra were added).
        samples:
        - row_id: 1
          order_id: 5
          extras: 1
          extras_count: 1
        - row_id: 1
          order_id: 7
          extras: 1
          extras_count: 1
        - row_id: 1
          order_id: 9
          extras: 1
          extras_count: 2
        - row_id: 2
          order_id: 9
          extras: 5
          extras_count: 2
        - row_id: 1
          order_id: 10
          extras: 1
          extras_count: 2
        description: A table that records pizza order extras, including order identifiers, extra item codes, and counts.
        kind: table
