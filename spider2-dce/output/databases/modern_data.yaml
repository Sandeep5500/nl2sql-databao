            recipe with integer values such as 1 or 2, the "toppings" column contains textual data representing ingredients,
            such as "pepperoni, mushrooms, and olives." A query would use "pizza_id" to reference or join on specific pizza
            recipes and "toppings" to filter or sort by ingredient combinations. Known sample values: ''1, 2, 3, 4, 5, 6,
            8, 10'', ''4, 6, 7, 9, 11, 12''.'
        samples:
        - pizza_id: 1
          toppings: 1, 2, 3, 4, 5, 6, 8, 10
        - pizza_id: 2
          toppings: 4, 6, 7, 9, 11, 12
        description: A table containing pizza recipes with unique identifiers and associated toppings. Each entry lists a
          pizza ID and a comma-separated list of topping IDs.
        kind: table
      - name: pizza_runner_orders
