        description: This table stores daily USD-to-other-currency exchange rates.
          Each row represents one currency pair for one calendar day, with rates covering
          every day from 2011-05-31 to 2014-05-31 (1,097 days, 14 currencies per day).
          one row per (currencyrateid) — a currency exchange rate for a specific date
          and currency pair  [no declared key; proposed by an LLM and verified unique
          in the data]
        kind: table
