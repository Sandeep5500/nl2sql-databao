      - name: SalesPersonQuotaHistory
        columns:
        - name: BusinessEntityID
          type: INTEGER
          nullable: true
          description: 'Values: integer 274 .. 290.'
        - name: QuotaDate
          type: TEXT
          nullable: true
          description: 'Values: datetime 2011-05-31 00:00:00 .. 2014-03-01 00:00:00;
            values: 2013-05-30 00:00:00 (17), 2013-08-30 00:00:00 (17), 2013-11-30
            00:00:00 (17), 2014-03-01 00:00:00 (17), 2012-08-30 00:00:00 (14), 2012-11-30
            00:00:00 (14), 2013-02-28 00:00:00 (14), 2012-05-30 00:00:00 (13), 2011-05-31
            00:00:00 (10), 2011-08-31 00:00:00 (10), 2011-12-01 00:00:00 (10), 2012-02-29
            00:00:00 (10). The SalesPersonQuotaHistory table contains quota records
            for BusinessEntityIDs 274 through 290, with quota counts ranging from
            4 to 12. The first quota date is 2011-05-31 for IDs 274-283 and later
            dates for IDs 284-290, while the last quota date is 2014-03-01 for all
            listed entities.'
        - name: SalesQuota
          type: REAL
          nullable: true
          description: 'Values: integer 1000 .. 1898000. The SalesPersonQuotaHistory
            table contains SalesQuota values for BusinessEntityId 274, which are stored
            as floating-point numbers (e.g., 28000.0) but represent whole integers.
            The data spans from May 2011 to March 2014, with recorded quotas ranging
            from 7,000.0 to 263,000.0.'
