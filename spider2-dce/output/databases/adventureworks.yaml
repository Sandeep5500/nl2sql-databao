        description: Each row records the annual sales quota assigned to a salesperson
          (BusinessEntityID) for a specific fiscal period ending on QuotaDate. The
          table tracks quota changes over time for 17 salespeople from 2011 through
          2014. one row per (BusinessEntityID, QuotaDate) — A salesperson's sales
          quota on a specific date  [no declared key; proposed by an LLM and verified
          unique in the data] Salespeople 274 through 283 each have 12 quota records
          spanning from 2011-05-31 to 2014-03-01, while salespeople 284 through 290
          have between 4 and 8 records with first quota dates ranging from 2012-05-30
          to 2013-05-30.
        kind: table
      - name: countryregioncurrency
        columns:
        - name: countryregioncode
          type: TEXT
          nullable: true
          description: 'Values: text.'
        - name: currencycode
          type: TEXT
          nullable: true
          description: 'Values: text. The countryregioncurrency table contains currency
            codes such as ATS, BEF, and BRL, with a total of 97 distinct codes.'
        - name: modifieddate
          type: DATE
          nullable: true
          description: 'Values: datetime 2008-04-30 00:00:00 .. 2014-02-08 10:17:21;
            values: 2014-02-08 10:17:21.51 (99), 2008-04-30 00:00:00 (10). The query
            result shows two distinct modifieddate values: 2008-04-30 and 2014-02-08.
            Rows with currencycode EUR have modifieddate 2008-04-30, while all other
            displayed rows have modifieddate 2014-02-08.'
        samples:
        - countryregioncode: AE
          currencycode: AED
          modifieddate: '2014-02-08 10:17:21.51'
        - countryregioncode: AR
          currencycode: ARS
          modifieddate: '2014-02-08 10:17:21.51'
        - countryregioncode: AT
          currencycode: ATS
          modifieddate: '2014-02-08 10:17:21.51'
        - countryregioncode: AT
          currencycode: EUR
          modifieddate: '2008-04-30 00:00:00'
        - countryregioncode: AU
          currencycode: AUD
          modifieddate: '2014-02-08 10:17:21.51'
        description: 'The table records country/region codes and their associated
          currency code(s). Some countries, such as AT, DE, and FR, have two rows:
          one for the old national currency (ATS, DEM, FRF) and one for EUR. The table
          includes a modifieddate field indicating when the mapping was last updated.
          one row per (countryregioncode, currencycode) — a country or region''s association
          with a specific currency  [no declared key; proposed by an LLM and verified
          unique in the data] The query result shows that countries AT, BE, DE, ES,
          FI, and FR have multiple currency codes, including both legacy currencies
          (ATS, BEF, DEM, ESP, FIM, FRF) and EUR.'
        kind: table
