          type: TEXT
          nullable: true
          description: 'Values: text.'
        - name: ModifiedDate
          type: TEXT
          nullable: true
          description: 'Values: datetime 2011-04-16 00:00:00 .. 2014-01-15 00:00:00;
            values: 2013-04-15 00:00:00 (17), 2013-07-16 00:00:00 (17), 2013-10-16
            00:00:00 (17), 2014-01-15 00:00:00 (17), 2012-07-16 00:00:00 (14), 2012-10-16
            00:00:00 (14), 2013-01-14 00:00:00 (14), 2012-04-15 00:00:00 (13), 2011-04-16
            00:00:00 (10), 2011-07-17 00:00:00 (10), 2011-10-17 00:00:00 (10), 2012-01-15
            00:00:00 (10).'
