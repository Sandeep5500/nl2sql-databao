datasource_id: databases/music.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: Album
        columns:
        - name: AlbumId
          type: INTEGER
          nullable: false
          description: 'Values: integer 1 .. 347.'
        - name: Title
          type: NVARCHAR(160)
          nullable: false
          description: 'Values: text.'
        - name: ArtistId
          type: INTEGER
          nullable: false
          description: 'Values: integer 1 .. 275. ArtistId 90 has 21 albums, ArtistId
            22 has 14 albums, ArtistId 58 has 11 albums, ArtistId 50 has 10 albums,
            ArtistId 150 has 10 albums, ArtistId 114 has 6 albums, ArtistId 118 has
            5 albums, and ArtistIds 21, 152, and 82 each have 4 albums.'
        samples:
        - albumid: 1
          title: For Those About To Rock We Salute You
          artistid: 1
        - albumid: 2
          title: Balls to the Wall
          artistid: 2
        - albumid: 3
          title: Restless and Wild
          artistid: 2
        - albumid: 4
          title: Let There Be Rock
          artistid: 1
        - albumid: 5
          title: Big Ones
          artistid: 3
        description: 'Each row records one album release, identified by AlbumId, with
          its title and the ArtistId of the performing artist. This table links to
          the Artist table to get the artist name. primary key (declared): (AlbumId)'
        kind: table
        primary_key:
          name: pk_Album
          columns:
          - AlbumId
          validated: true
        indexes:
        - name: IFK_AlbumArtistId
          columns:
          - ArtistId
          unique: false
        - name: IPK_Album
          columns:
          - AlbumId
          unique: true
        foreign_keys:
        - name: fk_Album_0
          mapping:
          - from_column: ArtistId
            to_column: ArtistId
          referenced_table: main.Artist
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
      - name: Artist
        columns:
        - name: ArtistId
          type: INTEGER
          nullable: false
          description: 'Values: integer 1 .. 275. The query result shows that 71 ArtistId
            values in the Artist table have no corresponding rows in the Album table.'
        - name: Name
          type: NVARCHAR(120)
          nullable: true
          description: 'Values: text.'
        samples:
        - artistid: 1
          name: AC/DC
        - artistid: 2
          name: Accept
        - artistid: 3
          name: Aerosmith
        - artistid: 4
          name: Alanis Morissette
        - artistid: 5
          name: Alice In Chains
        description: 'Each row records an artist’s ID and name. 71 of the 275 artists
