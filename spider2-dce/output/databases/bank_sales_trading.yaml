datasource_id: databases/bank_sales_trading.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: bitcoin_members
        columns:
        - name: member_id
          type: TEXT
          nullable: true
          description: A text field containing unique member identifiers, with null values allowed.
        - name: first_name
          type: TEXT
          nullable: true
          description: A column containing the first names of members, with text values that can be null.
        - name: region
          type: TEXT
          nullable: true
          description: 'A column containing textual data representing the region associated with each member, which can contain
            null values. Known sample values: ''Australia'', ''United States''.'
        samples:
        - member_id: c4ca42
          first_name: Danny
          region: Australia
        - member_id: c81e72
          first_name: Vipul
          region: United States
        - member_id: eccbc8
          first_name: Charlie
          region: United States
        - member_id: a87ff6
          first_name: Nandita
          region: United States
        - member_id: e4da3b
          first_name: Rowan
          region: United States
        description: A table containing information about Bitcoin members, including their member ID, first name, and region.
        kind: table
      - name: bitcoin_prices
        columns:
        - name: ticker
          type: TEXT
          nullable: true
          description: 'The `ticker` column stores the cryptocurrency identifier, such as "ETH", as text. Known sample values:
            ''ETH''.'
        - name: market_date
          type: TEXT
          nullable: true
          description: 'The `market_date` column stores the date of the market activity as text, with entries formatted as
            day-month-year (e.g., 29-08-2021). Known sample values: ''29-08-2021'', ''28-08-2021'', ''27-08-2021'', ''26-08-2021'',
            ''25-08-2021''.'
        - name: price
          type: REAL
          nullable: true
          description: The `price` column stores the real-valued closing price of the cryptocurrency for a given market date.
            It differs from the `open`, `high`, and `low` columns, which represent the opening, highest, and lowest prices,
            respectively, on that date. For example, on 29-08-2021, the closing price was 3177.84, whereas the opening price
            was 3243.96.
        - name: open
          type: REAL
          nullable: true
          description: The `open` column represents the opening price of the cryptocurrency for a given market date. It differs
            from the `price`, `high`, and `low` columns, which represent the closing, highest, and lowest prices, respectively,
            on that date. For example, on 29-08-2021, the opening price was 3243.96, whereas the closing price was 3177.84.
        - name: high
          type: REAL
          nullable: true
          description: The `high` column stores the highest price of the cryptocurrency for a given market date, represented
            as a real number. It differs from the `price`, `open`, and
        - name: low
          type: REAL
          nullable: true
          description: The `low` column stores the lowest price of a cryptocurrency for a given market date, represented as
            a real number.
        - name: volume
          type: TEXT
          nullable: true
          description: 'The volume column stores the trading volume as a text value, indicating the number of units traded,
            often with suffixes like K for thousands. Known sample values: ''582.04K'', ''466.21K'', ''839.54K'', ''118.44K'',
            ''923.13K''.'
        - name: change
          type: TEXT
          nullable: true
          description: 'The `change` column stores the percentage change in price as text, indicating the fluctuation from
            the previous market day. Known sample values: ''-2.04%'', ''-0.91%'', ''5.82%'', ''-4.17%'', ''1.73%''.'
        samples:
        - ticker: ETH
          market_date: 29-08-2021
          price: 3177.84
          open: 3243.96
          high: 3282.21
          low: 3162.79
          volume: 582.04K
          change: -2.04%
        - ticker: ETH
          market_date: 28-08-2021
          price: 3243.9
          open: 3273.78
          high: 3284.58
          low: 3212.24
          volume: 466.21K
          change: -0.91%
        - ticker: ETH
          market_date: 27-08-2021
          price: 3273.58
          open: 3093.78
          high: 3279.93
          low: 3063.37
          volume: 839.54K
          change: 5.82%
        - ticker: ETH
          market_date: 26-08-2021
          price: 3093.54
          open: 3228.03
          high: 3249.62
          low: 3057.48
          volume: 118.44K
          change: -4.17%
        - ticker: ETH
          market_date: 25-08-2021
          price: 3228.15
          open: 3172.12
          high: 3247.43
          low: 3080.7
          volume: 923.13K
          change: 1.73%
        description: A table containing historical price data for cryptocurrencies, including price, open, high, low, volume,
          and change metrics, with sample entries for Ethereum (ETH) in August 2021.
        kind: table
      - name: bitcoin_transactions
        columns:
        - name: txn_id
          type: INTEGER
          nullable: true
          description: Transaction ID, an integer identifier for each transaction, which may be null.
        - name: member_id
          type: TEXT
          nullable: true
          description: A unique identifier for a member, represented as text.
        - name: ticker
          type: TEXT
          nullable: true
          description: 'Represents the cryptocurrency involved in the transaction, such as BTC. Known sample values: ''BTC''.'
        - name: txn_date
          type: TEXT
          nullable: true
          description: 'The `txn_date` column stores the date of the Bitcoin transaction as text, in the format `MM-DD-YYYY`,
            and is used when queries need to filter or group transactions by calendar date. It differs from `txn_time`, which
            includes a full timestamp like `2017-01-01T00:00:00.000Z`. Known sample values: ''01-01-2017''.'
        - name: txn_type
          type: TEXT
          nullable: true
          description: 'A text field indicating the type of transaction, such as ''BUY'' or other transaction categories.
            Known sample values: ''BUY''.'
        - name: quantity
          type: REAL
          nullable: true
          description: Represents the amount of cryptocurrency involved in a transaction, stored as a real number.
        - name: percentage_fee
          type: REAL
          nullable: true
          description: The percentage_fee column stores the transaction fee as a percentage, represented as a real number.
        - name: txn_time
          type: TEXT
          nullable: true
          description: 'The `txn_time` column stores the timestamp of the transaction in text format, including both date
            and time (e.g., `2017-01-01T00:00:00.000Z`), and is used when queries require precise temporal ordering. It differs
            from `txn_date`, which only includes the date portion (e.g., `01-01-2017`). Known sample values: ''2017-01-01T00:00:00.000Z''.'
        samples:
        - txn_id: 1
          member_id: c81e72
          ticker: BTC
          txn_date: 01-01-2017
          txn_type: BUY
          quantity: 50.0
          percentage_fee: 0.3
          txn_time: '2017-01-01T00:00:00.000Z'
        - txn_id: 2
          member_id: eccbc8
          ticker: BTC
          txn_date: 01-01-2017
          txn_type: BUY
          quantity: 50.0
          percentage_fee: 0.3
          txn_time: '2017-01-01T00:00:00.000Z'
        - txn_id: 3
          member_id: a87ff6
          ticker: BTC
          txn_date: 01-01-2017
          txn_type: BUY
          quantity: 50.0
          percentage_fee: 0.0
          txn_time: '2017-01-01T00:00:00.000Z'
        - txn_id: 4
          member_id: e4da3b
          ticker: BTC
          txn_date: 01-01-2017
          txn_type: BUY
          quantity: 50.0
          percentage_fee: 0.3
          txn_time: '2017-01-01T00:00:00.000Z'
        - txn_id: 5
          member_id: '167909'
          ticker: BTC
          txn_date: 01-01-2017
          txn_type: BUY
          quantity: 50.0
          percentage_fee: 0.3
          txn_time: '2017-01-01T00:00:00.000Z'
        description: Bitcoin transactions table containing transaction details such as ID, member ID, ticker, date, type,
          quantity, fee percentage, and timestamp.
        kind: table
      - name: cleaned_weekly_sales
        columns:
        - name: week_date_formatted
          type: TEXT
          nullable: true
          description: 'The `week_date_formatted` column is a text column representing the formatted date of the week, with
            values like "2020-8-31". It differs from `week_date` in its formatting style; for example, `week_date` may store
            "2020-08-31" while `week_date_formatted` stores "2020-8-31". Queries requiring a more compact or simplified date
            format would use this column. Known sample values: ''2020-8-31''.'
        - name: week_date
          type: TEXT
          nullable: true
          description: 'The `week_date` column stores the date of the week as a text string, with values like ''2020-08-31''.
            It differs from `week_date_formatted` in its formatting style; for example, `week_date` may store "2020-08-31"
            while `week_date_formatted` stores "2020-8-31". Queries requiring a standard ISO-style date format would use this
            column. Known sample values: ''2020-08-31''.'
        - name: region
          type: TEXT
          nullable: true
          description: 'Region represents the geographical area associated with the sales data, such as ASIA, USA, EUROPE,
            or AFRICA. Known sample values: ''ASIA'', ''USA'', ''EUROPE'', ''AFRICA''.'
        - name: platform
          type: TEXT
          nullable: true
          description: 'platform is a nullable TEXT column representing the sales channel or medium through which transactions
            occur. Known sample values: ''Retail''.'
        - name: segment
          type: TEXT
          nullable: true
          description: 'The `segment` column is a text field representing a customer or market segment, often used for categorizing
            sales data, with values such as Known sample values: ''C3'', ''F1'', ''unknown'', ''C1'', ''C2''.'
        - name: customer_type
          type: TEXT
          nullable: true
          description: 'customer_type is a nullable text column representing the classification of customers, such as New,
            Guest, or other categories. Known sample values: ''New'', ''Guest''.'
        - name: transactions
          type: INTEGER
          nullable: true
          description: The "transactions" column represents the number of transactions recorded, with integer values and the
            potential for null entries.
        - name: sales
          type: INTEGER
          nullable: true
          description: The "sales" column represents the total number of sales recorded, with integer values that can be null.
        - name: week_number
          type: INTEGER
          nullable: true
          description: Week number representing the position of the sales week within the year.
        - name: month_number
          type: INTEGER
          nullable: true
          description: Represents the month number associated with the sales data, indicating the time period for the recorded
            transactions.
        - name: calendar_year
          type: INTEGER
          nullable: true
          description: calendar_year is an integer column representing the year of the sales data, with some entries allowing
            null values.
        - name: age_band
          type: TEXT
          nullable: true
          description: 'The `age_band` column contains textual classifications of customer age groups, such as "Retirees,"
            "Young Adults," "Middle Aged," and "unknown." Known sample values: ''Retirees'', ''Young Adults'', ''unknown'',
            ''Middle Aged''.'
        - name: demographic
          type: TEXT
          nullable: true
          description: 'A textual field representing demographic categories of customers, such as "Couples" or "Families,"
            with possible unknown values. Known sample values: ''Couples'', ''Families'', ''unknown''.'
        - name: avg_transaction
          type: REAL
          nullable: true
          description: The `avg_transaction` column stores the average transaction value as a real number, with possible null
            values.
        samples:
        - week_date_formatted: 2020-8-31
          week_date: '2020-08-31'
