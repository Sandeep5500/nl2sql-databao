      - name: customer_nodes
        columns:
        - name: customer_id
          type: INTEGER
          nullable: true
          description: customer_id is an integer column representing a unique identifier for a customer, allowing null values.
        - name: region_id
          type: INTEGER
          nullable: true
          description: The `region_id` column represents an integer identifier for a region associated with a customer-node
            relationship and can contain null values. It is distinct from `node_id`, which identifies a specific node, such
            as 3 or 5, whereas `region_id` refers to a broader geographic region, such as 3 or 5.
        - name: node_id
          type: INTEGER
          nullable: true
          description: The `node_id` column represents an integer identifier for a specific node associated with a customer-node
            relationship and can contain null values. It is distinct from `region_id`, which refers to a broader geographic
            region, such as 3 or 5, whereas `node_id` identifies a specific node, such as 3 or 5.
        - name: start_date
          type: TEXT
          nullable: true
          description: 'The `start_date` column stores the start date associated with a customer-node relationship as text,
            such as "2020-01-02". It is paired with `end_date`, which stores the corresponding end date, such as "2020-01-03".
            A query would use `start_date` to filter or sort records based on when the relationship began. Known sample values:
            ''2020-01-02'', ''2020-01-03'', ''2020-01-27'', ''2020-01-07'', ''2020-01-15''.'
        - name: end_date
          type: TEXT
          nullable: true
          description: 'The `end_date` column stores the end date associated with a customer-node relationship as text. Known
            sample values: ''2020-01-03'', ''2020-01-17'', ''2020-02-18'', ''2020-01-19'', ''2020-01-23''.'
        samples:
        - customer_id: 1
          region_id: 3
          node_id: 4
          start_date: '2020-01-02'
          end_date: '2020-01-03'
        - customer_id: 2
          region_id: 3
          node_id: 5
          start_date: '2020-01-03'
          end_date: '2020-01-17'
        - customer_id: 3
          region_id: 5
          node_id: 4
          start_date: '2020-01-27'
          end_date: '2020-02-18'
        - customer_id: 4
          region_id: 5
          node_id: 4
          start_date: '2020-01-07'
          end_date: '2020-01-19'
        - customer_id: 5
          region_id: 3
          node_id: 3
          start_date: '2020-01-15'
          end_date: '2020-01-23'
        description: The customer_nodes table links customers to nodes within specific regions, including start and end dates
          for each association.
        kind: table
      - name: customer_regions
        columns:
        - name: region_id
          type: INTEGER
          nullable: true
          description: Region identifier as an integer, which can contain null values.
        - name: region_name
          type: TEXT
          nullable: true
          description: A text column representing the name of a region, which can contain null values.
        samples:
