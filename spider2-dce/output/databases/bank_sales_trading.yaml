      - name: shopping_cart_campaign_identifier
        columns:
        - name: campaign_id
          type: INTEGER
          nullable: true
          description: campaign_id is an integer column that uniquely identifies a campaign, with null values allowed.
        - name: products
          type: TEXT
          nullable: true
          description: 'The "products" column contains text values indicating product ranges associated with each campaign,
            such as "1-3" or "4-5". Known sample values: ''1-3'', ''4-5'', ''6-8''.'
        - name: campaign_name
          type: TEXT
          nullable: true
          description: The campaign name associated with the shopping cart campaign.
        - name: start_date
          type: TEXT
          nullable: true
          description: 'The `start_date` column indicates the date when a campaign begins, stored as text and allowing null
            values. It is paired with the `end_date` column to define the campaign''s active period. For example, a campaign
            might start on "2020-01-01" and end on "2020-01-14". Known sample values: ''2020-01-01'', ''2020-01-15'', ''2020-02-01''.'
        - name: end_date
          type: TEXT
          nullable: true
          description: 'The `end_date` column stores the end date of a campaign as text, indicating when the campaign is no
            longer active. It is paired with the `start_date` column to define the campaign''s active period. For example,
            a campaign might start on "2020-01-01" and end on "2020-01-14". Known sample values: ''2020-01-14'', ''2020-01-28'',
            ''2020-03-31''.'
