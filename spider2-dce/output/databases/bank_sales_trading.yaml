          type: REAL
          nullable: true
          description: The `_month` column is a nullable REAL column representing the month portion of a date (e.g., 7.0 for
            July), typically used in conjunction with `_year` to form a complete time period. It differs from `month_year`
            in that it stores only the numeric month value rather than a combined text representation like "07-2018".
        - name: _year
          type: REAL
          nullable: true
          description: The `_year` column is a nullable REAL column representing the year portion of a date (e.g., 2018.0),
            typically used in conjunction with `_month` to form a complete time period. It differs from `month_year` in that
            it stores only the numeric year value rather than a combined text representation like "07-2018".
        - name: month_year
          type: TEXT
          nullable: true
          description: The `month_year` column is a TEXT column that stores a combined text representation of the month and
            year (e.g., "07-2018") associated with the interest metrics data. It differs from `_month` and `_year` in that
            it provides a human-readable format rather than separate numeric components like 7.0 and 2
        - name: interest_id
          type: REAL
          nullable: true
          description: interest_id is a nullable REAL column representing an identifier for different interests in the interest_metrics
