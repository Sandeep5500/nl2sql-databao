        description: A table containing customer transaction records, including customer ID, transaction date, type, and amount.
        kind: table
      - name: interest_map
        columns:
        - name: id
          type: INTEGER
          nullable: true
          description: The `id` column is an integer field that uniquely identifies each record in the `interest_map` table.
        - name: interest_name
          type: TEXT
          nullable: true
          description: A text field storing the name of an interest or consumer group.
        - name: interest_summary
          type: TEXT
          nullable: true
          description: A text field containing a brief description of the interest, such as common behaviors or preferences
            associated with the interest group.
        - name: created_at
          type: TEXT
          nullable: true
          description: 'A text field storing the date and time when a record was created, in ISO format (e.g., 2016-05-26
            14:57:59). This column differs from `last_modified`, which records the most recent update time, and should be
            used when querying for the original creation timestamp of a record. Known sample values: ''2016-05-26 14:57:59''.'
        - name: last_modified
          type: TEXT
          nullable: true
          description: 'The `last_modified` column stores the date and time when an entry was last updated, in ISO format
            (e.g., 2018-05-23 11:30:12). It differs from `created_at`, which records when the record was first added, and
            should be used when querying for the most recent activity or changes to a record. Known sample values: ''2018-05-23
            11:30:12''.'
