          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): 9999-99-99
            99:99:99 63% e.g. ''2016-10-01 12:00:00'', 99999A 10% e.g. ''98900e'',
            99A999 10% e.g. ''87b575''.'
        - name: user_id
          type: varchar(255)
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): A999 37% e.g.
            ''U001'', 9A 27% e.g. ''0CVKaz'', 9A9A 17% e.g. ''2bGs3i''. The user_id
            column contains values such as ''U001'', ''U002'', ''0CVKaz'', and ''1QceiB'',
            which vary in format and length.'
        - name: action
          type: varchar(255)
          nullable: true
          description: 'Values: text; values: view (11), 1CwlSX (4), 6SN6DD (4), 3JMO2k
            (3), EFnoNR (2), FGkTe9 (2), KBlKgT (2), 7Dn99b (1), KKTw9P (1). The access_log
            table''s action column contains the distinct values: EFnoNR, 3JMO2k, KKTW9P,
            6SN6DD, 1CwlSX, FGkTe9, view, KBlKgT, and 7Dn99b.'
        - name: stamp
          type: varchar(255)
          nullable: true
          description: 'Values: text; formats (9 = digit, A = letters): /A 63% e.g.
            ''/detail'', 9999-99-99 99:99:99 37% e.g. ''2016-01-01 18:00:00''. The
            access_log table contains rows where the stamp column holds timestamp
            values (e.g., ''2016-01-01 18:00:00'') and rows where it holds URL paths
            (e.g., ''/detail'', ''/search'', ''/top'').'
        samples:
        - session: 98900e
          user_id: U001
          action: view
          stamp: '2016-01-01 18:00:00'
        - session: 98900e
          user_id: U001
          action: view
          stamp: '2016-01-02 20:00:00'
        - session: 98900e
          user_id: U001
          action: view
          stamp: '2016-01-03 22:00:00'
        - session: 1cf768
          user_id: U002
          action: view
          stamp: '2016-01-04 23:00:00'
        - session: 1cf768
          user_id: U002
          action: view
          stamp: '2016-01-05 00:30:00'
        description: 'The access_log table records access events. The ''session''
          column contains session IDs and timestamp strings. The ''stamp'' column
          contains timestamps and URL paths. one row per (session, stamp) — A single
          session access event  [no declared key; proposed by an LLM and verified
          unique in the data] The access_log table contains rows with two different
          column structures: one with four columns (session, user_id, action, stamp)
          and another with four columns (stamp, user_id, action, path). The access_log
          table contains session values that are both hexadecimal strings (e.g., ''1cf768'')
          and timestamp strings (e.g., ''2016-10-01 12:00:00'').'
