        - name: order_item_id
          type: BIGINT
          nullable: true
          description: order_item_id is a nullable BIGINT column representing the
            unique identifier for each item within an order, used to distinguish multiple
            items in the same order. This column is typically used in conjunction
            with order_id to uniquely identify an order item, especially when an order
            contains multiple products.
        - name: product_id
