          description: customer_id is a nullable text field that uniquely identifies
            a customer record in the olist_customers table. Unlike customer_unique_id,
            which may represent a customer's unique identity across systems, customer_id
            is specific to the olist_customers table and is used when querying for
            individual records within this table.
