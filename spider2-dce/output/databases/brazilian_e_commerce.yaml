            table, customer_unique_id may be used in joins with other tables. For
            example, customer_id might be "06b8999e2fba1a1fbc88172c00ba8bc7", while
            customer_unique_id might be "861eff4711a542e4b93843c6dd7febb0".
        - name: customer_zip_code_prefix
