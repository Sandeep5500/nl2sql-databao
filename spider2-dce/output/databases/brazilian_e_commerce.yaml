        - name: payment_installments
          type: BIGINT
          nullable: true
          description: The number of installments into which a payment is divided,
            indicating how many parts the `payment_value` will be paid over time.
            This column is used to understand the payment plan for a specific `order_id`.
            For example, a value of 8 means the payment will be split into 8 installments.
        - name: payment_value
