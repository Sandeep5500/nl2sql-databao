      - name: olist_order_payments
        columns:
        - name: order_id
          type: TEXT
          nullable: true
          description: A unique identifier for an order, represented as text.
        - name: payment_sequential
          type: BIGINT
          nullable: true
          description: A sequential number representing the order of payments within
