            identifier of the seller associated with an order item.
        - name: shipping_limit_date
          type: TEXT
          nullable: true
          description: shipping_limit_date is a nullable TEXT column representing
            the deadline by which an order item must be shipped. It differs from other
            date-related fields in the table, such as order_id, which contains values
            like "00010242fe8c5a6d1ba2dd792cb16214", whereas shipping_limit_date contains
            date-time values like "2017-09-19 09:45:35". This column is used to determine
            shipping deadlines for individual items.
        - name: price
          type: FLOAT
          nullable: true
          description: The price of the product in the order item.
        - name: freight_value
          type: FLOAT
          nullable: true
