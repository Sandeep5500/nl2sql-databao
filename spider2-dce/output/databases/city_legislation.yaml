          nullable: true
          description: 'Values: text; values: Once (6490), Weekly (6300), Never (6290),
            Daily (6283), Seldom (6201), Yearly (6192), Often (6167), Monthly (6077).
            The feeding_frequency column in the aliens_details table contains text
            labels including ''Daily'', ''Monthly'', ''Never'', ''Often'', ''Once'',
            ''Seldom'', ''Weekly'', and ''Yearly''.'
        - name: aggressive
