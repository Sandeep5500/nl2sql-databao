          nullable: true
          description: The "class" column represents the Senate class designation for a legislator's term, indicating the
            order in which the term begins, typically used for staggered Senate terms.
        - name: party
          type: TEXT
          nullable: true
          description: 'The `party` column indicates the political party affiliation of the legislator during their term.
