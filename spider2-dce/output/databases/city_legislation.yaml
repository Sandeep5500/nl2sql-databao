        - name: last_name
          type: TEXT
          nullable: true
          description: A column containing the last names of individuals, with text data type and nullable values.
        - name: email
          type: TEXT
          nullable: true
          description: The email column contains text values representing email addresses, with null values allowed.
        - name: gender
          type: TEXT
          nullable: true
          description: 'Gender of the alien, represented as text (e.g., male, female, non-binary). Known sample values: ''non-binary'',
            ''female'', ''male''.'
        - name: type
          type: TEXT
          nullable: true
          description: 'The `type` column contains text values describing the classification or species of the alien, such
            as "reptile," "flatwoods," "nordic," or "green." Known sample values: ''reptile'', ''flatwoods'', ''nordic'',
            ''green''.'
        - name: birth_year
          type: INTEGER
          nullable: true
          description: The `birth_year` column stores the year an alien was born, represented as an integer. It allows null
            values.
        - name: age
          type: INTEGER
          nullable: true
          description: The `age` column stores the age of the alien as an integer, and can contain null values.
        - name: favorite_food
          type: TEXT
          nullable: true
          description: 'The `favorite_food` column contains text values representing the preferred food of each alien in the
            dataset. Known sample values: ''white-faced tree rat'', ''lizard, goanna'', ''indian red admiral'', ''bandicoot,
            southern brown'', ''kangaroo, red''.'
        - name: feeding_frequency
          type: TEXT
          nullable: true
          description: 'A text field indicating how often an alien needs to be fed, such as "weekly," "seldom," "often," or
            "once." Known sample values: ''weekly'', ''seldom'', ''often'', ''once''.'
        - name: aggressive
          type: INTEGER
          nullable: true
          description: The "aggressive" column is an integer field indicating whether an alien is aggressive, with 1 representing
            aggressive and 0 representing non-aggressive.
        - name: occupation
          type: TEXT
          nullable: true
          description: 'The "occupation" column contains text data representing the job or profession of the individuals in
            the alien_data table. Known sample values: ''senior cost accountant'', ''senior sales associate'', ''registered
            nurse'', ''director of sales'', ''administrative officer''.'
        - name: current_location
          type: TEXT
          nullable: true
          description: The `current_location` column is a nullable TEXT column representing the current city or place of residence
            for the alien, such as "cincinnati" or "bethesda." It differs from the `state` column, which represents the state
            (e.g., "ohio" or "maryland") and the `country` column, which typically holds "united states." A query would use
            `current_location` for city-level filtering or analysis, while `state` or `country` would be used for broader
            geographic groupings.
        - name: state
          type: TEXT
          nullable: true
          description: The `state` column is a nullable TEXT column representing the state where each alien is currently located,
            such as "ohio" or "maryland." It differs from `current_location`, which provides a more specific city or place
            (e.g., "cincinnati" or "bethesda"), and from `country`, which typically holds "united states." A query would use
            `state` for regional or state-level analysis, while `current_location` would be used for more localized data.
        - name: us_region
          type: TEXT
          nullable: true
          description: 'us_region is a text column that represents the regional classification within the United States, such
            as "great lakes" or "southeast." Known sample values: ''great lakes'', ''mideast'', ''far west'', ''southeast''.'
        - name: country
          type: TEXT
          nullable: true
          description: 'The `country` column is a nullable TEXT column representing the country of each alien''s current location
            Known sample values: ''united states''.'
