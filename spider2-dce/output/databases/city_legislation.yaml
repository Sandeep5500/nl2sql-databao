          type: TEXT
          nullable: true
          description: 'The `term_start` column stores the start date of a legislative term as text, typically in the format
            "YYYY-MM-DD". It is paired with the `term_end` column to define the duration of a term. For example, a term might
            start on "1993-01-05" and end on "1995-01-03". Known sample values: ''1993-01-05'', ''1987-01-06'', ''1983-01-03'',
            ''2007-01-04''.'
        - name: term_end
          type: TEXT
          nullable: true
