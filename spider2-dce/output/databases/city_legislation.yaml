        description: One row per alien's basic profile (id, name, email, gender, type,
          birth_year). This table is the core identity table; join to aliens_details
          on id=detail_id for behavioral data, to aliens_location on id=loc_id for
          location/occupation data, and to alien_data on id for the full denormalized
          record. one row per (id) — an individual alien's basic profile  [no declared
          key; proposed by an LLM and verified unique in the data] The alien_data
          table contains columns including id, first_name, last_name, email, gender,
          type, birth_year, age, favorite_food, feeding_frequency, aggressive, occupation,
          current_location, state, us_region, and country.
        kind: table
