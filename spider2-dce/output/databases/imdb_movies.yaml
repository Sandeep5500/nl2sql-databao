      - name: director_mapping
        columns:
        - name: movie_id
          type: TEXT
          nullable: true
          description: A column containing identifiers for movies, represented as
            text and allowing null values. This column uniquely identifies movies
            and is typically used in conjunction with the `name_id` column to map
            movies to directors. Sample values include `tt0038733` and `tt0060908`,
            which differ from the `name_id` values such as `nm0003836` and `nm0696247`.
        - name: name_id
          type: TEXT
          nullable: true
          description: A nullable text column representing a name identifier, typically
            used to reference individuals such as directors. This column is often
            used in conjunction with the `movie_id` column to map directors to movies.
            Sample values include `nm0003836` and `nm0696247`, which differ from the
            `movie_id` values such as `tt0038733` and `tt0060908`.
        samples:
        - movie_id: tt0038733
          name_id: nm0003836
        - movie_id: tt0038733
          name_id: nm0696247
        - movie_id: tt0060908
          name_id: nm0003606
        - movie_id: tt0069049
          name_id: nm0000080
        - movie_id: tt0082620
          name_id: nm0716460
        description: A table that maps movie IDs to director name IDs, containing
          references between movies and directors.
        kind: table
      - name: genre
        columns:
        - name: movie_id
          type: TEXT
          nullable: true
          description: A column containing the unique identifier for a movie, represented
            as text.
        - name: genre
          type: TEXT
          nullable: true
          description: A column named "genre" of type TEXT that can contain null values.
        samples:
        - movie_id: tt0012494
          genre: Thriller
        - movie_id: tt0012494
          genre: Fantasy
        - movie_id: tt0012494
          genre: Drama
        - movie_id: tt0038733
          genre: Fantasy
        - movie_id: tt0038733
          genre: Drama
        description: A table that maps movie IDs to their associated genres, with
          each row representing a single genre for a movie.
        kind: table
      - name: movies
        columns:
        - name: id
          type: TEXT
          nullable: true
          description: The `id` column contains unique identifiers for each movie
            entry, represented as text values.
        - name: title
          type: TEXT
          nullable: true
          description: The `title` column contains the titles of movies, stored as
            text and allowing null values.
        - name: year
          type: INTEGER
          nullable: true
          description: The `year` column stores the year a movie was published as
            an integer and allows null values. It provides a simplified date reference
            compared to `date_published`, which stores the full timestamp. For example,
            `year` might store 2017, while `date_published` could store 2017-06-09
            00:00:00.
        - name: date_published
          type: TIMESTAMP
          nullable: true
          description: The `date_published` column stores the full timestamp of when
            a movie was published and allows null values. It provides more precise
            timing than the `year` column, which only stores the year. For example,
            `date_published` might store 2017-06-09 00:00:00, while `year` would store
            2017.
        - name: duration
          type: INTEGER
          nullable: true
          description: The `duration` column represents the length of a movie in minutes.
        - name: country
          type: TEXT
          nullable: true
          description: The "country" column contains textual data indicating the country
            associated with each movie, and it allows null values.
        - name: worlwide_gross_income
          type: TEXT
          nullable: true
          description: The `worlwide_gross_income` column stores the total global
            income generated by a movie, represented as text and often including currency
            symbols.
        - name: languages
          type: TEXT
          nullable: true
          description: A text field containing the languages associated with a movie,
            often listed as a comma-separated value.
        - name: production_company
          type: TEXT
          nullable: true
          description: The `production_company` column contains the name of the company
            responsible for producing the movie, stored as text.
        samples:
        - id: tt0012494
          title: Der müde Tod
          year: 2017
          date_published: '2017-06-09 00:00:00'
          duration: 97
          country: Germany
          worlwide_gross_income: $ 12156
          languages: German
          production_company: Decla-Bioscop AG
        - id: tt0038733
          title: A Matter of Life and Death
          year: 2017
          date_published: '2017-12-08 00:00:00'
          duration: 104
          country: UK
          worlwide_gross_income: $ 124241
          languages: English, French, Russian
          production_company: The Archers
        - id: tt0361953
          title: The Nest of the Cuckoo Birds
          year: 2017
          date_published: '2017-10-16 00:00:00'
          duration: 81
          country: USA
          languages: English
          production_company: Bert Williams Motion Pictures and Distributor
        - id: tt0235166
          title: Against All Hope
          year: 2017
          date_published: '2017-10-20 00:00:00'
          duration: 90
          country: USA
          languages: English
        - id: tt0337383
          title: Vaikai is Amerikos viesbucio
          year: 2017
          date_published: '2017-03-09 00:00:00'
          duration: 88
          country: Soviet Union
          languages: Lithuanian, Russian
          production_company: Lietuvos Kinostudija
        description: A table containing movie details such as title, year, publication
          date, duration, country, worldwide gross income, languages, and production
          company.
        kind: table
      - name: names
        columns:
        - name: id
          type: TEXT
          nullable: true
          description: The `id` column contains unique identifier values as text,
            with some entries allowing null values.
        - name: name
          type: TEXT
          nullable: true
          description: The `name` column contains textual data representing names
            of individuals, with possible null values.
        - name: height
          type: REAL
          nullable: true
          description: The `height` column stores the height of individuals in real
            numbers, with some entries allowing null values.
        - name: date_of_birth
          type: TEXT
          nullable: true
          description: The `date_of_birth` column stores the birth dates of individuals
            as text, with some entries allowing null values.
        - name: known_for_movies
          type: TEXT
          nullable: true
          description: The `known_for_movies` column contains identifiers for movies
            the person is known for, such as "tt3402236" and "tt4686844". This column
            is distinct from the `id` column, which contains unique identifiers for
            individuals, such as "nm0000002" and "nm0000110". A query would use this
            column to find information about a person's filmography, rather than their
            personal identification or biographical details.
        samples:
        - id: nm0000002
          name: Lauren Bacall
          height: 174.0
          date_of_birth: '1924-09-16'
        - id: nm0000110
          name: Kenneth Branagh
          height: 177.0
          date_of_birth: '1960-12-10'
          known_for_movies: tt3402236
        - id: nm0000009
          name: Richard Burton
          height: 175.0
          date_of_birth: '1925-11-10'
        - id: nm0000114
          name: Steve Buscemi
          height: 175.0
          date_of_birth: '1957-12-13'
          known_for_movies: tt4686844
        - id: nm0000014
          name: Olivia de Havilland
          height: 163.0
          date_of_birth: '1916-07-01'
        description: A table containing information about individuals, including their
          ID, name, height, date of birth, and notable movies.
        kind: table
      - name: ratings
        columns:
        - name: movie_id
          type: TEXT
          nullable: true
          description: A text field containing the unique identifier for a movie,
            which can be null.
        - name: avg_rating
          type: REAL
          nullable: true
          description: The `avg_rating` column stores the average rating for a movie
            as a real number, typically used for calculating overall popularity or
            quality. It differs from `median_rating`, which represents the middle
            value of all ratings. For example, a movie with an `avg_rating` of 7.7
            may have a `median_rating` of 8.0, indicating a skewed distribution of
            ratings.
        - name: total_votes
          type: INTEGER
          nullable: true
          description: A column storing the total number of votes for a movie, represented
            as an integer value.
        - name: median_rating
          type: REAL
          nullable: true
          description: The `median_rating` column stores the median rating of a movie
            as a real number, representing the middle value of all ratings and being
            less sensitive to outliers than `avg_rating`. It differs from `avg_rating`,
            which is the arithmetic mean. For example, a movie with an `avg_rating`
            of 7.7 may have a `median_rating` of 8.0, indicating a skewed distribution
            of ratings.
        samples:
        - movie_id: tt0012494
          avg_rating: 7.7
          total_votes: 4695
          median_rating: 8.0
        - movie_id: tt0038733
          avg_rating: 8.1
          total_votes: 17693
          median_rating: 8.0
        - movie_id: tt0060908
          avg_rating: 7.5
          total_votes: 3392
          median_rating: 8.0
        - movie_id: tt0069049
          avg_rating: 6.9
          total_votes: 5014
          median_rating: 7.0
        - movie_id: tt0071145
          avg_rating: 8.2
          total_votes: 789
          median_rating: 8.0
        description: The ratings table contains movie rating statistics, including
          average and median ratings, total votes, and movie identifiers.
        kind: table
      - name: role_mapping
        columns:
        - name: movie_id
          type: TEXT
          nullable: true
          description: The `movie_id` column stores textual identifiers for movies,
            such as "tt0038733" and "tt0060908", and allows null values. It is used
            to link a role or name to a specific movie, in contrast to `name_id`,
            which stores identifiers for individuals like actors or actresses.
        - name: name_id
          type: TEXT
          nullable: true
          description: The `name_id` column stores textual identifiers for individuals,
            such as "nm0000057" and "nm0001375", typically representing actors or
            actresses, and allows null values. It is used to link a role or movie
            to a specific person, in contrast to `movie_id`, which stores identifiers
            for movies like "tt0038733" and "tt0060908".
        - name: category
          type: TEXT
          nullable: true
          description: The `category` column stores textual values indicating the
            role type, such as "actor" or "actress", and allows null values. It is
            used to specify the nature of the role associated with a `name_id` and
            `movie_id`, distinguishing between different types of contributions to
            a film
        samples:
        - movie_id: tt0038733
          name_id: nm0000057
          category: actor
        - movie_id: tt0038733
          name_id: nm0001375
          category: actress
        - movie_id: tt0038733
          name_id: nm0178509
          category: actor
        - movie_id: tt0038733
          name_id: nm0126402
          category: actress
        - movie_id: tt0060908
          name_id: nm0000869
          category: actor
        description: The role_mapping table links movie IDs with name IDs and specifies
          the category (e.g., actor, actress) for each association.
        kind: table
      description: The main schema contains several tables including ERD, director_mapping,
        genre, movies, names, ratings, and role_mapping.
    description: The default catalog contains a schema named "main" with multiple
      tables related to movies, including information about movie details, genres,
      ratings, director and role mappings, and cast member data.
