    - name: main
      tables:
      - name: Country
        columns:
        - name: id
          type: INTEGER
          nullable: false
          description: 'Values: integer 1 .. 24558; values: 1 (1), 10257 (1), 13274
            (1), 15722 (1), 1729 (1), 17642 (1), 19694 (1), 21518 (1), 24558 (1),
            4769 (1), 7809 (1).'
        - name: name
          type: TEXT
          nullable: true
          description: 'Values: text; values: Belgium (1), England (1), France (1),
            Germany (1), Italy (1), Netherlands (1), Poland (1), Portugal (1), Scotland
            (1), Spain (1), Switzerland (1).'
        samples:
        - id: 1
          name: Belgium
        - id: 1729
          name: England
        - id: 4769
          name: France
        - id: 7809
          name: Germany
        - id: 10257
          name: Italy
        description: 'One row per country represented in the dataset. Each country
          has exactly one league and one or more matches recorded. primary key (declared):
          (id)'
        kind: table
        primary_key:
          name: pk_Country
          columns:
          - id
          validated: true
        unique_constraints:
        - name: sqlite_autoindex_Country_1
          columns:
          - name
          validated: true
      - name: League
        columns:
        - name: id
          type: INTEGER
          nullable: false
          description: 'Values: integer 1 .. 24558; values: 1 (1), 10257 (1), 13274
            (1), 15722 (1), 1729 (1), 17642 (1), 19694 (1), 21518 (1), 24558 (1),
            4769 (1), 7809 (1). The Match table contains 11 distinct league_id values:
            1, 1729, 4769, 7809, 10257, 13274, 15722, 17642, 19694, 21518, and 24558.'
        - name: country_id
          type: INTEGER
          nullable: true
          description: 'Values: integer 1 .. 24558; values: 1 (1), 10257 (1), 13274
            (1), 15722 (1), 1729 (1), 17642 (1), 19694 (1), 21518 (1), 24558 (1),
            4769 (1), 7809 (1). The query joins the League table with the Country
            table on League.country_id equaling Country.id. For all 11 returned rows,
            the League.id value is identical to the League.country_id value, and the
            Country.name column contains the name of the country associated with each
            league.'
        - name: name
          type: TEXT
          nullable: true
          description: 'Values: text; values: Belgium Jupiler League (1), England
            Premier League (1), France Ligue 1 (1), Germany 1. Bundesliga (1), Italy
            Serie A (1), Netherlands Eredivisie (1), Poland Ekstraklasa (1), Portugal
            Liga ZON Sagres (1), Scotland Premier League (1), Spain LIGA BBVA (1),
            Switzerland Super League (1).'
        samples:
        - id: 1
          country_id: 1
          name: Belgium Jupiler League
        - id: 1729
          country_id: 1729
          name: England Premier League
        - id: 4769
          country_id: 4769
          name: France Ligue 1
        - id: 7809
          country_id: 7809
          name: Germany 1. Bundesliga
        - id: 10257
          country_id: 10257
          name: Italy Serie A
        description: 'This table lists 11 major European leagues, one per country.
          Each row represents a unique league identified by its id, which is also
          used as the league_id in the Match table. primary key (declared): (id) The
          Match table contains 25979 matches referencing 11 distinct league IDs.'
        kind: table
        primary_key:
          name: pk_League
          columns:
          - id
          validated: true
        unique_constraints:
        - name: sqlite_autoindex_League_1
          columns:
          - name
          validated: true
        foreign_keys:
        - name: fk_League_0
          mapping:
          - from_column: country_id
            to_column: id
          referenced_table: main.country
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
