      - name: League
        columns:
        - name: id
          type: INTEGER
          nullable: false
          description: 'The `id` column is an integer that uniquely identifies each
            league and cannot be null. [Profile] never null; 11 distinct (unique per
            row); all values: 1 (1), 1729 (1), 4769 (1), 7809 (1), 10257 (1), 13274
            (1), 15722 (1), 17642 (1), 19694 (1), 21518 (1), 24558 (1).'
        - name: country_id
          type: INTEGER
          nullable: true
          description: 'The `country_id` column is a nullable integer that serves
            as a foreign key linking the league to its associated country. It differs
            from the `id` column, which uniquely identifies each league, by referencing
            the country''s identifier instead. For example, a league with `id` 1729
            might have a `country_id` of 1. [Profile] joins to Country.id (1:1, 100%
            of values match); never null; 11 distinct (unique per row); all values:
            1 (1), 1729 (1), 4769 (1), 7809 (1), 10257 (1), 13274 (1), 15722 (1),
            17642 (1), 19694 (1), 21518 (1), 24558 (1).'
        - name: name
          type: TEXT
          nullable: true
          description: 'The `name` column stores the textual name of the league and
            can contain null values. It differs from the `id` and `country_id` columns,
            which are numeric identifiers, by providing a human-readable label for
            the league. For example, a league with `id` 1729 might have the `name`
            "England Premier League". [Profile] never null; 11 distinct (unique per
            row); all values: Belgium Jupiler League (1), England Premier League (1),
            France Ligue 1 (1), Germany 1. Bundesliga (1), Italy Serie A (1), Netherlands
            Eredivisie (1), Poland Ekstraklasa (1), Portugal Liga ZON Sagres (1),
            Scotland Premier League (1), Spain LIGA BBVA (1), Switzerland Super League
            (1).'
