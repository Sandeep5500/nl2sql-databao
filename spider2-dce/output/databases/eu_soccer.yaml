            4769 (3040), 10257 (3017), 13274 (2448), 7809 (2448), 17642 (2052), 15722
            (1920), 19694 (1824), 1 (1728), 24558 (1422).'
        - name: season
          type: TEXT
          nullable: true
          description: 'Values: text; values: 2008/2009 (3326), 2015/2016 (3326),
            2014/2015 (3325), 2010/2011 (3260), 2012/2013 (3260), 2009/2010 (3230),
            2011/2012 (3220), 2013/2014 (3032). The ''season'' column in the ''Match''
            table contains values in ''YYYY/YYYY'' format, such as ''2008/2009'',
            with counts ranging from 3032 to 3326 for seasons between 2008/2009 and
            2015/2016.'
        - name: stage
