          country_id: 4769
          name: France Ligue 1
        - id: 1
          country_id: 1
          name: Belgium Jupiler League
        - id: 13274
          country_id: 13274
          name: Netherlands Eredivisie
        - id: 19694
          country_id: 19694
          name: Scotland Premier League
        - id: 17642
          country_id: 17642
          name: Portugal Liga ZON Sagres
        description: 'A table containing information about sports leagues, including
          an identifier, associated country, and league name. Each league must have
          a unique name, and the country_id references the country table. [Structure]
          11 rows. Grain: one row per (id). Joins: country_id -> Country.id [1:1,
