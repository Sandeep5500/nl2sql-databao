      - name: genres
        columns:
        - name: GenreId
          type: INTEGER
          nullable: false
          description: GenreId is an integer column that uniquely identifies each
            genre and cannot be null. It serves as the primary key for the genres
            table and is typically used in joins or filters where a specific genre
            reference is needed, unlike the Name column which holds the genre's textual
            label.
        - name: Name
          type: NVARCHAR(120)
          nullable: true
          description: The Name column stores genre names as variable-length text,
            up to 120 characters, and allows null values. It is used when querying
            or displaying the human-readable name of a genre, whereas the GenreId
            column is used for referencing or joining with other tables.
        samples:
        - genreid: 1
          name: Rock
        - genreid: 2
          name: Jazz
        - genreid: 3
          name: Metal
        - genreid: 4
          name: Alternative & Punk
        - genreid: 5
          name: Rock And Roll
        description: A table containing genre information with unique identifiers
          and names, commonly used for categorizing music or content types.
        kind: table
        primary_key:
          name: pk_genres
          columns:
          - GenreId
          validated: true
