        - name: Company
          type: NVARCHAR(80)
          nullable: true
          description: The Company column stores the name of the customer's company,
            with a maximum length of 80 characters. It can contain null values.
        - name: Address
          type: NVARCHAR(70)
          nullable: true
          description: Address field for the customer, storing street information.
        - name: City
          type: NVARCHAR(40)
          nullable: true
          description: City is a nullable column of type NVARCHAR(40) that stores
            the city name associated with a customer's address.
        - name: State
          type: NVARCHAR(40)
          nullable: true
          description: The "State" column stores the state or province information
