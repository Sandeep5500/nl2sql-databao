          nullable: true
          description: A unique identifier for each row, stored as a text value.
        - name: modifieddate
          type: DATE
          nullable: true
          description: The `modifieddate` column stores the date when a record was
            last modified, with values such as '2008-04-30 00:00:00'. It is a nullable
            DATE type field.
