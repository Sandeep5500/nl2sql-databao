      - name: salesperson
        columns:
        - name: businessentityid
          type: INTEGER
          nullable: true
          description: The `businessentityid` column is an integer that uniquely identifies
            a business entity and allows null values.
        - name: territoryid
          type: INTEGER
          nullable: true
          description: territoryid is an integer column representing the sales territory
            associated with the salesperson.
        - name: salesquota
          type: INTEGER
          nullable: true
          description: The `salesquota` column represents the annual sales target
            for a salesperson, stored as an integer value. It can contain null values.
        - name: bonus
          type: INTEGER
          nullable: true
          description: The `bonus` column represents an integer value indicating the
            bonus amount for a salesperson, which can be null.
        - name: commissionpct
          type: FLOAT
          nullable: true
          description: The `commissionpct` column stores the commission percentage
            as a floating-point number and allows null values.
        - name: salesytd
          type: FLOAT
          nullable: true
          description: The `salesytd` column represents the total sales amount for
            the current year, stored as a floating-point number and allowing null
            values. It contrasts with `saleslastyear`, which tracks the total sales
            amount for the previous year. For example, a salesperson might have `salesytd`
            of 559697.5639 and `saleslastyear` of 0.0.
        - name: saleslastyear
          type: FLOAT
          nullable: true
          description: The `saleslastyear` column stores the total sales amount for
            the previous year as a floating-point number and allows null values. It
            contrasts with `salesytd`, which tracks the total sales amount for the
            current year. For example, a salesperson might have `saleslastyear` of
            1750406.4785 and `salesytd` of 559697.5639.
        - name: rowguid
          type: TEXT
          nullable: true
          description: A unique identifier for each row, stored as text.
        - name: modifieddate
          type: DATE
          nullable: true
          description: The `modifieddate` column stores the date when a record was
            last modified, with values such as '2010-12-28 00:00:00'. It is a nullable
            DATE type field.
