      - name: salesorderdetail
        columns:
        - name: salesorderid
          type: INTEGER
          nullable: true
          description: The `salesorderid` column is an integer that uniquely identifies
            a sales order and is used to link multiple sales order detail entries
            (`salesorderdetailid`) to the same sales order. It allows null values
            and is distinct from `salesorderdetailid`, which uniquely identifies individual
            line items within an order. For example, while `salesorderid` might be
            43659, `salesorderdetailid` values for that order could be 1, 2, 3, etc.
        - name: salesorderdetailid
          type: INTEGER
          nullable: true
          description: The `salesorderdetailid` column is an integer that uniquely
            identifies each sales order detail entry and is used to distinguish individual
            line items within a single sales order. It differs from `salesorderid`,
            which identifies the overall sales order. For example, while `salesorderid`
            might be 43659, `salesorderdetailid` values for that order could be 1,
            2, 3, etc.
        - name: carriertrackingnumber
          type: TEXT
          nullable: true
          description: carriertrackingnumber is a nullable TEXT column used to store
            tracking numbers for sales order shipments.
        - name: orderqty
          type: INTEGER
          nullable: true
          description: The `orderqty` column represents the quantity of a product
            ordered, stored as an integer value that can be null.
        - name: productid
          type: INTEGER
          nullable: true
          description: The `productid` column is an integer that identifies the specific
            product associated with a sales order detail entry. It is used in conjunction
            with `salesorderdetailid
        - name: specialofferid
          type: INTEGER
          nullable: true
          description: The `specialofferid` column is an integer that identifies the
            special offer associated with the sales order detail.
        - name: unitprice
          type: FLOAT
          nullable: true
          description: The unitprice column stores the price per unit of a product
            in sales orders, represented as a floating-point number and allowing null
            values.
        - name: unitpricediscount
          type: FLOAT
          nullable: true
          description: The `unitpricediscount` column stores the discount applied
            to the unit price, represented as a floating-point number. It allows null
            values.
        - name: rowguid
          type: TEXT
          nullable: true
          description: A unique identifier for each row, stored as text.
        - name: modifieddate
          type: DATE
          nullable: true
          description: The `modifieddate` column stores the date when a record was
            last modified, with values such as '2011-05-31 00:00:00'. It is a nullable
            DATE type field.
