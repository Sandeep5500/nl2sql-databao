      - name: salesorderheader
        columns:
        - name: salesorderid
          type: INTEGER
          nullable: true
          description: The salesorderid column is an integer field that uniquely identifies
            each sales order.
        - name: revisionnumber
          type: INTEGER
          nullable: true
          description: The `revisionnumber` column stores an integer value indicating
            the revision number of a sales order, and it allows null values.
        - name: orderdate
          type: DATE
          nullable: true
          description: The `orderdate` column stores the date when the sales order
            was placed, with a nullable DATE type.
        - name: duedate
          type: DATE
          nullable: true
          description: The `duedate` column stores the date by which an order is expected
            to be completed, with nullable values.
        - name: shipdate
          type: DATE
          nullable: true
          description: The `shipdate` column stores the date when the order was shipped,
            with nullable values.
        - name: STATUS
          type: TEXT
          nullable: true
          description: The STATUS column stores the current status of a sales order
            as text, with values such as '5' indicating a specific status code.
        - name: onlineorderflag
          type: BOOLEAN
          nullable: true
          description: A boolean flag indicating whether the order was placed online.
        - name: purchaseordernumber
          type: TEXT
          nullable: true
          description: The `purchaseordernumber` column contains text values representing
            the purchase order numbers associated with each sales order.
        - name: accountnumber
          type: TEXT
          nullable: true
          description: The accountnumber column stores text-based account identifiers,
            often used to reference customer accounts.
        - name: customerid
          type: INTEGER
          nullable: true
          description: customerid is an integer column representing the unique identifier
            for the customer associated with the sales order.
        - name: salespersonid
          type: INTEGER
          nullable: true
          description: The salespersonid column represents the unique identifier for
            the salesperson associated with each sales order.
        - name: territoryid
          type: INTEGER
          nullable: true
          description: The `territoryid` column represents an integer identifier for
            the sales territory associated with the order, and it can contain null
            values.
        - name: billtoaddressid
          type: INTEGER
          nullable: true
          description: The `billtoaddressid` column stores the identifier for the
            billing address associated with a sales order, as an integer value. It
            differs from `shiptoaddressid`, which identifies the shipping address.
            For example, a billing address might have an ID like 985, while the shipping
            address for the same order might also be 985 or a different ID like 921.
        - name: shiptoaddressid
          type: INTEGER
          nullable: true
          description: The `shiptoaddressid` column stores the integer identifier
            for the shipping address associated with a sales order. It is nullable,
            indicating that a shipping address may not always be specified. This column
            differs from `billtoaddressid`, which identifies the billing address.
            For example, a billing address might have an ID like 985, while the shipping
            address for the same order might also be 985 or a different ID like 921.
        - name: shipmethodid
          type: INTEGER
          nullable: true
          description: The `shipmethodid` column represents the identifier for the
            shipping method used for the sales order.
        - name: creditcardid
          type: INTEGER
          nullable: true
          description: The `creditcardid` column stores an integer value representing
            the identifier for a credit card associated with a sales order.
        - name: creditcardapprovalcode
          type: TEXT
          nullable: true
          description: The `creditcardapprovalcode` field stores the approval code
            provided by the payment processor for a credit card transaction. It is
            a text field and can contain null values.
        - name: currencyrateid
          type: INTEGER
          nullable: true
          description: currencyrateid is an integer column that stores the identifier
            for the currency exchange rate associated with the sales order. It can
            contain null values.
        - name: subtotal
          type: FLOAT
          nullable: true
          description: The subtotal represents the total amount of the order before
            tax and freight.
        - name: taxamt
          type: FLOAT
          nullable: true
          description: taxamt is a floating-point column representing the amount of
            tax associated with a sales order.
        - name: freight
          type: FLOAT
          nullable: true
          description: Freight represents the shipping cost associated with a sales
            order.
        - name: totaldue
          type: FLOAT
          nullable: true
          description: The `totaldue` column represents the total amount due for a
            sales order, including subtotal, tax, and freight. It is stored as a floating-point
            number and can contain null values. This column
        - name: comment
          type: TEXT
          nullable: true
          description: The `comment` column stores optional textual notes or remarks
            related to a sales order, with the ability to contain null values.
        - name: rowguid
          type: TEXT
          nullable: true
          description: A unique identifier for the row, represented as a text string.
        - name: modifieddate
          type: DATE
          nullable: true
          description: The `modifieddate` column stores the date when the record was
            last modified, with values such as '2011-06-07 00:00:00'.
