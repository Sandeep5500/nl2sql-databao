          fromcurrencycode: USD
          tocurrencycode: BRL
          averagerate: 1.9379
          endofdayrate: 1.9419
          modifieddate: '2011-05-31 00:00:00'
        - currencyrateid: 4
          currencyratedate: '2011-05-31 00:00:00'
          fromcurrencycode: USD
          tocurrencycode: CAD
          averagerate: 1.4641
          endofdayrate: 1.4683
          modifieddate: '2011-05-31 00:00:00'
        - currencyrateid: 5
          currencyratedate: '2011-05-31 00:00:00'
          fromcurrencycode: USD
          tocurrencycode: CNY
          averagerate: 8.2781
          endofdayrate: 8.2784
          modifieddate: '2011-05-31 00:00:00'
        description: The currencyrate table contains exchange rate information between
          different currencies, including average and end-of-day rates, with dates
          and modification timestamps.
        kind: table
      - name: product
        columns:
        - name: productid
          type: INTEGER
          nullable: true
          description: Product ID is an integer field that can contain null values.
        - name: NAME
          type: TEXT
          nullable: true
          description: The `NAME` column stores the textual name of the product, which
            can be left empty. Unlike `productnumber`, which holds alphanumeric identifiers
            like "AR-5381", `NAME` typically contains descriptive titles such as "Mountain
            Bike" or "Helmet".
        - name: productnumber
          type: TEXT
          nullable: true
          description: The `productnumber` column stores a unique alphanumeric identifier
            for the product, such as "AR-5381" or "BE-2349". It differs from the `NAME`
            column, which may contain descriptive names and can also be left empty.
        - name: makeflag
          type: BOOLEAN
          nullable: true
          description: The `makeflag` column indicates whether the product is manufactured
            in-house, with a boolean value (true or false).
        - name: finishedgoodsflag
          type: BOOLEAN
          nullable: true
          description: A boolean column indicating whether the product is classified
            as a finished good.
        - name: color
          type: TEXT
          nullable: true
          description: The `color` column stores the color of the product as text
            and can contain null values.
        - name: safetystocklevel
          type: INTEGER
          nullable: true
          description: The `safetystocklevel` column represents the minimum quantity
            of a product that should be kept in stock to meet unexpected demand. It
            is an integer value and can be null.
        - name: reorderpoint
          type: INTEGER
          nullable: true
          description: The `reorderpoint` column indicates the inventory level at
            which a product should be reordered, stored as an integer value.
        - name: standardcost
          type: FLOAT
          nullable: true
          description: The `standardcost` column stores the standard cost of a product
            as a floating-point number and allows null values.
        - name: listprice
          type: FLOAT
          nullable: true
          description: The `listprice` column stores the price of the product as a
            floating-point number and can contain null values.
        - name: size
          type: TEXT
          nullable: true
          description: The `size` column stores the size of the product as text and
            can contain null values.
        - name: sizeunitmeasurecode
          type: TEXT
          nullable: true
          description: The `sizeunitmeasurecode` column stores the unit of measure
            for product size as text, and can contain null values.
        - name: weightunitmeasurecode
          type: TEXT
          nullable: true
          description: The `weightunitmeasurecode` column stores the unit of measure
            for product weight as text, and can contain null values.
        - name: weight
          type: FLOAT
          nullable: true
          description: The `weight` column stores the weight of a product as a floating-point
            number and can contain null values.
        - name: daystomanufacture
          type: INTEGER
          nullable: true
          description: The `daystomanufacture` column represents the number of days
            required to manufacture the product, with values stored as integers and
            null values allowed.
        - name: productline
          type: TEXT
          nullable: true
          description: The `productline` column stores text values representing the
            product line classification, and can contain null values.
        - name: class
          type: TEXT
          nullable: true
          description: The `class` column stores textual classification information
            for products, with values typically being empty or unspecified.
        - name: style
          type: TEXT
          nullable: true
          description: The `style` column contains text values indicating the style
            of the product, and it allows null values.
        - name: productsubcategoryid
          type: INTEGER
          nullable: true
          description: The `productsubcategoryid` is
        - name: productmodelid
          type: INTEGER
          nullable: true
          description: productmodelid is an integer column that can store null values,
            representing the identifier for the product model associated with the
            product.
        - name: sellstartdate
          type: DATE
          nullable: true
          description: The `sellstartdate` column stores the date when the product
            begins to be available for sale, with nullable values. It is paired with
            `sellenddate`, which marks when the product is no longer available for
            sale.
        - name: sellenddate
          type: DATE
          nullable: true
          description: The `sellenddate` column stores the date when the product is
            no longer available for sale, and it can contain null values. It is paired
            with `sellstartdate`, which marks when the product becomes available for
            sale.
        - name: discontinueddate
          type: DATE
          nullable: true
          description: The `discontinueddate` column stores the date when a product
            was discontinued, if applicable.
        - name: rowguid
          type: TEXT
          nullable: true
          description: A unique identifier for each row, stored as text.
        - name: modifieddate
          type: DATE
          nullable: true
          description: The `modifieddate` column stores the date when a product record
            was last modified, with the data type DATE and allows null values.
