        kind: table
      - name: countryregioncurrency
        columns:
        - name: countryregioncode
          type: TEXT
          nullable: true
          description: The `countryregioncode` column is a nullable text column representing
            the two-letter code for a country or region, such as "AE" for United Arab
            Emirates or "AR" for Argentina. It is used in conjunction with the `currencycode`
            column to associate a currency with a specific country or region.
        - name: currencycode
          type: TEXT
          nullable: true
          description: The `currencycode` column is a nullable text column representing
            the three-letter currency code associated with a country or region, such
            as "AED" for United Arab Emirates Dirham or "EUR" for Euro. It is used
            in conjunction with the `countryregioncode` column to associate a currency
            with a specific country or region. For example, "AE" in `countryregioncode`
            may correspond to "AED" in `currencycode`, while "AT" in `countryregioncode`
            may correspond to "EUR" in `currencycode`.
        - name: modifieddate
          type: DATE
          nullable: true
          description: The `modifieddate` column stores the date and time when a record
            was last modified, with some entries allowing null values.
        samples:
        - countryregioncode: AE
          currencycode: AED
          modifieddate: '2014-02-08 10:17:21.51'
        - countryregioncode: AR
          currencycode: ARS
          modifieddate: '2014-02-08 10:17:21.51'
        - countryregioncode: AT
          currencycode: ATS
          modifieddate: '2014-02-08 10:17:21.51'
        - countryregioncode: AT
          currencycode: EUR
          modifieddate: '2008-04-30 00:00:00'
        - countryregioncode: AU
          currencycode: AUD
          modifieddate: '2014-02-08 10:17:21.51'
        description: A table that maps country regions to their associated currencies,
          including the country region code, currency code, and the last modified
          date.
        kind: table
      - name: currencyrate
        columns:
        - name: currencyrateid
          type: INTEGER
          nullable: true
          description: Unique identifier for the currency rate record.
        - name: currencyratedate
          type: DATE
          nullable: true
          description: The currencyratedate column stores the date associated with
            the currency exchange rate. It is distinct from modifieddate, which records
            when the currency rate was last updated. For example, a currency rate
            might be recorded on 2011-05-31, while the modifieddate could also be
            2011-05-31 if
        - name: fromcurrencycode
          type: TEXT
          nullable: true
          description: The `fromcurrencycode` column represents the currency code
            of the source currency in the exchange rate record.
        - name: tocurrencycode
          type: TEXT
          nullable: true
          description: The `tocurrencycode` column represents the currency code for
            the currency into which the exchange rate is converted.
        - name: averagerate
          type: FLOAT
          nullable: true
          description: The averagerate column stores the average exchange rate for
            the day as a floating-point number, with null values allowed. It differs
            from endofdayrate, which represents the final exchange rate at the end
            of the trading day. For example, an average rate might be 1.5491, while
            the corresponding end-of-day rate could be 1.55.
        - name: endofdayrate
          type: FLOAT
          nullable: true
          description: The endofdayrate column stores the final exchange rate at the
            end of the trading day as a floating-point number. It differs from averagerate,
            which represents the average exchange rate for the day. For example, an
            average rate might be 1.5491, while the corresponding end-of-day rate
            could be 1.55.
        - name: modifieddate
          type: DATE
          nullable: true
          description: The `modifieddate` column stores the date when the currency
            rate was last modified.
        samples:
        - currencyrateid: 1
          currencyratedate: '2011-05-31 00:00:00'
          fromcurrencycode: USD
          tocurrencycode: ARS
          averagerate: 1.0
          endofdayrate: 1.0002
          modifieddate: '2011-05-31 00:00:00'
        - currencyrateid: 2
