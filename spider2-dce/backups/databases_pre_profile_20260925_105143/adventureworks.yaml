      - name: salesterritory
        columns:
        - name: territoryid
          type: INTEGER
          nullable: true
          description: territoryid is an integer column representing the unique identifier
            for a sales territory.
        - name: name
          type: TEXT
          nullable: true
          description: The "name" column contains textual descriptions of sales territories,
            such as "Northwest" or "Southeast."
        - name: countryregioncode
          type: TEXT
          nullable: true
          description: The `countryregioncode` column stores the country or region
            code associated with the sales territory, typically as a short text identifier
            (e.g., "US").
        - name: group
          type: TEXT
          nullable: true
          description: The `group` column represents a textual classification or region
            category for the sales territory, such as "North America."
        - name: salesytd
          type: FLOAT
          nullable: true
          description: The `salesytd` column represents the total sales amount for
            the current year to date, stored as a floating-point number. It is typically
            used in comparison with `saleslastyear` to analyze year-over-year performance.
            Sample values include 7887186.7882 and 3298694.4938 for `salesytd` and
            `saleslastyear`, respectively.
        - name: saleslastyear
          type: FLOAT
          nullable: true
          description: The `saleslastyear` column stores the total sales amount for
            the previous year, represented as a floating-point number. It is typically
            used in comparison with `salesytd` to analyze year-over-year performance.
            Sample values include 3298694.4938 and 7887186.7882 for `saleslastyear`
            and `salesytd`, respectively.
        - name: costytd
          type: FLOAT
          nullable: true
          description: The `costytd` column represents the total cost for the current
            year to date, stored as a floating-point number. It is typically used
            in comparison with `costlastyear` to analyze year-over-year cost trends
        - name: costlastyear
          type: FLOAT
          nullable: true
          description: The `costlastyear` column stores the total cost for the previous
            year as a floating-point number, and it can contain null values.
        - name: rowguid
