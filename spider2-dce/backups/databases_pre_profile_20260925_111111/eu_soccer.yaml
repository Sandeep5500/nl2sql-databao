    - name: main
      tables:
      - name: Country
        columns:
        - name: id
          type: INTEGER
          nullable: false
          description: The `id` column is an integer type, not nullable, and serves
            as the primary key for the Country table.
        - name: name
          type: TEXT
          nullable: true
          description: A column named 'name' of type TEXT that can contain null values.
        samples:
        - id: 1
          name: Belgium
        - id: 1729
          name: England
        - id: 4769
          name: France
        - id: 7809
          name: Germany
        - id: 10257
          name: Italy
        description: A table containing country information with unique identifiers
          and names. Each country is uniquely identified by an integer ID, and country
          names are also unique.
        kind: table
        primary_key:
          name: pk_Country
          columns:
          - id
          validated: true
        unique_constraints:
        - name: sqlite_autoindex_Country_1
          columns:
          - name
          validated: true
      - name: League
        columns:
        - name: id
          type: INTEGER
          nullable: false
          description: The `id` column is an integer that uniquely identifies each
            league and cannot be null.
        - name: country_id
          type: INTEGER
          nullable: true
          description: The `country_id` column is a nullable integer that serves as
            a foreign key linking the league to its associated country. It differs
            from the `id` column, which uniquely identifies each league, by referencing
            the country's identifier instead. For example, a league with `id` 1729
            might have a `country_id` of 1.
        - name: name
          type: TEXT
          nullable: true
          description: The `name` column stores the textual name of the league and
            can contain null values. It differs from the `id` and `country_id` columns,
            which are numeric identifiers, by providing a human-readable label for
            the league. For example, a league with `id` 1729 might have the `name`
            "England Premier League".
        samples:
        - id: 1
          country_id: 1
          name: Belgium Jupiler League
        - id: 1729
          country_id: 1729
          name: England Premier League
        - id: 4769
          country_id: 4769
          name: France Ligue 1
        - id: 7809
          country_id: 7809
          name: Germany 1. Bundesliga
        - id: 10257
          country_id: 10257
          name: Italy Serie A
        description: A table containing information about sports leagues, including
          an identifier, associated country, and league name. Each league must have
          a unique name, and the country_id references the country table.
        kind: table
        primary_key:
          name: pk_League
          columns:
          - id
          validated: true
        unique_constraints:
        - name: sqlite_autoindex_League_1
          columns:
          - name
          validated: true
        foreign_keys:
        - name: fk_League_0
          mapping:
          - from_column: country_id
            to_column: id
          referenced_table: main.country
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
      - name: Match
        columns:
        - name: id
          type: INTEGER
          nullable: false
          description: Unique identifier for each match record.
        - name: country_id
          type: INTEGER
          nullable: true
          description: Represents the identifier for the country associated with the
            match, allowing null values.
        - name: league_id
          type: INTEGER
          nullable: true
          description: The `league_id` column is an optional integer field that references
            the `id` of a league in the `League` table.
        - name: season
          type: TEXT
          nullable: true
          description: The `season` column stores the season during which the match
            took place, represented as text (e.g., "2008/2009"). It is optional and
            may contain null values.
        - name: stage
          type: INTEGER
          nullable: true
          description: Represents the stage or round of the match within a season.
        - name: date
          type: TEXT
          nullable: true
          description: The `date` column stores the date and time of a match as text,
            with values formatted like 'YYYY-MM-DD HH:MM:SS'. It is nullable, meaning
            matches may not always have a recorded date.
        - name: match_api_id
          type: INTEGER
          nullable: true
          description: Unique identifier for the match from an external API.
        - name: home_team_api_id
          type: INTEGER
          nullable: true
          description: The `home_team_api_id` column is an integer column representing
            the API identifier for the home team in a match. It differs from `away_team_api_id`,
            which represents the away team's API identifier. A query would use this
            column when identifying or filtering matches by the home team's API ID,
            whereas `away_team_api_id` would be used for the away team. Sample values
            include 9987 and 10000 for this column, while `away_team_api_id` includes
            values like 9993 and 9994.
        - name: away_team_api_id
          type: INTEGER
          nullable: true
          description: The `away_team_api_id` column is an integer column representing
            the API identifier for the away team in a match. It differs from `home_team_api_id`,
            which represents the home team's API identifier. A query would use this
            column when identifying or filtering matches by the away team's API ID,
            whereas `home_team_api_id` would be used for the home team. Sample values
            include 9993 and 9994 for this column, while `home_team_api_id` includes
            values like 9987 and 1
        - name: home_team_goal
