      - name: Player
        columns:
        - name: id
          type: INTEGER
          nullable: false
          description: The `id` column is an integer that uniquely identifies each
            player and cannot be null.
        - name: player_api_id
          type: INTEGER
          nullable: true
          description: The `player_api_id` column is an integer used to uniquely identify
            a player in an external API. It differs from `player_fifa_api_id`, which
            is used specifically for the FIFA API. For example, `player_api_id` might
            contain a value like 505942, while `player_fifa_api_id` might contain
            218353.
        - name: player_name
          type: TEXT
          nullable: true
          description: Player name, stored as text and may contain null values.
        - name: player_fifa_api_id
          type: INTEGER
          nullable: true
          description: The `player_fifa_api_id` column is an integer used to uniquely
            identify a player in the FIFA API. It differs from `player_api_id`, which
            is used for a general external API. For example, `player_api_id` might
            contain a value like 505942, while `player_fifa_api_id` might contain
            218353.
        - name: birthday
          type: TEXT
          nullable: true
          description: The `birthday` column stores the birthdate of players as text,
            with a date and time format (e.g., '1992-02-29 00:00:00'). It allows null
            values.
        - name: height
          type: INTEGER
          nullable: true
          description: The `height` column stores the player's height in integer format,
            likely in centimeters, and allows null values. It differs from `weight`,
            which stores body weight in kilograms. For example, a player might have
            a `height` of 182 and a `weight` of 18
        - name: weight
          type: INTEGER
          nullable: true
          description: The `weight` column stores the body weight of players in kilograms,
            as an integer value, and allows null entries.
