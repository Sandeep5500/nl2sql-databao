datasource_id: databases/log.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: access_log
        columns:
        - name: session
          type: varchar(255)
          nullable: true
          description: The `session` column stores session identifiers as variable-length
            strings, up to 255 characters, and allows null values. It is distinct
            from the `user_id` column, which identifies individual users rather than
            sessions; for example, a session might be "98900e" while the associated
            user_id could be "U001".
        - name: user_id
          type: varchar(255)
          nullable: true
          description: The `user_id` column stores user identifiers as variable-length
            strings, allowing null values. It is distinct from the `session` column,
            which identifies individual sessions rather than users; for example, a
            session might be "1cf768" while the associated user_id could be "U002".
        - name: action
          type: varchar(255)
          nullable: true
          description: The `action` column stores the type of action performed, such
            as "view," and allows null values.
        - name: stamp
          type: varchar(255)
          nullable: true
          description: The `stamp` column stores timestamp data as variable-length
            strings, with entries formatted as date and time values (e.g., '2016-01-01
            18:00:00').
        samples:
        - session: 98900e
          user_id: U001
          action: view
          stamp: '2016-01-01 18:00:00'
        - session: 98900e
          user_id: U001
          action: view
          stamp: '2016-01-02 20:00:00'
        - session: 98900e
          user_id: U001
          action: view
          stamp: '2016-01-03 22:00:00'
        - session: 1cf768
          user_id: U002
          action: view
          stamp: '2016-01-04 23:00:00'
        - session: 1cf768
          user_id: U002
          action: view
          stamp: '2016-01-05 00:30:00'
        description: The access_log table records user activity sessions with details
          including session ID, user ID, action performed, and timestamp.
        kind: table
      - name: action_log
        columns:
        - name: session
          type: varchar(255)
          nullable: true
          description: The `session` column stores a unique string identifier for
            a user session, used to track user activity across actions. It differs
            from `user_id` in that it identifies a specific session rather than the
            user themselves; for example, a single user (e.g., `U001`) may have multiple
            sessions (e.g., `989004ea`).
        - name: user_id
          type: varchar(255)
          nullable: true
          description: The `user_id` column stores user identifiers as variable-length
            strings, allowing null values. It differs from `session` in that it identifies
            the user rather than a specific session; for example, a user (e.g., `U001`)
            may have multiple sessions (e.g., `989004ea`).
        - name: action
          type: varchar(255)
          nullable: true
          description: The "action" column stores the type of user interaction, such
            as "purchase," "view," "favorite," "review," or "add_cart."
        - name: category
          type: varchar(255)
          nullable: true
          description: The `category` column stores the category associated with an
            action, such as "drama," and is used to classify the type of product or
            content involved.
        - name: products
          type: varchar(255)
          nullable: true
          description: The `products` column stores a comma-separated list of product
            identifiers as variable-length text, with a maximum length of 255 characters.
            It is used in conjunction with the `action` column to indicate which products
            were involved in a given action, such as "purchase" or "add_cart."
        - name: amount
          type: INTEGER
          nullable: true
          description: The amount column stores integer values representing numerical
            data related to actions, such as purchase amounts.
        - name: stamp
          type: varchar(255)
          nullable: true
          description: The `stamp` column stores timestamp information as a string,
            indicating when actions occurred, with sample values formatted as 'YYYY-MM-DD
            HH:MM:SS'.
        samples:
        - session: 989004ea
          user_id: U001
          action: purchase
          category: drama
          products: D001,D002
          amount: 2000
          stamp: '2016-11-03 18:10:00'
        - session: 989004ea
          user_id: U001
          action: view
          stamp: '2016-11-03 18:00:00'
        - session: 989004ea
          user_id: U001
          action: favorite
          category: drama
          products: D001
          stamp: '2016-11-03 18:00:00'
        - session: 989004ea
          user_id: U001
          action: review
          category: drama
          products: D001
          stamp: '2016-11-03 18:00:00'
        - session: 989004ea
          user_id: U001
          action: add_cart
          category: drama
          products: D001
          stamp: '2016-11-03 18:00:00'
        description: A table that records user actions such as purchases, views, favorites,
          reviews, and cart additions, including details like session, user ID, category,
          products, amount, and timestamp.
        kind: table
      - name: action_log_with_ip
        columns:
        - name: session
          type: varchar(255)
          nullable: true
          description: The `session` column is a string identifier for a user session,
            up to 255 characters, which may be null. It is distinct from the `user_id`
            column, which identifies the user rather than the session. A query would
            use `session` to track activity within a specific session, whereas `user_id`
            would be used to aggregate actions across all sessions for a given user.
        - name: user_id
          type: varchar(255)
          nullable: true
          description: The `user_id` column stores user identifiers as variable-length
            strings, allowing null values. It is distinct from the `session` column,
            which identifies a specific session rather than the user. A query would
            use `user_id` to analyze user-level behavior across sessions, while `session`
            would be used to isolate actions within a single session.
        - name: action
          type: varchar(255)
          nullable: true
          description: The "action" column stores the type of action performed, such
            as "view," as a variable-length string with a maximum length of 255 characters.
        - name: ip
          type: varchar(255)
          nullable: true
          description: The `ip` column stores the IP address associated with each
            action, with a maximum length of 255 characters and the ability to store
            null values.
        - name: stamp
          type: varchar(255)
          nullable: true
          description: The `stamp` column stores timestamp data as variable-length
            strings, with a maximum length of 255 characters. It is nullable and typically
            contains date and time information in a text format, such as '2016-11-03
            18:00:00'.
        samples:
        - session: 0CVKaz
          user_id: U001
          action: view
          ip: 216.58.220.238
          stamp: '2016-11-03 18:00:00'
        - session: 1QceiB
          user_id: U002
          action: view
          ip: 98.139.183.24
          stamp: '2016-11-03 19:00:00'
        - session: 1hI43A
          user_id: U003
          action: view
          ip: 210.154.149.63
          stamp: '2016-11-03 20:00:00'
        - session: 989004ea
          user_id: U001
          action: view
          ip: 216.58.220.238
          stamp: '2016-11-03 18:00:00'
        - session: 47db0370
          user_id: U002
          action: view
          ip: 98.139.183.24
          stamp: '2016-11-03 19:00:00'
        description: A table logging user actions with session, user ID, action type,
          IP address, and timestamp information.
        kind: table
      - name: action_log_with_noise
        columns:
        - name: stamp
          type: varchar(255)
