        samples: []
        description: A table containing logs of actions with associated details such
          as timestamps, sessions, actions performed, products, URLs, IP addresses,
          and user agents, including nullable fields.
        kind: table
      - name: activity_log
        columns:
        - name: stamp
          type: varchar(255)
          nullable: true
          description: A column storing timestamp information as variable-length text,
            allowing null values.
        - name: session
          type: varchar(255)
          nullable: true
          description: A field storing session identifiers, used to track user sessions,
            with variable-length string values up to 255 characters.
        - name: action
          type: varchar(255)
          nullable: true
          description: The "action" column stores the general category of user interaction,
            such as 'view', and is typically paired with the "option" column to provide
            more specific context about the action taken. For example, while "action"
            might contain 'view', the "option" column might specify 'search' or 'detail'
            to clarify the nature of the view.
        - name: option
          type: varchar(255)
          nullable: true
          description: The "option" column provides specific context about the type
            of action taken, such as "search", "page", or "detail", and is typically
            used in conjunction with the "action" column. For example, if "action"
            is 'view', "option" might clarify it as 'search' or 'detail', whereas
            "action" alone only indicates the general category.
        - name: path
          type: varchar(255)
          nullable: true
          description: A field storing the URL path associated with each activity
            log entry.
        - name: search_type
          type: varchar(255)
          nullable: true
          description: A column storing the type of search associated with an activity,
            such as "Area-L-with-Job" or "Pref". It can contain null values.
        samples:
        - stamp: '2017-01-09 12:18:43'
          session: 989004ea
          action: view
          option: search
          path: /search_list/
          search_type: Area-L-with-Job
        - stamp: '2017-01-09 12:19:27'
          session: 989004ea
          action: view
          option: page
          path: /search_input/
          search_type: ''
        - stamp: '2017-01-09 12:20:03'
          session: 989004ea
          action: view
          option: search
          path: /search_list/
          search_type: Pref
        - stamp: '2017-01-09 12:18:43'
          session: 47db0370
          action: view
          option: search
          path: /search_list/
          search_type: Area-S
        - stamp: '2017-01-09 12:18:43'
          session: 1cf7678e
          action: view
          option: detail
          path: /detail/
          search_type: ''
        description: A table that records user activity with fields such as timestamp,
          session ID, action type, option, path, and search type. It captures interactions
          like views on search pages or details.
        kind: table
