        - name: card_id
          type: INTEGER
          nullable: true
          description: The `card_id` column is an integer column that can contain
            null values, used in the Matches table to reference card information.
            It differs from `id`, which uniquely identifies each match, and from `winner_id`
            and `loser_id`, which store participant identifiers as text.
        - name: winner_id
          type: TEXT
          nullable: true
          description: The `winner_id` column stores the identifier of the match winner
            as text and can contain null values. It is distinct from `loser_id`, which
            stores the identifier of the losing participant, and from `card_id`, which
            references card information. For example, `winner_id` might contain "1",
            while `loser_id` might contain "2".
        - name: win_type
          type: TEXT
          nullable: true
          description: The `win_type` column stores the type of win for a match, such
            as "def." or "def. (CO)", and allows null values.
        - name: loser_id
          type: TEXT
          nullable: true
          description: The `loser_id` column stores the identifier of the losing participant
            in a match, represented as text and allowing null values. It is distinct
            from `winner_id`, which stores the identifier of the winning participant.
            For example, `winner_id` might contain "1", while `loser_id` might contain
            "2".
        - name: match_type_id
          type: TEXT
          nullable: true
          description: The `match_type_id` column stores text values indicating the
            type of match and can contain null values.
        - name: duration
          type: TEXT
          nullable: true
          description: The `duration` column stores the length of a match as text
