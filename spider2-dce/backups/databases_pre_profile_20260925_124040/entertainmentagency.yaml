      - name: Engagements
        columns:
        - name: EngagementNumber
          type: INT
          nullable: false
          description: EngagementNumber is a non-nullable integer column with a default
            value of 0, serving as the primary key for the Engagements table. Unlike
            other ID columns like CustomerID, AgentID, or EntertainerID, it uniquely
            identifies each engagement record and is not used to reference external
            entities.
          default_expression: '0'
        - name: StartDate
          type: date
          nullable: true
          description: StartDate is a nullable date column representing the starting
            date of an engagement. It is used in conjunction with EndDate to define
            the date range of the engagement. When querying for engagements on a specific
            date, this column is used to filter by the start date.
        - name: EndDate
          type: date
          nullable: true
          description: EndDate is a nullable date column representing the end date
            of an engagement. It is used in conjunction with StartDate to define the
            date range of the engagement. When querying for engagements on or before
            a specific date, this column is used to filter by the end date.
        - name: StartTime
          type: time
          nullable: true
          description: StartTime is a nullable time column representing the starting
            time of an engagement. It is used in conjunction with StopTime to define
            the time window of the engagement. When querying for engagements starting
            at a specific time, this column is used.
        - name: StopTime
          type: time
          nullable: true
          description: StopTime is a nullable time column representing the end time
            of an engagement.
        - name: ContractPrice
          type: decimal(15, 2)
          nullable: true
          description: ContractPrice is a decimal column with up to 15 digits and
            2 decimal places, allowing null values and defaulting to 0 when unspecified.
          default_expression: '0'
        - name: CustomerID
          type: INT
          nullable: true
          description: CustomerID is an integer column that stores the identifier
            of the customer associated with an engagement. It allows null values and
            defaults to 0 if not specified.
          default_expression: '0'
        - name: AgentID
          type: INT
          nullable: true
          description: AgentID is an integer column that stores the identifier of
            the agent associated with an engagement. It allows null values and defaults
            to 0 if not specified.
          default_expression: '0'
        - name: EntertainerID
          type: INT
          nullable: true
          description: EntertainerID is an integer column that stores the identifier
            for the entertainer associated with an engagement. It allows null values
            and defaults to 0 if not specified.
          default_expression: '0'
        samples:
        - engagementnumber: 2
          startdate: '2017-09-02'
          enddate: '2017-09-06'
          starttime: '13:00:00'
          stoptime: '15:00:00'
          contractprice: 200
          customerid: 10006
