datasource_id: databases/entertainmentagency.yaml
datasource_type: sqlite
context:
  catalogs:
  - name: default
    schemas:
    - name: main
      tables:
      - name: Agents
        columns:
        - name: AgentID
          type: INT
          nullable: false
          description: AgentID is an integer column that uniquely identifies each
            agent and cannot be null.
        - name: AgtFirstName
          type: nvarchar (25)
          nullable: true
          description: AgtFirstName is a column in the Agents table that stores the
            first name of an agent as a variable-length Unicode string with a maximum
            length of 25 characters. It allows null values.
        - name: AgtLastName
          type: nvarchar (25)
          nullable: true
          description: AgtLastName is a column in the Agents table that stores the
            last name of an agent as a variable-length string with a maximum of 25
            characters. It allows null values.
        - name: AgtStreetAddress
          type: nvarchar (50)
          nullable: true
          description: AgtStreetAddress is a column in the Agents table that stores
            the street address of an agent as a variable-length Unicode string, up
            to 50 characters, and allows null values.
        - name: AgtCity
          type: nvarchar (30)
          nullable: true
          description: AgtCity is a column in the Agents table that stores the city
            name of an agent's address, with a maximum length of 30 characters.
        - name: AgtState
          type: nvarchar (2)
          nullable: true
          description: AgtState is a nullable column storing the two-character state
            abbreviation for an agent's location.
        - name: AgtZipCode
          type: nvarchar (10)
          nullable: true
          description: AgtZipCode is a nullable column storing postal codes as variable-length
            text up to 10 characters.
        - name: AgtPhoneNumber
          type: nvarchar (15)
          nullable: true
          description: AgtPhoneNumber is a column that stores agent phone numbers
            as variable-length text, allowing up to 15 characters, and can contain
            null values.
        - name: DateHired
          type: date
          nullable: true
          description: DateHired is a nullable date column that stores the date an
            agent was hired.
        - name: Salary
          type: decimal(15, 2)
          nullable: true
          description: Salary is a decimal field with up to 15 digits and 2 decimal
            places, allowing null values and defaulting to 0 when unspecified.
          default_expression: '0'
        - name: CommissionRate
          type: float(24)
          nullable: true
          description: CommissionRate is a nullable float column with a default value
            of 0, representing the commission rate for agents.
          default_expression: '0'
