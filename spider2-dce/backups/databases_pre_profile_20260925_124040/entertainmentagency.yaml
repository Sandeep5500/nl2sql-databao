          on_delete: no action
        - name: fk_Entertainer_Styles_1
          mapping:
          - from_column: EntertainerID
            to_column: EntertainerID
          referenced_table: main.Entertainers
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
