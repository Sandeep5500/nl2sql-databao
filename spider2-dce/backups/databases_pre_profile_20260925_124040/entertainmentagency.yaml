        description: The Engagements table stores details about engagement bookings,
          including dates, times, contract prices, and references to related entities
          like customers, agents, and entertainers. Each engagement is uniquely identified
          by an EngagementNumber.
        kind: table
        primary_key:
          name: pk_Engagements
          columns:
          - EngagementNumber
          validated: true
        indexes:
        - name: AgentsEngagements
          columns:
          - AgentID
          unique: false
        - name: CustomersEngagements
          columns:
          - CustomerID
          unique: false
        - name: Engagements_EmployeeID
          columns:
          - AgentID
          unique: false
        - name: EntertainersEngagements
          columns:
          - EntertainerID
          unique: false
        foreign_keys:
        - name: fk_Engagements_0
          mapping:
          - from_column: EntertainerID
            to_column: EntertainerID
          referenced_table: main.Entertainers
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
        - name: fk_Engagements_1
          mapping:
          - from_column: CustomerID
            to_column: CustomerID
          referenced_table: main.Customers
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
        - name: fk_Engagements_2
          mapping:
          - from_column: AgentID
            to_column: AgentID
          referenced_table: main.Agents
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
      - name: Entertainer_Members
        columns:
        - name: EntertainerID
          type: INT
          nullable: false
          description: EntertainerID is an integer column that uniquely identifies
            an entertainer and cannot be null. It is distinct from MemberID, which
            identifies a member from the Members table and is used to establish a
            relationship between an entertainer and a member.
        - name: MemberID
          type: INT
          nullable: false
          description: MemberID is an integer column that cannot be null, with a default
            value of 0. It is part of the primary key and references the MemberID
            in the Members table. It is distinct from EntertainerID, which uniquely
            identifies an entertainer and is used to link a member to an entertainer.
          default_expression: '0'
        - name: Status
          type: smallint
          nullable: true
          description: Status is a nullable smallint column with a default value of
            0, indicating the current status of an entertainer-member relationship.
          default_expression: '0'
        samples:
        - entertainerid: 1001
          memberid: 106
          status: 1
        - entertainerid: 1001
          memberid: 107
          status: 1
        - entertainerid: 1001
          memberid: 118
          status: 2
        - entertainerid: 1002
          memberid: 120
          status: 2
        - entertainerid: 1002
          memberid: 121
          status: 1
        description: A table that links entertainers to members, storing their relationship
          status. It includes foreign keys to the Entertainers and Members tables.
        kind: table
        primary_key:
          name: pk_Entertainer_Members
          columns:
          - EntertainerID
          - MemberID
          validated: true
        indexes:
        - name: EntertainersEntertainerMembers
          columns:
          - EntertainerID
          unique: false
        - name: MembersEntertainerMembers
          columns:
          - MemberID
          unique: false
        foreign_keys:
        - name: fk_Entertainer_Members_0
          mapping:
          - from_column: MemberID
            to_column: MemberID
          referenced_table: main.Members
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
        - name: fk_Entertainer_Members_1
          mapping:
          - from_column: EntertainerID
            to_column: EntertainerID
          referenced_table: main.Entertainers
          enforced: true
          validated: true
          on_update: no action
          on_delete: no action
      - name: Entertainer_Styles
        columns:
        - name: EntertainerID
          type: INT
          nullable: false
          description: EntertainerID is an integer column that uniquely identifies
            an entertainer and cannot be null.
        - name: StyleID
          type: smallint
          nullable: false
          description: StyleID is a non-nullable smallint column with a default value
            of 0, representing the unique identifier for a musical style associated
            with an entertainer. It differs from StyleStrength, which measures the
            proficiency level in a style rather than identifying the style itself.
          default_expression: '0'
        - name: StyleStrength
          type: smallint
          nullable: false
          description: StyleStrength is a non-nullable smallint column that represents
            the proficiency level of an entertainer in a specific musical style, measured
            as a small integer value. It differs from StyleID, which uniquely identifies
            the musical style rather than the level of expertise in that style.
        samples:
        - entertainerid: 1001
          styleid: 10
          stylestrength: 2
        - entertainerid: 1001
          styleid: 20
          stylestrength: 1
        - entertainerid: 1001
