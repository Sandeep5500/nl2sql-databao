          stylestrength: 3
        - entertainerid: 1002
          styleid: 17
          stylestrength: 2
        - entertainerid: 1002
          styleid: 19
          stylestrength: 1
        description: A table that links entertainers to musical styles, indicating
          the strength of each style associated with an entertainer. It connects to
          the Entertainers and Musical_Styles tables through foreign keys.
        kind: table
        primary_key:
          name: pk_Entertainer_Styles
          columns:
          - EntertainerID
          - StyleID
          validated: true
        indexes:
        - name: EntertainersEntertainerStyles
          columns:
