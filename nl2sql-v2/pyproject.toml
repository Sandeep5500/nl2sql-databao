[project]
name = "nl2sql-v2"
version = "0.1.0"
description = "Lean text2sql agent harness for Spider 2.0-Lite local"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "duckdb>=1.1",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "databao-context-engine",
    "sqlglot>=30.18.0",
    "inspect-ai>=0.3.263",
]

[tool.uv.sources]
databao-context-engine = { path = "../databao-context-engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nl2sql"]
