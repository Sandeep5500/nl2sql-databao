[project]
name = "nl2sql-v2"
version = "0.1.0"
description = "Lean text2sql agent harness for Spider 2.0-Lite local"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "duckdb>=1.1",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "databao-context-engine",
    "sqlglot>=30.18.0",
    "inspect-ai>=0.3.263",
]

# Kept out of the base set so the local SQLite lane's environment is unchanged;
# both are imported lazily, inside the code paths that need them.
[project.optional-dependencies]
snowflake = ["snowflake-connector-python[pandas]>=3.12"]
# the Modal image (modal/run_bench.py) installs this itself; this extra is for
# running the BigQuery scripts (bq_spend.py, bigquery_preflight.py,
# enrich_bq_stats.py) locally against real BigQuery, outside Modal.
bigquery = ["google-cloud-bigquery>=3.25", "db-dtypes>=1.2"]
# local embedding for build_bq_context.py / context.py's search index, mirroring
# modal/run_bench.py's embed_image. Not needed to run the benchmark itself.
embed = ["sentence-transformers>=3.0", "einops>=0.8"]
# pinned to the 1.9 line: 1.12.5 ships a metricflow combination that cannot
# parse a manifest at all (ModuleNotFoundError in semantic_manifest), and
# Spider2's vendored dbt_packages are version-coupled anyway.
dbt = ["dbt-core>=1.9,<1.10", "dbt-duckdb>=1.9,<1.10"]

[tool.uv.sources]
databao-context-engine = { path = "../databao-context-engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nl2sql"]
